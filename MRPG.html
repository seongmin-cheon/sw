<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상인RPG</title>
  <style>
/* ===== 상인RPG - 모바일 세로형 캐주얼 판타지 스타일 ===== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }

:root{
  --bg:#fff7e8;
  --panel:#fffdf7;
  --panel2:#f2fbff;
  --ink:#344054;
  --ink-dim:#667085;
  --gold:#f9b84a;
  --line:#7d91a8;
  --accent:#5f9df7;
  --accent2:#ff8f70;
  --green:#5dbb83;
  --red:#f15d6c;
  --frame:#c8ddf2;
  --shadow:rgba(45,72,105,.18);
}

html,body{ height:100%; min-height:100%; }
body{
  font-family:'Galmuri11','DungGeunMo','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:
    linear-gradient(135deg,rgba(255,255,255,.65) 25%,transparent 25%) 0 0/32px 32px,
    linear-gradient(315deg,rgba(255,255,255,.5) 25%,transparent 25%) 0 0/32px 32px,
    linear-gradient(180deg,#cfefff 0%,#fff3cf 54%,#ffdfe3 100%);
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  min-height:100svh;
  letter-spacing:0;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}

/* 반응형 게임 프레임 */
#app{
  position:relative;
  width:min(100vw, 1180px);
  height:min(100vh, 860px);
  height:min(100svh, 860px);
  min-width:320px;
  min-height:560px;
  background:var(--bg);
  overflow:hidden;
  border:4px solid #fff;
  border-radius:24px;
  box-shadow:0 20px 70px var(--shadow), 0 0 0 2px rgba(125,145,168,.24);
}
@media (orientation:portrait){
  #app{ width:min(100vw, 520px); height:100vh; height:100svh; max-height:none; }
}
@media (orientation:landscape){
  #app{ width:100vw; height:100vh; height:100svh; max-width:none; max-height:none; border:none; border-radius:0; box-shadow:none; }
}
@media (max-width:700px){
  #app{ width:100vw; height:100vh; height:100svh; border:none; border-radius:0; box-shadow:none; }
}
@supports (height:100dvh){
  body{ min-height:100dvh; }
  #app{ height:min(100dvh, 860px); }
  @media (orientation:portrait){ #app{ height:100dvh; } }
  @media (orientation:landscape){ #app{ height:100dvh; max-height:none; } }
  @media (max-width:700px){ #app{ height:100dvh; } }
}

/* ===== 화면 전환 ===== */
.screen{ display:none; position:absolute; inset:0; flex-direction:column; }
.screen.active{ display:flex; }

/* ===== 버튼 공통 ===== */
.btn{
  font-family:inherit; font-size:16px; font-weight:bold;
  color:var(--ink); background:var(--panel2);
  border:2px solid rgba(125,145,168,.55); border-bottom-width:4px;
  padding:12px; min-height:48px; cursor:pointer;
  border-radius:16px; transition:transform .08s, box-shadow .15s, filter .15s;
  box-shadow:0 5px 12px rgba(45,72,105,.11);
}
.btn:hover{ filter:brightness(1.03); }
.btn:active{ transform:translateY(2px); border-bottom-width:2px; box-shadow:0 2px 7px rgba(45,72,105,.1); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-main{ background:linear-gradient(180deg,#8fc3ff,#5f9df7); color:#fff; border-color:#477fcf; }
.btn-sub{ background:#fffdf7; }
.btn-danger{ background:linear-gradient(180deg,#ff9aa5,#f15d6c); color:#fff; border-color:#c94b59; }

/* ===== 시작 화면 ===== */
#screen-start{ background:linear-gradient(180deg,#d9f2ff 0%,#fff6dc 58%,#ffe4eb 100%); }
.start-inner{ padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; height:100%; overflow-y:auto; }
.game-title{ font-size:42px; text-align:center; color:#f39b2f; margin:10px 0 4px; text-shadow:0 3px 0 #fff, 0 8px 18px rgba(249,184,74,.35); }
.game-title span{ color:#4b93ed; }
.slot-label{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
#slot-list{ display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:12px; }
.slot-card{
  border:2px solid var(--frame); border-radius:12px; padding:8px 9px;
  background:rgba(255,253,247,.92); cursor:pointer; position:relative;
  box-shadow:0 5px 14px rgba(45,72,105,.08); min-height:88px;
}
.slot-card.selected{ border-color:var(--gold); background:#fff9e8; box-shadow:0 0 0 3px rgba(249,184,74,.24), 0 8px 20px rgba(45,72,105,.1); }
.slot-card .slot-head{ display:flex; justify-content:space-between; gap:6px; font-size:12px; font-weight:bold; margin-bottom:5px; align-items:center; }
.slot-card .sel-tag{ color:var(--gold); font-size:10px; white-space:nowrap; }
.slot-card .slot-info{ font-size:10px; color:var(--ink-dim); line-height:1.35; display:grid; gap:1px; }
.slot-card .slot-info span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot-card.empty{ color:var(--ink-dim); text-align:center; padding:14px 9px; min-height:72px; display:flex; flex-direction:column; justify-content:center; }
.start-btns{ display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-bottom:env(safe-area-inset-bottom,0px); }
.start-credit{ margin-top:auto; padding-top:14px; text-align:center; color:rgba(52,64,84,.58); font-size:10px; line-height:1.5; }
@media (min-width:560px){
  #slot-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (min-width:900px){
  #slot-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:340px){
  #slot-list{ grid-template-columns:1fr; }
}

/* ===== 캐릭터 생성 ===== */
#screen-create{ background:linear-gradient(180deg,#e9f8ff,#fff8e8); padding:20px 18px; overflow-y:auto; }
.create-inner{ display:flex; flex-direction:column; gap:16px; height:100%; }
.screen-title{ font-size:24px; color:var(--gold); text-align:center; }
.field label{ display:block; font-size:14px; color:var(--ink-dim); margin-bottom:8px; }
#input-name{
  width:100%; font-family:inherit; font-size:18px; padding:12px;
  background:#fff; border:2px solid var(--frame); color:var(--ink); border-radius:14px;
  box-shadow:inset 0 2px 5px rgba(45,72,105,.06);
  -webkit-user-select:text; user-select:text;
}
.opt-row{ display:flex; gap:10px; }
.opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt{
  flex:1; font-family:inherit; font-size:15px; font-weight:bold; color:var(--ink);
  background:var(--panel); border:2px solid var(--frame); border-radius:16px;
  padding:12px 8px; cursor:pointer; display:flex; flex-direction:column; gap:3px; align-items:center;
  box-shadow:0 5px 12px rgba(45,72,105,.08);
}
.opt small{ font-size:11px; color:var(--ink-dim); font-weight:normal; }
.opt.selected{ border-color:#4b93ed; background:#e7f2ff; box-shadow:0 0 0 3px rgba(95,157,247,.18); }
.opt.selected small{ color:#47708f; }
.create-btns{ display:flex; gap:10px; margin-top:auto; }
.create-btns .btn{ flex:1; }

/* ===== 프롤로그 ===== */
#screen-prologue{ background:linear-gradient(180deg,#ffd5dc,#fff2dc 55%,#d9edff); padding:20px; justify-content:center; }
.prologue-scene{ height:200px; position:relative; margin-bottom:20px; }
.prologue-scene .sprite{ position:absolute; bottom:0; }
.npc-demon.big{ left:8%; transform:scale(1.6); }
.player-fallen{ left:46%; transform:rotate(80deg) scale(.9); filter:grayscale(.6); }
.player-child{ right:10%; }
.prologue-text{
  background:rgba(255,253,247,.92); border:2px solid var(--frame); border-radius:18px;
  padding:18px; font-size:14px; line-height:1.9; min-height:200px; color:var(--ink);
  white-space:pre-line; overflow-y:auto; max-height:340px;
  box-shadow:0 8px 22px rgba(45,72,105,.13);
}
.prologue-btns{ display:flex; gap:10px; margin-top:16px; }
.prologue-btns .btn{ flex:1; }

/* ===== 메인 게임: 상단바 (높이 ~12%+목표) ===== */
#topbar{ background:linear-gradient(180deg,#ffffff,#f3fbff); border-bottom:2px solid var(--frame); padding:8px 10px; font-size:12px; }
.top-row1{ display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap:wrap; }
.top-row1 .badge{ background:#e9f3ff; color:#3d7bc9; padding:3px 8px; border-radius:999px; font-size:11px; border:1px solid #bfdcff; }
#t-name{ font-weight:bold; font-size:14px; }
.top-row1 #t-gender,.top-row1 #t-job{ color:var(--ink-dim); }
.top-row2{ display:flex; justify-content:space-between; gap:10px; font-size:13px; flex-wrap:wrap; }
.top-row2 b{ color:var(--gold); }
.t-gold b{ color:var(--gold); }
.t-hp b{ color:#f15d6c; }
.t-vital b{ color:#f29f05; }
.hp-wrap{ display:flex; align-items:center; gap:6px; min-width:120px; }
.hp-mini{ width:70px; height:8px; background:linear-gradient(180deg,#fff3f4,#ffd8dd); border-radius:999px; overflow:hidden; border:1px solid #ffc0c8; box-shadow:inset 0 1px 3px rgba(140,58,72,.18),0 0 0 2px rgba(255,255,255,.55); }
#hp-fill{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#f0304d,#ff6176 55%,#ff9a7a); box-shadow:0 0 9px rgba(240,48,77,.55); transition:width .2s; }
.vital-wrap{ display:flex; align-items:center; gap:6px; min-width:112px; }
.vital-mini{ width:68px; height:8px; background:linear-gradient(180deg,#fff8df,#ffe6a6); border-radius:999px; overflow:hidden; border:1px solid #ffd06b; box-shadow:inset 0 1px 3px rgba(154,96,21,.16),0 0 0 2px rgba(255,255,255,.52); }
#vital-fill{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffc857,#ff9f1c); box-shadow:0 0 8px rgba(255,159,28,.48); transition:width .2s; }
.danger-pulse{ animation:dangerPulse .75s infinite alternate; }
@keyframes dangerPulse{ from{ filter:saturate(1); box-shadow:0 0 0 2px rgba(255,255,255,.55); } to{ filter:saturate(1.4); box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 12px rgba(255,47,78,.9); } }
.top-goal{ margin-top:6px; }
.goal-line{ font-size:11px; color:var(--ink-dim); margin-bottom:3px; }
.goal-bar{ height:9px; background:#dbe8f3; border-radius:999px; overflow:hidden; }
#goal-fill{ height:100%; width:0%; background:linear-gradient(90deg,#ff8f70,var(--gold)); transition:width .3s; }
.goal-num{ font-size:10px; color:var(--ink-dim); margin-top:2px; text-align:right; }

/* ===== 중앙 게임 영역 (~58%) ===== */
#game-area{ flex:1; position:relative; overflow:hidden; touch-action:none; background:#8fd0ff; }
#danger-heartbeat-overlay{
  position:absolute; inset:0; z-index:32; pointer-events:none; opacity:0;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,45,65,.12) 0 26%,rgba(255,25,45,.28) 68%,rgba(125,0,18,.52) 100%),
    linear-gradient(rgba(255,32,54,.16),rgba(255,32,54,.16));
  box-shadow:inset 0 0 70px 24px rgba(150,0,20,.42);
  mix-blend-mode:multiply;
}
#screen-game.low-hp #danger-heartbeat-overlay{ animation:heartDangerPulse .92s ease-in-out infinite; }
@keyframes heartDangerPulse{
  0%,100%{ opacity:.05; filter:saturate(1); }
  10%{ opacity:.58; filter:saturate(1.35); }
  22%{ opacity:.18; filter:saturate(1.05); }
  34%{ opacity:.68; filter:saturate(1.55); }
  56%{ opacity:.16; filter:saturate(1.08); }
  82%{ opacity:.38; filter:saturate(1.25); }
}
#game-area::after{
  content:""; position:absolute; inset:0; z-index:90; pointer-events:none; opacity:0;
  background:rgba(24,34,48,.72);
}
#game-area.area-transition::after{ animation:areaFade .52s ease-in-out; }
@keyframes areaFade{
  0%{ opacity:0; }
  42%{ opacity:1; }
  58%{ opacity:1; }
  100%{ opacity:0; }
}
.world-layer{ position:absolute; left:0; top:0; width:var(--world-w,1500px); height:var(--world-h,1200px); transform-origin:0 0; transform:translate3d(0,0,0); transition:transform .08s linear; will-change:transform; }
.area-bg{ position:absolute; inset:0; }
.area-name{ position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,.82); color:#3f5870; padding:5px 16px; border-radius:999px; font-size:13px; z-index:25; box-shadow:0 4px 12px rgba(45,72,105,.13); }

/* 지역 배경 */
.area-bg{ overflow:hidden; }
.area-bg::before,.area-bg::after{ content:""; position:absolute; inset:0; pointer-events:none; }
.bg-village{
  background:
    radial-gradient(circle at 18% 18%,rgba(255,238,150,.28) 0 9%,transparent 10%),
    radial-gradient(circle at 82% 72%,rgba(118,188,87,.36) 0 13%,transparent 14%),
    linear-gradient(180deg,#9bdd72 0%,#82cc5e 44%,#69b957 100%);
}
.bg-village::before{
  background:
    linear-gradient(90deg,transparent 0 42%,rgba(226,190,118,.95) 43% 57%,transparent 58% 100%),
    linear-gradient(180deg,transparent 0 42%,rgba(232,199,130,.9) 43% 57%,transparent 58% 100%),
    radial-gradient(circle at 50% 50%,rgba(240,211,143,.95) 0 12%,transparent 13%);
}
.bg-village::after{
  background:
    radial-gradient(circle at 8% 72%,#ffe66d 0 4px,transparent 5px),
    radial-gradient(circle at 18% 79%,#ff8fa3 0 4px,transparent 5px),
    radial-gradient(circle at 72% 70%,#fff17b 0 4px,transparent 5px),
    radial-gradient(circle at 85% 78%,#ff8fa3 0 4px,transparent 5px),
    radial-gradient(circle at 35% 30%,rgba(75,146,63,.35) 0 10px,transparent 11px);
  opacity:.95;
}
.bg-forest{
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,210,.72),transparent 23%),
    linear-gradient(180deg,#8bd79d 0%,#b4ed9e 38%,#62bb68 100%);
}
.bg-forest::before{
  background:
    linear-gradient(165deg,rgba(255,255,210,.38) 0 12%,transparent 13% 100%),
    radial-gradient(circle at 17% 72%,#4b9d53 0 7px,transparent 8px),
    radial-gradient(circle at 77% 58%,#4b9d53 0 8px,transparent 9px),
    radial-gradient(circle at 55% 82%,#3f8848 0 6px,transparent 7px);
}
.bg-forest::after{
  background:
    radial-gradient(ellipse at 30% 96%,rgba(43,110,50,.35) 0 18%,transparent 19%),
    radial-gradient(ellipse at 72% 98%,rgba(43,110,50,.28) 0 22%,transparent 23%);
}
.bg-forest-deep{
  background:
    radial-gradient(circle at 20% 14%,rgba(170,205,158,.34),transparent 22%),
    radial-gradient(circle at 78% 20%,rgba(60,88,74,.34),transparent 28%),
    linear-gradient(180deg,#526f63 0%,#486653 34%,#2f513f 68%,#233d35 100%);
}
.bg-forest-deep::before{
  background:
    linear-gradient(172deg,rgba(186,217,180,.16) 0 9%,transparent 10% 100%),
    radial-gradient(ellipse at 14% 82%,rgba(24,58,42,.72) 0 17%,transparent 18%),
    radial-gradient(ellipse at 42% 92%,rgba(18,47,35,.7) 0 22%,transparent 23%),
    radial-gradient(ellipse at 78% 84%,rgba(22,54,40,.75) 0 19%,transparent 20%),
    radial-gradient(circle at 24% 48%,rgba(154,182,142,.28) 0 8px,transparent 9px),
    radial-gradient(circle at 72% 56%,rgba(127,154,126,.22) 0 10px,transparent 11px);
}
.bg-forest-deep::after{
  background:
    linear-gradient(180deg,rgba(11,25,24,.12) 0%,rgba(8,20,19,.34) 100%),
    radial-gradient(ellipse at 50% 102%,rgba(7,22,18,.56) 0 34%,transparent 35%),
    radial-gradient(circle at 30% 34%,rgba(205,236,185,.2) 0 2px,transparent 3px),
    radial-gradient(circle at 64% 42%,rgba(205,236,185,.16) 0 2px,transparent 3px),
    radial-gradient(circle at 82% 30%,rgba(205,236,185,.14) 0 2px,transparent 3px);
}
.bg-heaven{
  background:
    radial-gradient(circle at 70% 12%,rgba(255,249,177,.9) 0 12%,transparent 13%),
    linear-gradient(180deg,#fff6c8 0%,#d5ecff 48%,#adcfff 100%);
}
.bg-heaven::before{
  background:
    radial-gradient(ellipse at 14% 24%,rgba(255,255,255,.92) 0 10%,transparent 11%),
    radial-gradient(ellipse at 44% 38%,rgba(255,255,255,.82) 0 14%,transparent 15%),
    radial-gradient(ellipse at 80% 30%,rgba(255,255,255,.86) 0 12%,transparent 13%),
    radial-gradient(ellipse at 64% 74%,rgba(255,255,255,.68) 0 15%,transparent 16%);
}
.bg-heaven::after{
  background:
    radial-gradient(ellipse at 28% 72%,#fff8d1 0 12%,transparent 13%),
    radial-gradient(ellipse at 66% 64%,#fff2ba 0 10%,transparent 11%),
    linear-gradient(180deg,transparent 0 65%,rgba(122,168,245,.16) 66% 100%);
}
.bg-demon{
  background:
    radial-gradient(circle at 65% 16%,rgba(255,96,60,.6),transparent 22%),
    linear-gradient(180deg,#ff9a88 0%,#bf4a61 48%,#6f2d4b 100%);
}
.bg-demon::before{
  background:
    linear-gradient(118deg,transparent 0 42%,rgba(255,91,45,.9) 43% 46%,transparent 47%),
    linear-gradient(32deg,transparent 0 55%,rgba(255,175,63,.72) 56% 59%,transparent 60%),
    radial-gradient(circle at 20% 74%,#45243b 0 12px,transparent 13px),
    radial-gradient(circle at 82% 67%,#45243b 0 15px,transparent 16px);
}
.bg-demon::after{
  background:
    radial-gradient(circle at 18% 22%,rgba(50,20,32,.25) 0 4px,transparent 5px),
    radial-gradient(circle at 45% 30%,rgba(50,20,32,.2) 0 3px,transparent 4px),
    radial-gradient(circle at 74% 24%,rgba(50,20,32,.22) 0 5px,transparent 6px);
}
.scenery{ position:absolute; pointer-events:none; z-index:1; }
.tree{ width:46px; height:64px; filter:drop-shadow(0 7px 3px rgba(37,89,53,.25)); }
.tree::before{ content:""; position:absolute; left:18px; bottom:0; width:11px; height:24px; background:linear-gradient(180deg,#a06d3c,#7a4f2f); border-radius:5px; }
.tree::after{ content:""; position:absolute; left:0; bottom:15px; width:46px; height:46px; background:radial-gradient(circle at 30% 34%,#7ae07a 0 26%,transparent 27%),radial-gradient(circle at 66% 30%,#5fcf68 0 30%,transparent 31%),radial-gradient(circle at 50% 62%,#32984f 0 42%,transparent 43%); border-radius:50%; box-shadow:inset 0 7px 0 rgba(255,255,255,.2); }
.pine{ width:48px; height:72px; filter:drop-shadow(0 7px 3px rgba(35,92,52,.25)); }
.pine::before{ content:""; position:absolute; left:19px; bottom:0; width:11px; height:22px; background:#7c5536; border-radius:4px; }
.pine::after{ content:""; position:absolute; left:0; bottom:12px; width:48px; height:60px; background:linear-gradient(180deg,#45bd6b,#1f7a47 72%,#145b36); clip-path:polygon(50% 0,92% 35%,73% 35%,100% 69%,67% 69%,84% 100%,16% 100%,33% 69%,0 69%,27% 35%,8% 35%); }
.bush{ width:48px; height:30px; background:radial-gradient(circle at 22% 58%,#84df71 0 34%,transparent 35%),radial-gradient(circle at 52% 35%,#65ca62 0 38%,transparent 39%),radial-gradient(circle at 78% 61%,#45ad4e 0 34%,transparent 35%); filter:drop-shadow(0 5px 2px rgba(52,112,54,.18)); }
.rock{ width:38px; height:28px; background:linear-gradient(135deg,#c6ced8,#7c8896); border-radius:52% 44% 50% 38%; box-shadow:inset 6px 4px 0 rgba(255,255,255,.25),0 5px 2px rgba(62,75,84,.16); }
.flower-patch{ width:58px; height:34px; background:radial-gradient(circle at 16% 62%,#ff7aa8 0 4px,transparent 5px),radial-gradient(circle at 36% 44%,#fff06b 0 4px,transparent 5px),radial-gradient(circle at 58% 58%,#8fdcff 0 4px,transparent 5px),radial-gradient(circle at 78% 66%,#ff8c7a 0 4px,transparent 5px),radial-gradient(ellipse at 50% 80%,#58bb5d 0 58%,transparent 59%); }
.fence{ width:96px; height:28px; background:repeating-linear-gradient(90deg,#d8a265 0 9px,transparent 9px 17px),linear-gradient(#b87f45 8px 13px,transparent 13px),linear-gradient(transparent 17px,#b87f45 18px 23px,transparent 23px); border-radius:5px; filter:drop-shadow(0 4px 2px rgba(93,63,38,.18)); }
.well{ width:48px; height:42px; background:linear-gradient(180deg,#d9e2ea,#8998a6); border:3px solid #667584; border-radius:50% 50% 12px 12px; box-shadow:inset 0 8px 0 rgba(63,86,104,.28),0 7px 3px rgba(63,86,104,.18); }
.well::before{ content:""; position:absolute; left:4px; right:4px; top:-16px; height:18px; border-top:4px solid #8b5f37; border-left:4px solid #8b5f37; border-right:4px solid #8b5f37; border-radius:12px 12px 0 0; }
.market-cart{ width:62px; height:36px; background:linear-gradient(180deg,#ffdf87,#d99a4c); border:3px solid #8b5f37; border-radius:8px; box-shadow:0 7px 3px rgba(80,56,35,.16); }
.market-cart::before{ content:""; position:absolute; left:4px; top:-18px; width:54px; height:18px; background:repeating-linear-gradient(90deg,#ff6b7a 0 10px,#fff5d8 10px 20px); border:3px solid #8b5f37; border-radius:8px 8px 0 0; }
.market-cart::after{ content:""; position:absolute; left:8px; bottom:-8px; width:10px; height:10px; background:#344054; border-radius:50%; box-shadow:34px 0 0 #344054; }
.lamp{ width:14px; height:54px; background:#6b5745; border-radius:8px; box-shadow:0 5px 2px rgba(60,45,32,.16); }
.lamp::before{ content:""; position:absolute; left:-8px; top:-12px; width:28px; height:22px; background:radial-gradient(circle,#fff6a5 0 36%,#ffca57 37% 62%,#8b5f37 63%); border-radius:50%; box-shadow:0 0 14px rgba(255,202,87,.7); }
.crate-stack{ width:48px; height:42px; background:linear-gradient(135deg,#c98d4f 0 48%,#a96d3a 49%); border:3px solid #7e5430; border-radius:6px; box-shadow:24px 10px 0 -6px #b77a42,0 7px 3px rgba(68,45,28,.16); }
.garden-bed{ width:82px; height:42px; background:repeating-linear-gradient(90deg,#7b4f2f 0 12px,#8f6239 12px 24px); border:3px solid #5f3e26; border-radius:12px; box-shadow:inset 0 0 0 4px rgba(255,255,255,.08); }
.garden-bed::after{ content:""; position:absolute; inset:6px; background:radial-gradient(circle at 16% 50%,#52c764 0 4px,transparent 5px),radial-gradient(circle at 38% 50%,#52c764 0 4px,transparent 5px),radial-gradient(circle at 62% 50%,#52c764 0 4px,transparent 5px),radial-gradient(circle at 84% 50%,#52c764 0 4px,transparent 5px); }
.cloud{ width:64px; height:26px; background:#fff; border-radius:999px; box-shadow:18px -8px 0 4px rgba(255,255,255,.94),38px 0 0 2px rgba(255,255,255,.9); opacity:.9; }
.island{ width:84px; height:34px; background:linear-gradient(180deg,#fff4bd,#e6c56f); border-radius:50%; box-shadow:0 9px 0 rgba(155,119,56,.25); }
.crystal{ width:24px; height:38px; background:linear-gradient(135deg,#89f5ff,#7d7cff); clip-path:polygon(50% 0,100% 35%,72% 100%,28% 100%,0 35%); filter:drop-shadow(0 0 8px rgba(137,245,255,.6)); }
.lava-rock{ width:44px; height:28px; background:linear-gradient(180deg,#4f2434,#2c1828); border-radius:50% 45% 38% 44%; box-shadow:inset 7px 3px 0 rgba(255,117,55,.5),0 0 12px rgba(255,100,45,.22); }
.ember{ width:8px; height:8px; background:#ffbf4d; border-radius:50%; box-shadow:0 0 10px #ff713d; opacity:.75; animation:floaty 2.8s infinite ease-in-out alternate; }
.motion-layer{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.motion-particle{ position:absolute; border-radius:999px; opacity:.72; animation:driftMotion 4.8s linear infinite; }
.motion-leaf{ width:10px; height:6px; background:#7bd66d; box-shadow:0 0 8px rgba(103,190,78,.35); }
.motion-spark{ width:7px; height:7px; background:#ffbd4f; box-shadow:0 0 12px #ff6938; }
.motion-star{ width:8px; height:8px; background:#fff6a5; box-shadow:0 0 12px #fff; }
.motion-cloudbit{ width:26px; height:10px; background:rgba(255,255,255,.82); }
@keyframes floaty{ to{ transform:translateY(-10px); opacity:.35; } }
@keyframes driftMotion{
  from{ transform:translate3d(-20px,12px,0) rotate(0deg); opacity:0; }
  15%{ opacity:.75; }
  85%{ opacity:.75; }
  to{ transform:translate3d(90px,-42px,0) rotate(160deg); opacity:0; }
}

/* 맵 위 오브젝트 */
.obj{ position:absolute; display:flex; flex-direction:column; align-items:center; cursor:pointer; z-index:3; transition:filter .12s, transform .12s; filter:drop-shadow(0 5px 3px rgba(38,63,78,.18)); }
.obj .label{ font-size:10px; margin-top:3px; background:rgba(255,255,255,.82); color:#344054; padding:2px 6px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 6px rgba(45,72,105,.1); }
.obj:active{ transform:scale(.9); }
.obj.near{ filter:drop-shadow(0 0 8px #fff4a8) drop-shadow(0 0 4px #f9b84a); }
.player-obj{ z-index:8; pointer-events:none; transition:left .08s linear, top .08s linear; width:42px; min-height:72px; }
.player-obj .label{ position:absolute; top:58px; left:50%; transform:translateX(-50%); max-width:140px; overflow:hidden; text-overflow:ellipsis; }
.player-hpbar{ position:absolute; left:50%; top:-13px; transform:translateX(-50%); width:42px; height:7px; background:rgba(255,224,228,.95); border:1px solid #fff; border-radius:999px; overflow:hidden; box-shadow:0 2px 5px rgba(45,72,105,.25); }
.player-hpbar span{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff6b7a,#ffbd6b); transition:width .2s; }
.job-tool{ position:absolute; right:0px; top:22px; width:18px; height:18px; pointer-events:none; filter:drop-shadow(0 2px 1px rgba(35,54,70,.35)); transform-origin:50% 80%; z-index:9; }
.job-tool::before,.job-tool::after{ content:""; position:absolute; display:block; }
.tool-hammer::before{ left:8px; top:3px; width:4px; height:15px; background:#8b5f37; border-radius:2px; transform:rotate(-28deg); }
.tool-hammer::after{ left:3px; top:1px; width:15px; height:7px; background:#8aa0ad; border:2px solid #5e717a; border-radius:3px; transform:rotate(-28deg); }
.tool-book::before{ left:2px; top:3px; width:15px; height:12px; background:#7d7cff; border:2px solid #514bd0; border-radius:3px; }
.tool-book::after{ left:8px; top:3px; width:2px; height:13px; background:#fff1a8; }
.tool-bundle::before{ left:3px; top:4px; width:14px; height:12px; background:#d6a15b; border:2px solid #8b5f37; border-radius:50% 50% 45% 45%; }
.tool-bundle::after{ left:6px; top:2px; width:8px; height:5px; border-top:2px solid #8b5f37; border-radius:50%; }
.tool-pan::before{ left:2px; top:6px; width:12px; height:10px; background:#414b57; border:2px solid #202832; border-radius:50%; }
.tool-pan::after{ right:-2px; top:8px; width:10px; height:4px; background:#202832; border-radius:4px; transform:rotate(-24deg); }
.player-obj.walking .spr{ animation:walkBob .28s infinite alternate ease-in-out; }
.player-obj.action-attack .spr{ animation:attackLunge .28s ease-out; }
.player-obj.action-pick .spr{ animation:pickDip .32s ease-out; }
.player-obj.action-attack .job-tool{ animation:toolSwing .28s ease-out; }
.player-obj.action-pick .job-tool{ animation:toolUse .32s ease-out; }
.obj.wanderer .spr{ animation:idleFloat 1.1s infinite alternate ease-in-out; }
.monster-obj.action-attack .spr,.monster-obj.action-attack .sprite{ animation:monsterLunge .3s ease-out; }
.monster-obj{ transition:left .7s ease-in-out, top .7s ease-in-out, filter .12s, transform .12s; }
.npc-obj{ transition:left .9s ease-in-out, top .9s ease-in-out, filter .12s, transform .12s; }
.dog-obj{ transition:left .9s ease-in-out, top .9s ease-in-out, filter .12s, transform .12s; }
.dog-sprite{ position:relative; width:34px; height:23px; }
.dog-sprite::before{ content:""; position:absolute; left:4px; top:8px; width:24px; height:13px; background:linear-gradient(180deg,#9b663f,#724326); border:2px solid #4d2d1d; border-radius:12px 10px 8px 8px; box-shadow:inset 3px 2px 0 rgba(255,255,255,.18); }
.dog-sprite::after{ content:""; position:absolute; left:22px; top:3px; width:12px; height:12px; background:#9b663f; border:2px solid #4d2d1d; border-radius:50% 50% 45% 45%; box-shadow:-16px 8px 0 -5px #4d2d1d; }
.dog-sprite .ear{ position:absolute; right:5px; top:1px; width:7px; height:9px; background:#5a3422; border-radius:50% 50% 40% 40%; transform:rotate(24deg); z-index:2; }
.dog-sprite .tail{ position:absolute; left:0; top:7px; width:11px; height:5px; background:#724326; border:2px solid #4d2d1d; border-right:none; border-radius:10px 0 0 10px; transform:rotate(28deg); }
.slash-effect{
  position:absolute; z-index:12; width:46px; height:28px; pointer-events:none;
  border-top:5px solid rgba(255,245,145,.95); border-radius:50%;
  filter:drop-shadow(0 0 8px #ff884d); transform:rotate(-28deg);
  animation:slashArc .24s ease-out forwards;
}
.pickup-effect{
  position:absolute; z-index:12; width:36px; height:36px; pointer-events:none;
  background:radial-gradient(circle,#fff 0 10%,#ffe76f 11% 24%,transparent 25%);
  animation:pickupSpark .42s ease-out forwards;
}
@keyframes walkBob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
@keyframes idleFloat{ from{ transform:translateY(0); } to{ transform:translateY(-2px); } }
@keyframes attackLunge{ 0%{ transform:translateX(0); } 45%{ transform:translateX(8px) rotate(6deg); } 100%{ transform:translateX(0); } }
@keyframes monsterLunge{ 0%{ transform:translateX(0) scale(1); } 45%{ transform:translateX(-8px) scale(1.08); } 100%{ transform:translateX(0) scale(1); } }
@keyframes pickDip{ 0%{ transform:translateY(0); } 45%{ transform:translateY(8px) scale(.94); } 100%{ transform:translateY(0); } }
@keyframes toolSwing{ 0%{ transform:rotate(0deg); } 50%{ transform:rotate(-72deg) translateX(4px); } 100%{ transform:rotate(0deg); } }
@keyframes toolUse{ 0%{ transform:translateY(0); } 50%{ transform:translateY(8px) rotate(20deg); } 100%{ transform:translateY(0); } }
@keyframes slashArc{ from{ opacity:1; transform:translateX(0) rotate(-28deg) scale(.7); } to{ opacity:0; transform:translateX(26px) rotate(22deg) scale(1.25); } }
@keyframes pickupSpark{ from{ opacity:1; transform:translateY(0) scale(.65); } to{ opacity:0; transform:translateY(-22px) scale(1.25); } }
.fade-out{ animation:pop .25s forwards; }
@keyframes pop{ to{ transform:scale(0); opacity:0; } }

/* 건물(상점/포털) */
.building{
  position:absolute; width:82px; min-height:78px; cursor:pointer; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  filter:drop-shadow(0 9px 4px rgba(92,70,42,.2));
}
.building .roof{ width:80px; height:26px; background:linear-gradient(180deg,#f26a55,#b83f35); clip-path:polygon(7% 100%,50% 0,93% 100%); filter:drop-shadow(0 4px 0 rgba(96,45,35,.2)); }
.building .wall{ position:relative; width:62px; height:44px; background:linear-gradient(180deg,#fff2c8,#ffd285); border:3px solid #8a6b4a; display:flex; align-items:center; justify-content:center; font-size:11px; color:#3a2a18; font-weight:bold; border-radius:0 0 12px 12px; box-shadow:inset 0 6px 0 rgba(255,255,255,.35); }
.building .wall::before{ content:""; position:absolute; left:7px; top:10px; width:10px; height:10px; background:#aee3ff; border:2px solid #6b8ba1; border-radius:3px; box-shadow:37px 0 0 -2px #aee3ff,37px 0 0 0 #6b8ba1; }
.building .wall::after{ content:""; position:absolute; left:25px; bottom:0; width:14px; height:22px; background:#93633c; border:2px solid #67452c; border-bottom:none; border-radius:8px 8px 0 0; }
.building.shop-magic .roof{ background:linear-gradient(180deg,#a48bff,#6654cf); }
.building.shop-food .roof{ background:linear-gradient(180deg,#ffbe5f,#df7b3d); }
.building.shop-general .roof{ background:linear-gradient(180deg,#74d6a0,#3e9d65); }
.building.shop-armor .roof{ background:linear-gradient(180deg,#9eb4c3,#617687); }
.building.home .roof{ background:linear-gradient(180deg,#7fc8ff,#3d8ed5); }
.building.home .wall{ background:linear-gradient(180deg,#fff7dc,#f7d39b); }
.building .label{ font-size:10px; margin-top:3px; background:rgba(255,255,255,.82); padding:2px 6px; border-radius:999px; color:#344054; white-space:nowrap; }
.building:active{ transform:translateY(2px); }

.portal{
  position:absolute; z-index:3; cursor:pointer; display:flex; flex-direction:column; align-items:center; transform:translate(-50%,-50%); filter:drop-shadow(0 7px 5px rgba(50,48,90,.22));
}
.portal .ring{ width:50px; height:58px; border-radius:50%; border:4px solid #9b6bff; background:radial-gradient(circle at 45% 38%,#fff,#c9b3ff 28%,#5a2fb0 72%); box-shadow:0 0 14px #9b6bff,inset 0 0 12px rgba(255,255,255,.65); animation:glow 1.4s infinite alternate; }
.portal.p-heaven .ring{ border-color:#7fd8ff; background:radial-gradient(circle,#eaffff,#4aa8e0); box-shadow:0 0 14px #7fd8ff; }
.portal.p-demon .ring{ border-color:#ff5b3a; background:radial-gradient(circle,#ffb199,#b02010); box-shadow:0 0 14px #ff5b3a; }
.portal .label{ font-size:10px; margin-top:3px; background:rgba(255,255,255,.82); padding:2px 7px; border-radius:999px; color:#344054; }
@keyframes glow{ to{ box-shadow:0 0 22px #c9b3ff; } }

/* 숲 단계 이동 컨트롤 */
/* ===== 실시간 조작 ===== */
.touch-controls{
  position:absolute; left:10px; bottom:10px; width:128px; height:128px; z-index:20; opacity:.94;
  border:2px solid rgba(125,145,168,.55); border-radius:50%; background:rgba(255,255,255,.38);
  box-shadow:0 8px 22px rgba(45,72,105,.16), inset 0 0 0 12px rgba(255,255,255,.34);
  touch-action:none; cursor:grab;
}
.touch-controls.dragging{ cursor:grabbing; background:rgba(231,242,255,.48); }
.joystick-base{
  position:absolute; inset:12px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.8) 0 18%,rgba(232,246,255,.65) 19% 52%,rgba(156,189,216,.25) 53% 100%);
  border:2px solid rgba(255,255,255,.72);
}
.joystick-stick{
  position:absolute; left:50%; top:50%; width:52px; height:52px; transform:translate(-50%,-50%);
  border:2px solid rgba(92,120,148,.7); border-radius:50%; background:linear-gradient(180deg,#ffffff,#dff0ff);
  box-shadow:0 8px 16px rgba(45,72,105,.18); pointer-events:none;
}
.joystick-stick::before{
  content:""; position:absolute; inset:15px; border-radius:50%; background:#5f9df7; opacity:.7;
}
.joystick-hint{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:rgba(52,64,84,.34);
  font-size:18px; font-weight:bold; pointer-events:none;
}
.interact-btn{
  font-family:inherit; font-weight:bold; border:2px solid rgba(125,145,168,.6);
  background:rgba(255,255,255,.86); color:var(--ink); border-radius:16px;
  box-shadow:0 5px 14px rgba(45,72,105,.16); cursor:pointer;
}
.interact-btn:active{ background:#e7f2ff; transform:translateY(1px); }
.interact-btn{ position:absolute; right:12px; bottom:24px; z-index:20; min-width:112px; min-height:54px; padding:10px 14px; font-size:14px; }
.interact-btn:disabled{ opacity:.45; }
.potion-quick{
  position:absolute; right:78px; bottom:86px; z-index:20; width:58px; height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:rgba(255,255,255,.88); border:2px solid rgba(125,145,168,.6); border-radius:18px;
  box-shadow:0 5px 14px rgba(45,72,105,.16); cursor:pointer; font-family:inherit; font-weight:bold; color:var(--ink);
}
.potion-quick:disabled{ filter:grayscale(1); opacity:.48; cursor:not-allowed; }
.return-quick{
  position:absolute; right:12px; bottom:86px; z-index:20; width:58px; height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:rgba(255,255,255,.88); border:2px solid rgba(125,145,168,.6); border-radius:18px;
  box-shadow:0 5px 14px rgba(45,72,105,.16); cursor:pointer; font-family:inherit; font-weight:bold; color:var(--ink);
}
.return-quick:disabled{ filter:grayscale(1); opacity:.48; cursor:not-allowed; }
.scroll-icon{ position:relative; width:25px; height:29px; display:block; }
.scroll-icon::before{ content:""; position:absolute; left:4px; top:3px; width:17px; height:23px; background:linear-gradient(180deg,#fff6c8,#e8c77d); border:2px solid #9b6a35; border-radius:4px; box-shadow:inset 3px 2px 0 rgba(255,255,255,.48); }
.scroll-icon::after{ content:""; position:absolute; left:8px; top:10px; width:9px; height:2px; background:#9b6a35; box-shadow:0 5px 0 #9b6a35,0 10px 0 #9b6a35; }
.potion-icon{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; }
.return-icon{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; }
.potion-quick .item-ic{ width:28px; height:28px; image-rendering:pixelated; }
.potion-quick .ic{ width:24px; height:24px; border-radius:8px; border:2px solid rgba(255,255,255,.8); }
.quick-key-dot{
  position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 4px;
  display:flex; align-items:center; justify-content:center;
  background:var(--red); color:#fff; border:2px solid #fff; border-radius:999px;
  box-shadow:0 2px 6px rgba(45,72,105,.2); font-size:9px; line-height:1; font-weight:bold;
}
.potion-vial{ position:relative; width:20px; height:28px; display:block; }
.potion-vial::before{ content:""; position:absolute; left:6px; top:0; width:8px; height:6px; background:#8a6b4a; border:2px solid #5c4630; border-bottom:none; border-radius:3px 3px 0 0; }
.potion-vial::after{ content:""; position:absolute; left:2px; top:6px; width:16px; height:20px; background:linear-gradient(180deg,rgba(255,255,255,.85) 0 18%,#ff8897 19% 54%,#f0304d 55% 100%); border:2px solid #9f5260; border-radius:7px 7px 9px 9px; box-shadow:inset 3px 2px 0 rgba(255,255,255,.42),0 2px 3px rgba(45,72,105,.18); }
.potion-vial.mid::after{ background:linear-gradient(180deg,rgba(255,255,255,.85) 0 18%,#ffb067 19% 54%,#f57445 55% 100%); }
.potion-vial.large::after{ background:linear-gradient(180deg,rgba(255,255,255,.9) 0 18%,#b879ff 19% 54%,#7a5cff 55% 100%); }
.potion-count{ font-size:11px; line-height:1; color:#f15d6c; }
.return-count{ font-size:11px; line-height:1; color:#8f6bff; }

/* ===== 하단 빠른 메뉴 ===== */
#bottom-nav{ display:grid; grid-template-columns:repeat(5,1fr); background:#fffdf7; border-top:2px solid var(--frame); }
.nav-btn{
  font-family:inherit; background:transparent; border:none; border-right:1px solid #e2edf5;
  color:var(--ink); padding:8px 2px; font-size:18px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; justify-content:center;
}
.nav-btn span{ font-size:10px; color:var(--ink-dim); }
.nav-btn:last-child{ border-right:none; }
.nav-btn:active{ background:#dff0ff; }
.nav-btn.active-toggle{ background:#e9f3ff; color:#3d7bc9; }
.map-panel{
  position:absolute; right:12px; top:56px; width:172px; height:126px; z-index:24;
  background:rgba(255,253,247,.92); border:2px solid var(--frame); border-radius:18px;
  box-shadow:0 10px 28px rgba(45,72,105,.22); overflow:hidden; display:none;
}
.map-panel.open{ display:block; }
.map-title{ position:absolute; left:9px; top:7px; z-index:2; font-size:11px; font-weight:bold; color:#3f5870; }
.map-canvas{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(143,208,255,.8),rgba(111,200,92,.78)); }
.map-dot{ position:absolute; width:7px; height:7px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(255,255,255,.8); }
.map-dot.player{ width:18px; height:18px; background:#fff; z-index:4; box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,95,122,.8); overflow:hidden; display:flex; align-items:flex-start; justify-content:center; }
.map-dot.player .spr{ height:24px; margin-top:-3px; filter:none; }
.map-dot.portal{ background:#8f6bff; }
.map-dot.npc{ background:#4ba3ff; }
.map-dot.monster{ background:#f15d6c; }
.map-dot.item{ background:#f9b84a; }

@media (min-width:760px) and (orientation:landscape){
  #screen-game{ display:none; grid-template-columns:1fr 112px; grid-template-rows:auto 1fr; }
  #screen-game.active{ display:grid; }
  #topbar{ grid-column:1 / 3; }
  #game-area{ grid-column:1; grid-row:2; }
  #bottom-nav{ grid-column:2; grid-row:2; grid-template-columns:1fr; grid-template-rows:repeat(5,1fr); border-top:none; border-left:2px solid var(--frame); }
  .nav-btn{ border-right:none; border-bottom:1px solid #e2edf5; min-height:auto; }
  .touch-controls{ width:144px; height:144px; }
  .joystick-stick{ width:58px; height:58px; }
  .potion-quick{ right:82px; bottom:90px; }
  .return-quick{ right:16px; bottom:90px; }
  .interact-btn{ min-width:132px; min-height:58px; }
}

@media (min-width:900px){
  #topbar{ padding:10px 14px; }
  .top-row2{ font-size:14px; }
}

/* ===== 클리어 화면 ===== */
#screen-clear{ background:linear-gradient(180deg,#d9f2ff,#fff4d4 55%,#ffe4eb); justify-content:center; padding:24px; }
.clear-inner{ text-align:center; }
.clear-title{ font-size:34px; color:var(--gold); text-shadow:2px 2px 0 var(--line); margin-bottom:18px; }
.clear-text{ font-size:14px; line-height:1.9; color:var(--ink); white-space:pre-line; background:rgba(255,253,247,.9); padding:18px; border-radius:18px; border:2px solid var(--frame); box-shadow:0 8px 22px rgba(45,72,105,.13); }
.clear-btns{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }

/* ===== 모달 ===== */
.modal-wrap{ display:none; position:absolute; inset:0; background:rgba(52,64,84,.35); z-index:50; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
.modal-wrap.open{ display:flex; }
.modal-box{ position:relative; width:fit-content; min-width:min(360px, calc(100vw - 32px)); max-width:calc(100vw - 32px); margin:0 auto; max-height:90%; background:var(--panel); border:2px solid var(--frame); border-radius:22px; padding:16px; overflow:visible; box-shadow:0 18px 45px rgba(45,72,105,.24); display:flex; flex-direction:column; }
.modal-title{ font-size:18px; color:var(--gold); font-weight:bold; margin-bottom:12px; padding-right:24px; }
.modal-body{ font-size:13px; line-height:1.7; overflow-y:auto; max-height:calc(90vh - 132px); padding-right:4px; }
.modal-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.modal-actions .btn{ flex:1; min-width:46%; font-size:14px; min-height:44px; }
.modal-close{ position:absolute; top:-10px; right:-10px; z-index:3; width:34px; height:34px; background:var(--red); color:#fff; border:2px solid #fff; border-radius:50%; font-size:14px; cursor:pointer; box-shadow:0 4px 10px rgba(45,72,105,.24); }
.status-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.status-card{ background:var(--panel2); border:2px solid var(--frame); border-radius:14px; padding:10px; }
.status-card.wide{ grid-column:1 / -1; }
.status-card h4{ font-size:12px; margin-bottom:5px; color:#4f6f8d; }
.status-main{ font-size:15px; font-weight:bold; color:var(--ink); }
.status-sub{ font-size:11px; color:var(--ink-dim); line-height:1.5; margin-top:3px; }
.effect-list{ display:grid; gap:6px; }
.effect-pill{ padding:7px 9px; border-radius:12px; border:2px solid rgba(125,145,168,.32); background:#fff; }
.effect-pill.good{ border-color:rgba(93,187,131,.45); background:#f0fff6; }
.effect-pill.bad{ border-color:rgba(241,93,108,.45); background:#fff2f4; }

/* 모달 내부 리스트/탭 */
.tabs{ display:flex; gap:6px; margin-bottom:12px; }
.tabs button{ flex:1; font-family:inherit; font-weight:bold; padding:8px; background:var(--panel2); color:var(--ink-dim); border:2px solid var(--frame); border-radius:14px; cursor:pointer; font-size:13px; }
.tabs button.active{ background:#e7f2ff; color:#3d7bc9; border-color:#8fc3ff; }
.list-row{ display:flex; align-items:center; gap:8px; padding:9px; border:1px solid #dcebf7; border-radius:16px; margin-bottom:8px; background:var(--panel2); flex-wrap:nowrap; }
.list-row .ic{ width:26px; height:26px; border:2px solid rgba(125,145,168,.45); border-radius:9px; flex-shrink:0; }
.list-row .info{ flex:1 1 auto; min-width:0; font-size:13px; line-height:1.4; white-space:nowrap; }
.list-row .info small{ color:var(--ink-dim); font-size:11px; white-space:nowrap; }
.list-row button{ font-family:inherit; font-weight:bold; padding:7px 11px; font-size:12px; background:var(--accent); color:#fff; border:2px solid #477fcf; border-radius:12px; cursor:pointer; }
.list-row button:disabled{ opacity:.4; }
.empty-msg{ text-align:center; color:var(--ink-dim); padding:20px; font-size:13px; }
.shop-meta{ font-size:12px; color:var(--ink-dim); margin-bottom:10px; }

/* npc dialog 선택지 */
.dlg-choice{ width:100%; text-align:left; margin-bottom:8px; padding:11px 12px; background:var(--panel2); border:2px solid var(--frame); border-radius:16px; color:var(--ink); font-family:inherit; font-size:14px; cursor:pointer; }

/* ===== 도트 스프라이트 ===== */
.sprite{ position:relative; width:30px; height:34px; border-radius:6px 6px 4px 4px; border:2px solid var(--line); background:#9aa; image-rendering:pixelated; }
/* data-URI 픽셀 스프라이트 */
.spr{ image-rendering:pixelated; display:block; margin:0 auto; filter:drop-shadow(0 4px 2px rgba(35,54,70,.28)); -webkit-user-select:none; user-select:none; }
.spr-char{ height:56px; width:auto; }
.spr-mon{ height:42px; width:auto; }
.spr-mon.big{ height:60px; }
.list-row .item-ic{ width:30px; height:30px; image-rendering:pixelated; flex-shrink:0; }
.qty-ctrl{ display:flex; align-items:center; gap:3px; margin-right:6px; flex-shrink:0; }
.qty-ctrl button{ width:24px; height:28px; min-width:24px; padding:0; font-size:16px; line-height:1; border-radius:7px; }
.qty-ctrl button.qty-edge{ width:34px; min-width:34px; font-size:10px; }
.qty-ctrl input{ width:42px; height:28px; text-align:center; border:2px solid var(--frame); border-radius:7px; font-size:13px; box-sizing:border-box; -moz-appearance:textfield; background:#fff; color:var(--ink); }
.qty-ctrl input::-webkit-outer-spin-button,.qty-ctrl input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
@media (max-width:480px){
  .list-row{ flex-wrap:wrap; row-gap:8px; }
  .list-row .info{ flex:1 1 calc(100% - 50px); white-space:normal; }
  .list-row .info small{ white-space:normal; }
  .qty-ctrl{ margin-right:auto; }
}
.gather-ic{ display:flex; align-items:center; justify-content:center; }
.gather-ic .item-ic{ width:36px; height:36px; image-rendering:pixelated; filter:drop-shadow(0 4px 2px rgba(35,54,70,.24)); }
.sprite .face{ position:absolute; top:7px; left:0; right:0; display:flex; justify-content:center; gap:5px; }
.sprite .eye{ width:4px; height:4px; background:#111; border-radius:1px; }
.sprite .eye.dead{ background:#900; transform:rotate(45deg); }
.sprite.big{ width:46px; height:52px; }

/* 플레이어 */
.sprite.player-m{ background:#4a86c8; }
.sprite.player-f{ background:#d76aa8; }
.sprite.player-m::before,.sprite.player-f::before{ /* 머리/모자 */
  content:""; position:absolute; top:-5px; left:3px; right:3px; height:8px; background:#5a3a22; border:2px solid var(--line); border-radius:4px 4px 0 0;
}
.sprite.player-f::before{ background:#8a4a2a; height:11px; top:-7px; }
.sprite.player-m::after,.sprite.player-f::after{ /* 가방 */
  content:""; position:absolute; bottom:2px; right:-4px; width:8px; height:10px; background:#caa15a; border:2px solid var(--line); border-radius:2px;
}
.sprite.player-child{ background:#5aa0d8; width:24px; height:28px; }
.sprite.player-fallen{ background:#6a7a8a; }

/* NPC 색상/특징 */
.sprite.npc-chief{ background:#caa15a; }
.sprite.npc-chief::before{ content:""; position:absolute; top:-6px; left:6px; right:6px; height:7px; background:#fff; border:2px solid var(--line); border-radius:3px; }
.sprite.npc-priest{ background:#e6e0c0; }
.sprite.npc-teacher{ background:#7a86b0; }
.sprite.npc-student{ background:#7fc08a; }
.sprite.npc-pharma{ background:#b07ac0; }
.sprite.npc-resident{ background:#a0a0b0; }
.sprite.npc-sun{ background:#ffcf3a; box-shadow:0 0 10px #ffcf3a; }
.sprite.npc-moon{ background:#9fb6ff; box-shadow:0 0 10px #9fb6ff; }
.sprite.npc-harvest{ background:#e0b24a; }
.sprite.npc-war{ background:#8a4a3a; }
.sprite.npc-wisdom{ background:#5ac0b0; }
.sprite.npc-demon{ background:#7a1020; }
.sprite.npc-demon::before{ content:""; position:absolute; top:-7px; left:2px; width:7px; height:9px; background:#400; border:2px solid var(--line); clip-path:polygon(0 100%,50% 0,100% 100%); }
.sprite.npc-demon::after{ content:""; position:absolute; top:-7px; right:2px; width:7px; height:9px; background:#400; border:2px solid var(--line); clip-path:polygon(0 100%,50% 0,100% 100%); }
.sprite.npc-pet{ background:#ffe0a0; }
.sprite.npc-pet::before{ content:""; position:absolute; top:-9px; left:8px; width:12px; height:10px; background:#fff2c5; border:2px solid var(--line); border-radius:8px 8px 4px 4px; }
.pet-pixel{ display:inline-flex; align-items:center; justify-content:center; image-rendering:pixelated; }
.pet-pixel svg,.pet-pixel img{ width:34px; height:34px; image-rendering:pixelated; filter:drop-shadow(0 3px 2px rgba(35,54,70,.22)); }
.pet-pixel.item svg,.pet-pixel.item img{ width:28px; height:28px; }
.pet-egg-shadow{ position:relative; }
.pet-egg-shadow img{ filter:brightness(0) drop-shadow(0 3px 2px rgba(35,54,70,.22)); opacity:.92; }
.pet-egg-shadow::after{ content:"?"; position:absolute; left:50%; top:50%; transform:translate(-50%,-51%); color:#fff; font-family:monospace; font-weight:900; font-size:18px; text-shadow:0 1px 0 #000,1px 0 0 #000,0 -1px 0 #000,-1px 0 0 #000; }
.pet-companion{ z-index:7; pointer-events:none; filter:drop-shadow(0 5px 3px rgba(38,63,78,.2)); animation:petBob 1.35s ease-in-out infinite; }
.pet-companion .label{ display:none; }
@keyframes petBob{ 0%,100%{ transform:translate(-50%,-50%) translateY(0); } 50%{ transform:translate(-50%,-50%) translateY(-3px); } }

/* 몬스터 특징 (개별 클래스가 .sprite 기본색을 덮어씀) */
.mon-rabbit{ background:#eee; }
.mon-rabbit::before,.mon-rabbit::after{ content:""; position:absolute; top:-9px; width:5px; height:11px; background:#eee; border:2px solid var(--line); border-radius:3px; }
.mon-rabbit::before{ left:5px; } .mon-rabbit::after{ right:5px; }
.mon-mouse{ background:#9a8a7a; }
.mon-mouse::after{ content:""; position:absolute; bottom:4px; right:-8px; width:10px; height:3px; background:#9a8a7a; border:1px solid var(--line); border-radius:2px; }
.mon-slime{ background:#5ad0b0; border-radius:50% 50% 8px 8px; }
.mon-mushroom{ background:#d05a5a; border-radius:50% 50% 0 0; }
.mon-mushroom2{ background:#a05ad0; border-radius:50% 50% 0 0; }
.mon-boar{ background:#7a5a3a; border-radius:8px; }
.mon-boar-big{ background:#5a3a2a; border-radius:8px; width:40px; height:38px; }
.mon-wolf{ background:#6a6a7a; }
.mon-spirit{ background:#6ad08a; box-shadow:0 0 8px #6ad08a; }
.mon-guardian{ background:#3a6a3a; width:40px; height:42px; }
.mon-sky-guard{ background:#dff8ff; box-shadow:0 0 12px #eaffff; }
.mon-sky-knight{ background:#b8c8ff; box-shadow:0 0 12px #b8c8ff; }
.mon-sky-spirit{ background:#fff2a8; border-radius:50%; box-shadow:0 0 14px #fff2a8; }
.mon-sky-boss{ background:#f7fbff; width:48px; height:52px; box-shadow:0 0 18px #fff; }
.mon-demon-low{ background:#b03030; }
.mon-demon-low::before{ content:""; position:absolute; top:-6px; left:4px; width:5px; height:7px; background:#700; clip-path:polygon(0 100%,50% 0,100% 100%); }
.mon-flame{ background:#ff6a2a; box-shadow:0 0 10px #ff6a2a; border-radius:50% 50% 4px 4px; }
.mon-knight{ background:#3a3a4a; }
.mon-dog{ background:#5a2a2a; }
.mon-boss{ background:#400010; width:50px; height:54px; box-shadow:0 0 16px #ff2040; }
.mon-boss::before,.mon-boss::after{ content:""; position:absolute; top:-10px; width:10px; height:13px; background:#600; border:2px solid var(--line); clip-path:polygon(0 100%,50% 0,100% 100%); }
.mon-boss::before{ left:4px; } .mon-boss::after{ right:4px; }

/* ===== 토스트 ===== */
#toast{
  position:absolute; top:64px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,.94); color:var(--ink); padding:10px 18px; border-radius:999px;
  border:2px solid var(--gold); font-size:13px; z-index:80; opacity:0; transition:opacity .25s;
  pointer-events:none; max-width:80%; text-align:center; white-space:pre-line;
  box-shadow:0 8px 22px rgba(45,72,105,.18);
}
#toast.show{ opacity:1; }

/* ===== NPC 중앙 대화창 ===== */
#npc-dialog{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.92);
  width:78%; max-width:340px; max-height:60%; overflow-y:auto;
  background:rgba(255,255,255,.97); color:var(--ink); padding:18px 18px 16px;
  border:2px solid var(--gold); border-radius:18px;
  font-size:14px; line-height:1.7; white-space:pre-line; text-align:left;
  z-index:85; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  box-shadow:0 14px 36px rgba(45,72,105,.28);
}
#npc-dialog.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; cursor:pointer; }
#npc-dialog .npc-name{ font-weight:bold; color:var(--gold); margin-bottom:7px; font-size:15px; }
#npc-dialog .npc-text{ color:var(--ink); }

/* ===== 천계 NPC 천사 날개 ===== */
.obj.winged .angel-wings{
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:64px; height:30px; z-index:-1; pointer-events:none;
}
.obj.winged .angel-wings::before, .obj.winged .angel-wings::after{
  content:""; position:absolute; top:0; width:28px; height:30px;
  background:linear-gradient(180deg,#ffffff,#dbe8ff 75%,#c4d8ff);
  border:1.5px solid #b9cdff; box-shadow:0 0 9px rgba(180,210,255,.85);
}
.obj.winged .angel-wings::before{ left:-6px; border-radius:75% 25% 70% 30%/70% 45% 55% 30%; transform:rotate(-10deg); }
.obj.winged .angel-wings::after{ right:-6px; border-radius:25% 75% 30% 70%/45% 70% 30% 55%; transform:rotate(10deg); }

/* ===== 마을 여성 NPC 헤어 ===== */
.obj .female-hair{
  position:absolute; top:5px; left:50%; transform:translateX(-50%);
  width:30px; height:11px; z-index:4; pointer-events:none;
  background:linear-gradient(180deg,#6a4426,#4a2e18);
  border:1.5px solid #2a1810; border-radius:9px 9px 4px 4px;
}
.obj .female-hair::before, .obj .female-hair::after{
  content:""; position:absolute; top:6px; width:7px; height:21px;
  background:linear-gradient(180deg,#5a3a22,#3a2414);
  border:1.5px solid #2a1810; border-radius:4px 4px 7px 7px;
}
.obj .female-hair::before{ left:-5px; }
.obj .female-hair::after{ right:-5px; }

/* ===== 신성 장비 착용 오로라 ===== */
.player-obj.divine-armor .aura-ring{
  position:absolute; top:46%; left:50%; width:66px; height:66px;
  transform:translate(-50%,-50%); border-radius:50%; z-index:-1; pointer-events:none;
  background:radial-gradient(circle, rgba(255,238,130,.55) 0%, rgba(255,212,60,.32) 46%, rgba(255,200,40,0) 72%);
  animation:auraPulse 1.6s ease-in-out infinite;
}
.player-obj.divine-armor .aura-ring::after{
  content:""; position:absolute; inset:7px; border-radius:50%;
  border:2px solid rgba(255,226,96,.85);
  box-shadow:0 0 16px 5px rgba(255,216,70,.8), inset 0 0 12px rgba(255,238,150,.7);
  animation:auraSpin 3.2s linear infinite;
}
.player-obj.divine-armor .spr{ filter:drop-shadow(0 0 7px #ffdf6a) drop-shadow(0 0 3px #ffd24a); }
.player-obj.divine-weapon .job-tool{ filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 4px rgba(185,230,255,.95)); }
.player-obj.divine-weapon .job-tool::before,.player-obj.divine-weapon .job-tool::after{ box-shadow:0 0 10px rgba(255,255,255,.9),0 0 5px rgba(176,226,255,.9); }
@keyframes auraPulse{ 0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(.9);} 50%{ opacity:.95; transform:translate(-50%,-50%) scale(1.1);} }
@keyframes auraSpin{ from{ transform:rotate(0);} to{ transform:rotate(360deg);} }

/* ===== 이스터에그 월드 배너 ===== */
.world-banner{
  position:absolute; left:50%; top:120px; transform:translateX(-50%) translateY(-12px) scale(.96);
  z-index:70; min-width:min(86%,420px); max-width:92%; padding:12px 18px;
  text-align:center; color:#fff; font-weight:bold; line-height:1.45; opacity:0; pointer-events:none;
  background:linear-gradient(135deg,#ff4f8a,#ffb13b 45%,#7d7cff);
  border:3px solid #fff; border-radius:18px;
  box-shadow:0 0 0 3px rgba(255,216,80,.65),0 12px 28px rgba(45,72,105,.35),0 0 26px rgba(255,220,88,.95);
}
.world-banner.show{ animation:worldBannerPop 5s ease-in-out forwards; }
.world-banner .banner-title{ display:block; font-size:15px; color:#fff9b8; text-shadow:0 2px 0 rgba(80,43,95,.55); }
.world-banner .banner-text{ display:block; font-size:12px; margin-top:2px; text-shadow:0 2px 0 rgba(80,43,95,.45); }
@keyframes worldBannerPop{
  0%{ opacity:0; transform:translateX(-50%) translateY(-18px) scale(.92); }
  12%,88%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  100%{ opacity:0; transform:translateX(-50%) translateY(-10px) scale(.98); }
}

</style>
</head>
<body>
  <!-- PC에서는 모바일 세로 프레임처럼 중앙 정렬 -->
  <div id="app">

      <!-- ===== 시작 화면 ===== -->
    <section id="screen-start" class="screen active">
      <div class="start-inner">
        <h1 class="game-title">상인<span>RPG</span></h1>

        <div class="slot-label">캐릭터 슬롯 선택</div>
        <div id="slot-list"></div>

        <div class="start-btns">
          <button id="btn-new" class="btn btn-main">새 게임</button>
          <button id="btn-continue" class="btn btn-sub">이어하기</button>
          <button id="btn-delete" class="btn btn-danger">슬롯 삭제</button>
        </div>
        <div class="start-credit">제작자 : 천사랑과 천운<br>Copyright by 2026</div>
      </div>
    </section>

    <!-- ===== 캐릭터 생성 화면 ===== -->
    <section id="screen-create" class="screen">
      <div class="create-inner">
        <h2 class="screen-title">캐릭터 생성</h2>

        <div class="field">
          <label>이름</label>
          <input id="input-name" type="text" maxlength="8" placeholder="캐릭터 이름 입력" />
        </div>

        <div class="field">
          <label>성별</label>
          <div class="opt-row" id="gender-row">
            <button class="opt" data-gender="남자">남자</button>
            <button class="opt" data-gender="여자">여자</button>
          </div>
        </div>

        <div class="field">
          <label>직업</label>
          <div class="opt-grid" id="job-row">
            <button class="opt" data-job="무기상인">무기상인<small>무기 제작</small></button>
            <button class="opt" data-job="연금술사">연금술사<small>시약·주문서</small></button>
            <button class="opt" data-job="방어구상인">방어구상인<small>방어구 제작</small></button>
            <button class="opt" data-job="요리사">요리사<small>요리 제작</small></button>
            <button class="opt" data-job="잡화상인">잡화상인<small>판매 보너스</small></button>
          </div>
        </div>

        <div class="create-btns">
          <button id="btn-create-back" class="btn btn-sub">뒤로</button>
          <button id="btn-create-start" class="btn btn-main" disabled>게임 시작</button>
        </div>
      </div>
    </section>

    <!-- ===== 프롤로그 화면 ===== -->
    <section id="screen-prologue" class="screen">
      <div class="prologue-scene">
        <div class="sprite npc-demon big" title="대악마"><div class="face"><span class="eye"></span><span class="eye"></span></div></div>
        <div class="sprite player-fallen" title="쓰러진 아버지"><div class="face"><span class="eye dead"></span><span class="eye dead"></span></div></div>
        <div class="sprite player-child" title="어린 주인공"><div class="face"><span class="eye"></span><span class="eye"></span></div></div>
      </div>
      <div class="prologue-text" id="prologue-text"></div>
      <div class="prologue-btns">
        <button id="btn-prologue-skip" class="btn btn-sub">건너뛰기</button>
        <button id="btn-prologue-next" class="btn btn-main">다음</button>
      </div>
    </section>

    <!-- ===== 메인 게임 화면 ===== -->
    <section id="screen-game" class="screen">
      <!-- 상단 상태바 -->
      <header id="topbar">
        <div class="top-row1">
          <span id="t-slot" class="badge">슬롯</span>
          <span id="t-name">이름</span>
          <span id="t-gender">성별</span>
          <span id="t-job">직업</span>
        </div>
        <div class="top-row2">
          <span class="t-loc">📍<b id="t-location">마을</b></span>
          <span class="t-gold">💰<b id="t-gold">0</b></span>
          <span class="t-hp hp-wrap">❤️<b id="t-hp">100/100</b><span class="hp-mini"><span id="hp-fill"></span></span></span>
          <span class="t-vital vital-wrap">🍽️<b id="t-vital">100/100</b><span class="vital-mini"><span id="vital-fill"></span></span></span>
          <span class="t-shop">🏪 Lv.<b id="t-shoplv">1</b></span>
          <span id="t-blessing" class="badge" style="display:none;background:#fff3c4;border-color:#e6c64a;">😇 축복 <b id="t-blessing-time">10:00</b></span>

function isDemonZone(loc) { return !!loc && (loc.type === "demonWorld" || loc.type === "demonRoom"); }
function isSanctumZone(loc) { return !!loc && loc.type === "sanctum"; }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("#" + id).classList.add("active");
}

let toastTimer = null;
function uiTopOffset() {
  const tb = document.getElementById("topbar");
  const app = document.getElementById("app");
  if (!tb || !app) return 64;
  return Math.round(tb.getBoundingClientRect().bottom - app.getBoundingClientRect().top) + 8;
}

function showMessage(message) {
  const t = $("#toast");
  t.textContent = message;
  let top = uiTopOffset();
  const wb = document.getElementById("world-banner");
  if (wb && wb.classList.contains("show")) top += wb.offsetHeight + 10;
  t.style.top = top + "px";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

let worldBannerTimer = null;
function showWorldBanner(title, text) {
  const b = $("#world-banner");
  if (!b) return;
  b.style.top = uiTopOffset() + "px";
  b.innerHTML = `<span class="banner-title">${title}</span><span class="banner-text">${text}</span>`;
  b.classList.remove("show");
  void b.offsetWidth;
  b.classList.add("show");
  clearTimeout(worldBannerTimer);
  worldBannerTimer = setTimeout(() => b.classList.remove("show"), 5000);
}

let npcDialogTimer = null;
function showNpcMessage(message) {
  const d = $("#npc-dialog");
  const idx = message.indexOf(":");
  let html;
  if (idx > -1 && idx <= 12) {
    const name = message.slice(0, idx).trim();
    const text = message.slice(idx + 1).trim();
    html = `<div class="npc-name">${name}</div><div class="npc-text">${text}</div>`;
  } else {
    html = `<div class="npc-text">${message}</div>`;
  }
  d.innerHTML = html;
  d.classList.add("show");
  clearTimeout(npcDialogTimer);
  npcDialogTimer = setTimeout(() => d.classList.remove("show"), 2000);
  d.onclick = () => { clearTimeout(npcDialogTimer); d.classList.remove("show"); };
}

/* 모달 */
function openModal(title, bodyHTML, actions) {
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = bodyHTML;
  const act = $("#modal-actions");
  act.innerHTML = "";
  (actions || []).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.cls || "btn-sub");
    b.textContent = a.label;
    b.onclick = a.onClick;
    act.appendChild(b);
  });
  $("#modal").classList.add("open");
}
function closeModal() {
  $("#modal").classList.remove("open");
  if (remoteStorageInvincible) {
    clearTimeout(remoteStorageInvincibleTimer);
    remoteStorageInvincibleTimer = setTimeout(() => {
      remoteStorageInvincible = false;
      showMessage("원격보관 보호 효과가 사라졌습니다.");
    }, 1000);
  }
}

/* 스프라이트 HTML (data-URI 픽셀아트 사용, 없으면 박스 폴백) */
function spriteHTML(cls, big) {
  // "mon xxx" 형태 호환: 접두사 제거
  let key = cls && cls.indexOf("mon ") === 0 ? cls.slice(4) : cls;
  if (typeof GAMESPR !== "undefined" && GAMESPR[key]) {
    const tall = /^(player|npc)/.test(key);
    return `<img class="spr ${tall ? "spr-char" : "spr-mon"}${big ? " big" : ""}" src="${GAMESPR[key]}" alt="${key}" draggable="false">`;
  }
  return `<div class="sprite ${cls}${big ? " big" : ""}"><div class="face"><span class="eye"></span><span class="eye"></span></div></div>`;
}
/* 아이템 아이콘 HTML */
function itemIcon(name) {
  const iconName = { "원격보관 주문서": "불꽃 주문서", "보호 주문서": "고대 마법서" }[name] || name;
  if (name === "이상한 알") return petIconHTML(0, true);
  if (PET_ITEMS.indexOf(name) !== -1) return petIconHTML(PET_ITEMS.indexOf(name) + 1, true);
  if (name === "귀환주문서") return `<span class="scroll-icon" aria-label="${name}"></span>`;
  if (POTION_ITEMS.indexOf(name) !== -1) {
    const cls = name === "회복약 대" ? "large" : name === "회복약 중" ? "mid" : "small";
    return `<span class="potion-vial ${cls}" aria-label="${name}"></span>`;
  }
  if (typeof GAMESPR !== "undefined" && GAMESPR[iconName]) {
    return `<img class="item-ic" src="${GAMESPR[iconName]}" alt="${name}" draggable="false">`;
  }
  const col = (items[name] && items[name].color) || "#888";
  return `<div class="ic" style="background:${col}"></div>`;
}

    : level === 2
      ? `<rect x="7" y="13" width="17" height="12" fill="${shell}"/><rect x="5" y="18" width="4" height="7" fill="${shell}"/><rect x="23" y="18" width="4" height="6" fill="${shell}"/><rect x="23" y="21" width="6" height="3" fill="${shade}"/><rect x="9" y="25" width="5" height="3" fill="${dark}"/><rect x="18" y="25" width="5" height="3" fill="${dark}"/>`
      : `<rect x="6" y="12" width="17" height="13" fill="${shell}"/><rect x="4" y="17" width="4" height="7" fill="${shell}"/><rect x="22" y="16" width="4" height="8" fill="${shell}"/><rect x="25" y="20" width="5" height="3" fill="${shade}"/><rect x="8" y="25" width="6" height="3" fill="${dark}"/><rect x="18" y="25" width="6" height="3" fill="${dark}"/>`;
  return `<span class="${cls}" aria-label="${level}단계 펫"><svg viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="9" y="3" width="14" height="2" fill="${dark}"/><rect x="7" y="5" width="18" height="3" fill="${shell}"/><rect x="5" y="8" width="22" height="6" fill="${shell}"/><rect x="5" y="12" width="3" height="4" fill="${dark}"/><rect x="24" y="12" width="3" height="4" fill="${dark}"/>
    ${spots}${body}
    <rect x="9" y="14" width="3" height="5" fill="${dark}"/><rect x="20" y="14" width="3" height="5" fill="${dark}"/><rect x="10" y="14" width="1" height="1" fill="#fff"/><rect x="21" y="14" width="1" height="1" fill="#fff"/>
    <rect x="14" y="19" width="2" height="1" fill="${dark}"/><rect x="18" y="19" width="2" height="1" fill="${dark}"/><rect x="14" y="22" width="5" height="1" fill="${dark}"/>
  </svg></span>`;
}

function playerCls() { return gameState.gender === "여자" ? "player-f" : "player-m"; }
function getJobToolClass() {
  if (!gameState) return "tool-hammer";
  if (gameState.job === "연금술사") return "tool-book";
  if (gameState.job === "잡화상인") return "tool-bundle";
  if (gameState.job === "요리사") return "tool-pan";
  return "tool-hammer";
}

function getBestPotionOwned() {
  if (!gameState || !gameState.inventory) return null;
  if ((gameState.hp || 0) >= (gameState.maxHp || 100)) return null;
  const missingHp = Math.max(1, (gameState.maxHp || 100) - (gameState.hp || 0));
  for (let i = 0; i < POTION_ITEMS.length; i++) {
    const name = POTION_ITEMS[i];
    const it = items[name];
    if ((gameState.inventory[name] || 0) > 0 && it && Math.ceil((gameState.maxHp || 100) * it.healPct) >= missingHp) return name;
  }
  for (let i = POTION_ITEMS.length - 1; i >= 0; i--) {
    const name = POTION_ITEMS[i];
    if ((gameState.inventory[name] || 0) > 0) return name;
  }
  return null;
}

function getPotionCount() {
  if (!gameState || !gameState.inventory) return 0;
  return POTION_ITEMS.reduce((sum, name) => sum + (gameState.inventory[name] || 0), 0);
}

function updatePlayerHpBar() {
  const fill = $("#player-hp-fill");
  if (!fill || !gameState || !gameState.maxHp) return;
  fill.style.width = Math.max(0, Math.min(100, (gameState.hp / gameState.maxHp) * 100)) + "%";
}

function updatePotionQuickSlot() {
  const btn = $("#btn-potion-quick");
  if (!btn) return;
  const potion = getBestPotionOwned();
  const count = Math.min(99, getPotionCount());
  btn.disabled = !potion;
  btn.dataset.potion = potion || "";
  const icon = btn.querySelector(".potion-icon");
  const countEl = btn.querySelector(".potion-count");
  if (icon) icon.innerHTML = itemIcon(potion || "회복약 소");
  if (countEl) countEl.textContent = String(count);
}

function updateReturnQuickSlot() {
  const btn = $("#btn-return-quick");
  if (!btn || !gameState) return;
  const count = Math.min(99, gameState.inventory["귀환주문서"] || 0);
  btn.disabled = count <= 0;
  const countEl = btn.querySelector(".return-count");
  if (countEl) countEl.textContent = String(count);
}

function useQuickPotion() {
  const potion = getBestPotionOwned();
  if (!potion) {
    showMessage(gameState && gameState.hp >= gameState.maxHp ? "이미 체력이 가득 찼습니다." : "가방에 회복약이 없습니다.");
    updatePotionQuickSlot();
    return;
  }
  useItem(potion, false);
}

function useQuickReturnScroll() {
  if (!gameState || !gameState.inventory["귀환주문서"]) {
    showMessage("귀환주문서가 없습니다.");
    updateReturnQuickSlot();
    return;
  }
  useItem("귀환주문서", false);
}

/* ============================================================
   저장 슬롯 시스템
============================================================ */
function getSaveKey(slotId) { return "merchantRpgSaveSlot" + slotId; }

function hasSaveData(slotId) {
  return LS.getItem(getSaveKey(slotId)) !== null;
}

function loadSlotData(slotId) {
  const raw = LS.getItem(getSaveKey(slotId));
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

function saveSlotData(slotId, data) {
  LS.setItem(getSaveKey(slotId), JSON.stringify(data));
}

function deleteSlotData(slotId) {
  LS.removeItem(getSaveKey(slotId)); // 선택 슬롯만 삭제
}

function selectSaveSlot(slotId) {
  currentSlotId = slotId;
  LS.setItem("merchantRpgCurrentSlot", String(slotId));
  renderSaveSlots();
}

/* 시작 화면 슬롯 요약 렌더 */
function getSavedLocationLabel(data) {
  const loc = locations[data.currentLocation];
  if (!loc) return data.currentLocation || "알 수 없음";
  if (loc.type === "forest") return `${loc.name} ${data.currentForestLevel || loc.level || 1}단계`;
  return loc.name;
}

function getSavedStorageCount(data) {
  const storage = data.storage && typeof data.storage === "object" ? data.storage : {};
  return Object.keys(storage).reduce((sum, name) => sum + (storage[name] || 0), 0);
}

function getSavedBestEquipment(order, data, equippedKey) {
  const inv = data.inventory && typeof data.inventory === "object" ? data.inventory : {};
  if (data[equippedKey] === "") return "해제";
  if (data[equippedKey] && inv[data[equippedKey]]) return data[equippedKey];
  for (let i = order.length - 1; i >= 0; i--) {
    if (inv[order[i]]) return order[i];
  }
  return equippedKey === "equippedWeapon" ? "맨손" : "평상복";
}

function renderSaveSlots() {
  const list = $("#slot-list");
  list.innerHTML = "";
  [1, 2, 3, 4].forEach(id => {
    const data = loadSlotData(id);
    const card = document.createElement("div");
    card.className = "slot-card" + (id === currentSlotId ? " selected" : "");
    card.onclick = () => selectSaveSlot(id);
    if (!data || !data.isGameCreated) {
      card.classList.add("empty");
      card.innerHTML = `<div class="slot-head">슬롯 ${id} ${id === currentSlotId ? '<span class="sel-tag">선택됨</span>' : ''}</div><div class="slot-info"><span>빈 슬롯입니다.</span></div>`;
    } else {
      const loc = getSavedLocationLabel(data);
      const weapon = getSavedBestEquipment(WEAPON_ORDER, data, "equippedWeapon");
      const armor = getSavedBestEquipment(ARMOR_ORDER, data, "equippedArmor");
      const storageCount = getSavedStorageCount(data);
      const stateLabel = data.isAdmin ? "운영자 테스트" : data.isGameCleared ? "클리어" : data.hasResurrectionHeart ? "부활의 심장 보유" : data.demonRoomUnlocked ? "대악마의 방 개방" : "진행 중";
      card.innerHTML = `
        <div class="slot-head">슬롯 ${id} · ${data.chocoGreedy ? "[욕심쟁이] " : ""}${data.playerName} ${id === currentSlotId ? '<span class="sel-tag">선택됨</span>' : ''}</div>
        <div class="slot-info">
          <span>${data.gender} · ${data.job} · ${stateLabel}</span>
          <span>로그아웃 위치: ${loc}</span>
          <span>보유 골드 ${fmt(data.gold || 0)} · 금고 ${fmt(data.vaultGold || 0)}</span>
          <span>창고 ${fmt(storageCount)}개 · 상점 Lv.${data.globalShopLevel || 1}</span>
          <span>HP ${data.hp || defaultGameState.maxHp}/${data.maxHp || defaultGameState.maxHp} · 활력 ${typeof data.vitality === "number" ? data.vitality : defaultGameState.maxVitality}/${data.maxVitality || defaultGameState.maxVitality}</span>
          <span>${weapon} · ${armor}</span>
        </div>`;
    }
    list.appendChild(card);
  });
  // 이어하기 버튼 활성/비활성
  const cont = $("#btn-continue");
  const d = loadSlotData(currentSlotId);
  cont.disabled = !(d && d.isGameCreated);
}

/* ============================================================
   게임 시작 / 이어하기 / 캐릭터 생성
============================================================ */
function startNewGame() {
  if (hasSaveData(currentSlotId) && loadSlotData(currentSlotId).isGameCreated) {
    openModal("새 게임", "이 슬롯의 기존 캐릭터 정보가 삭제됩니다. 새 게임을 시작하시겠습니까?", [
      { label: "취소", cls: "btn-sub", onClick: closeModal },
      { label: "확인", cls: "btn-danger", onClick: () => { deleteSlotData(currentSlotId); closeModal(); gotoCreation(); } }
    ]);
  } else {
    gotoCreation();
  }
}

function gotoCreation() {
  creationBuffer = { name: "", gender: "", job: "" };
  $("#input-name").value = "";
  document.querySelectorAll("#gender-row .opt, #job-row .opt").forEach(o => o.classList.remove("selected"));
  $("#btn-create-start").disabled = true;
  showScreen("screen-create");
}

function continueGame() {
  const data = loadSlotData(currentSlotId);
  if (!data || !data.isGameCreated) {
    showMessage("선택한 슬롯에 저장된 캐릭터가 없습니다.");
    return;
  }
  gameState = Object.assign({}, defaultGameState, data);
  normalizeGameState();
  loadGame();
}

function createCharacter() {
  if (!creationBuffer.name.trim()) { showMessage("이름을 입력하세요."); return; }
  if (!creationBuffer.gender) { showMessage("성별을 선택하세요."); return; }
  if (!creationBuffer.job) { showMessage("직업을 선택하세요."); return; }
  const isAdmin = creationBuffer.name.trim() === "사랑해요";

  gameState = Object.assign({}, defaultGameState, {
    slotId: currentSlotId,
    playerName: isAdmin ? "운영자" : creationBuffer.name.trim(),
    gender: creationBuffer.gender,
    job: creationBuffer.job,
    gold: isAdmin ? 9999999999 : 0,
    hp: defaultGameState.maxHp,
    maxHp: defaultGameState.maxHp,
    vitality: defaultGameState.maxVitality,
    maxVitality: defaultGameState.maxVitality,
    lastVitalityTick: Date.now(),
    lastStarveTick: Date.now(),
    inventory: isAdmin ? createAdminInventory() : {},
    storage: {},
    equippedWeapon: isAdmin ? "신성검" : null,
    equippedArmor: isAdmin ? "신성갑옷" : null,
    equippedPet: isAdmin ? "3단계 펫" : null,
    currentLocation: "village",
    currentForestLevel: 1,
    globalShopLevel: isAdmin ? 3 : 1,
    vaultGold: isAdmin ? 9999999999 : 0,
    demonRoomUnlocked: isAdmin,
    hasSeenPrologue: isAdmin,
    isAdmin,
    isGameCreated: true
  });
  normalizeGameState();
  if (isAdmin) gameState.hp = gameState.maxHp;
  saveGame();
  if (isAdmin) {
    showMessage("운영자 테스트 캐릭터가 생성되었습니다.");
    enterGame();
  } else {
    showPrologue();
  }
}

function normalizeGameState() {
  if (!gameState.inventory || typeof gameState.inventory !== "object") gameState.inventory = {};
  if (!gameState.storage || typeof gameState.storage !== "object") gameState.storage = {};
  migrateItemName("불꽃 주문서", "원격보관 주문서");
  migrateItemName("고대 마법서", "보호 주문서");
  if (typeof gameState.equippedWeapon === "undefined") gameState.equippedWeapon = null;
  if (typeof gameState.equippedArmor === "undefined") gameState.equippedArmor = null;
  if (typeof gameState.equippedPet === "undefined") gameState.equippedPet = null;
  if (gameState.equippedPet && !hasItem(gameState.equippedPet)) gameState.equippedPet = "";
  const nextMaxHp = getPlayerMaxHp();
  gameState.maxHp = nextMaxHp;
  if (!gameState.hp || gameState.hp <= 0) gameState.hp = gameState.maxHp;
  gameState.hp = Math.min(gameState.hp, gameState.maxHp);
  if (!gameState.maxVitality) gameState.maxVitality = defaultGameState.maxVitality;
  if (typeof gameState.vitality !== "number") gameState.vitality = gameState.maxVitality;
  gameState.vitality = Math.max(0, Math.min(gameState.maxVitality, gameState.vitality));
  if (!gameState.lastVitalityTick) gameState.lastVitalityTick = Date.now();
  if (!gameState.lastStarveTick) gameState.lastStarveTick = Date.now();
  if (!gameState.lastHealTick) gameState.lastHealTick = Date.now();
  if (typeof gameState.gold !== "number") gameState.gold = Number(gameState.gold || 0);
  if (typeof gameState.chocoClickStreak !== "number") gameState.chocoClickStreak = 0;
  if (typeof gameState.chocoRewardClaimed !== "boolean") gameState.chocoRewardClaimed = false;
  if (typeof gameState.chocoGreedy !== "boolean") gameState.chocoGreedy = false;
  if (typeof gameState.vaultGold !== "number" || gameState.vaultGold < 0) gameState.vaultGold = 0;
  if (typeof gameState.residentTalkCount !== "number") gameState.residentTalkCount = 0;
  if (typeof gameState.residentRewardCount !== "number") gameState.residentRewardCount = 0;
  if (typeof gameState.demonRoomUnlocked !== "boolean") gameState.demonRoomUnlocked = false;
  if (typeof gameState.isAdmin !== "boolean") gameState.isAdmin = false;
}

/* ============================================================
   프롤로그
============================================================ */
const prologueText = `오래전, 평화로운 마을에 한 상인 가족이 살고 있었습니다.

그러던 어느 날, 마계의 대악마가 마을을 습격했습니다.

주인공의 아버지는 가족과 마을을 지키기 위해 대악마에게 맞섰지만,
끝내 목숨을 잃고 말았습니다.

마을의 촌장님은 말했습니다.

"죽은 자를 되살릴 수 있는 전설의 보물, 부활의 심장이 있다.
하지만 그것을 얻기 위해서는 100억 골드가 필요하다."

이제 주인공은 아버지를 되살리기 위해 상인의 길을 걷습니다.

상점에서 물건을 팔고,
