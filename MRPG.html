마침내 100억 골드를 모아야 합니다.

최종 목표는 단 하나.

부활의 심장을 구매해 아버지를 되살리는 것입니다.`;

function showPrologue() {
  $("#prologue-text").textContent = prologueText;
  showScreen("screen-prologue");
}
function skipPrologue() { completePrologue(); }
function completePrologue() {
  gameState.hasSeenPrologue = true;
  saveGame();
  enterGame();
}

/* ============================================================
   게임 진입 / 저장 / 로드
============================================================ */
function enterGame() {
  showScreen("screen-game");
  initMovementControls();
  changeLocation(gameState.currentLocation || "village");
  render();
}

function loadGame() {
  if (gameState.isGameCleared || gameState.hasSeenPrologue) {
    enterGame();
  } else {
    showPrologue();
  }
}

function saveGame() {
  if (!gameState) return;
  gameState.slotId = currentSlotId;
  saveSlotData(currentSlotId, gameState);
}

function resetGame() {
  deleteSlotData(currentSlotId);
  renderSaveSlots();
}

/* ============================================================
   상단바 / 진행률 렌더
============================================================ */
function calculateGoalProgress() {
  return (gameState.gold / RESURRECTION_PRICE) * 100;
}

function displayName() {
  if (!gameState) return "";
  return (gameState.chocoGreedy ? "[욕심쟁이] " : "") + gameState.playerName;
}

function render() {
  if (!gameState) return;
  normalizeGameState();
  $("#t-slot").textContent = "슬롯 " + currentSlotId;
  $("#t-name").textContent = displayName();
  $("#t-gender").textContent = gameState.gender;
  $("#t-job").textContent = gameState.job;
  $("#t-location").textContent = locations[gameState.currentLocation].name;
  $("#t-gold").textContent = fmt(gameState.gold);
  $("#t-hp").textContent = `${Math.max(0, gameState.hp)} / ${gameState.maxHp}`;
  $("#hp-fill").style.width = Math.max(0, Math.min(100, (gameState.hp / gameState.maxHp) * 100)) + "%";
  $("#screen-game").classList.toggle("low-hp", gameState.hp / gameState.maxHp < 0.3);
  $("#t-vital").textContent = `${Math.max(0, gameState.vitality)} / ${gameState.maxVitality}`;
  $("#vital-fill").style.width = Math.max(0, Math.min(100, (gameState.vitality / gameState.maxVitality) * 100)) + "%";
  $(".hp-mini").classList.toggle("danger-pulse", gameState.vitality <= 0);
  $(".vital-mini").classList.toggle("danger-pulse", gameState.vitality <= 0);
  $("#t-shoplv").textContent = gameState.globalShopLevel;
  updateBlessingBadge();
  updatePlayerHpBar();
  updatePotionQuickSlot();
  updateReturnQuickSlot();
  const pa = $("#player-avatar");
  if (pa) {
    pa.classList.toggle("divine-armor", hasDivineArmor());
    pa.classList.toggle("divine-weapon", hasDivineWeapon());
  }
  refreshPetCompanion();

  const prog = calculateGoalProgress();
  $("#goal-fill").style.width = Math.min(prog, 100) + "%";
  $("#goal-num").textContent = `부활의 심장까지: ${fmt(gameState.gold)} / ${fmt(RESURRECTION_PRICE)} 골드 (진행률 ${prog.toFixed(2)}%)`;

}

/* ============================================================
   지역 이동 / 렌더
============================================================ */
function changeLocation(locationKey, fromKey) {
  if (locationKey === "forest") locationKey = "forest" + (gameState.currentForestLevel || 1);
  if (!locations[locationKey]) return;
  playAreaTransition();
  if (fromKey) {
    const rp = returnPortalPos(locationKey, fromKey);
    if (rp) pendingPlayerPos = rp;
  }
  gameState.currentLocation = locationKey;
  if (locations[locationKey].type === "forest") {
    gameState.currentForestLevel = locations[locationKey].level;
  }
  saveGame();
  renderLocation();
  render();
}

function playAreaTransition() {
  const area = $("#game-area");
  if (!area) return;
  area.classList.remove("area-transition");
  void area.offsetWidth;
  area.classList.add("area-transition");
  setTimeout(() => area.classList.remove("area-transition"), 560);
}

function defaultPlayerPos(locationKey) {
  const loc = locations[locationKey];
  if (!loc) return { x: 44, y: 78 };
  if (loc.type === "village") return { x: 14, y: 76 };
  if (loc.type === "forest") return { x: 45, y: 74 };
  if (loc.type === "heaven") return { x: 45, y: 70 };
  if (loc.type === "demonWorld") return { x: 12, y: 70 };
  if (loc.type === "demonRoom") return { x: 18, y: 80 };
  return { x: 44, y: 78 };
}

function homeFrontPos() {
  return { x: 73, y: 66 };
}

function ensurePlayerPos() {
  if (!gameState.playerPos) gameState.playerPos = defaultPlayerPos(gameState.currentLocation);
}

function clampPos(pos) {
  return { x: Math.max(3, Math.min(96, pos.x)), y: Math.max(5, Math.min(94, pos.y)) };
}

function setPlayerPos(pos) {
  ensurePlayerPos();
  gameState.playerPos = clampPos(pos);
  const p = $("#player-avatar");
  if (p) {
    p.style.left = gameState.playerPos.x + "%";
    p.style.top = gameState.playerPos.y + "%";
  }
  updatePetCompanionPos();
  updateCamera();
  updateNearbyInteraction();
  renderMiniMap();
}

function updateMonsterHpBar(monster, zone = "forest", forestLevel = 1) {

function animatePlayerAction(type, target) {

function updateCamera() {
  const area = $("#game-area");
  const world = $("#world-layer");
  if (!area || !world || !gameState || !gameState.playerPos) return;
  const worldW = WORLD.w, worldH = WORLD.h;
  const areaW = area.clientWidth, areaH = area.clientHeight;
  // 큰 화면일수록 가시 논리 폭을 넓혀 캐릭터와 월드가 과하게 확대되지 않게 조정
  const viewWLogical =
    areaW >= 1100 ? VIEW_W_DESKTOP :
    areaW >= 768 ? VIEW_W_TABLET :
    areaW >= 640 ? VIEW_W_LOGICAL * Math.SQRT2 :
    VIEW_W_LOGICAL;
  const z = areaW > 0 ? areaW / viewWLogical : 1;   // 화면 폭을 기준으로 줌 산출 → 캐릭터 크기 일정
  currentZoom = z;
  const viewW = areaW / z;   // 실제로 보이는 논리 폭(=VIEW_W_LOGICAL)
  const viewH = areaH / z;   // 실제로 보이는 논리 높이(기기 비율에 따라 가변)
  const playerX = (gameState.playerPos.x / 100) * worldW;
  const playerY = (gameState.playerPos.y / 100) * worldH;
  const maxX = Math.max(0, worldW - viewW);
  const maxY = Math.max(0, worldH - viewH);
  cameraPx.x = Math.max(0, Math.min(maxX, playerX - viewW * .5));
  cameraPx.y = Math.max(0, Math.min(maxY, playerY - viewH * .52));
  world.style.transform = `scale(${z}) translate3d(${-cameraPx.x}px,${-cameraPx.y}px,0)`;
}

function getPetLevel() {
  const pet = getEquippedPetItem();
  const idx = PET_ITEMS.indexOf(pet);
  if (idx !== -1) return idx + 1;
  return 0;
}

function getPetItemName(level = getPetLevel()) {
  return level > 0 ? PET_ITEMS[level - 1] : "";
}

function getEquippedPetItem() {
  if (!gameState || gameState.equippedPet === "") return "";
  if (gameState.equippedPet && hasItem(gameState.equippedPet)) return gameState.equippedPet;
  return "";
}

function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function posFromPercent(top, left) {
  return { x: parseFloat(left), y: parseFloat(top) };
}

function registerWorldObject(el, data) {
  const obj = Object.assign({ radius: 8, label: "상호작용" }, data, { el });
  worldObjects.push(obj);
  el.onclick = (ev) => {
    ev.stopPropagation();
    walkTo(obj.pos.x, obj.pos.y, () => tryInteract(obj));
  };
  return obj;
}

function walkTo(x, y, onArrive) {
  targetMove = { pos: clampPos({ x, y }), onArrive };
}

function updateNearbyInteraction() {
  if (!gameState || !gameState.playerPos) return;
  let nearest = null, nearestDist = Infinity;
  worldObjects.forEach(o => {
    const d = dist(gameState.playerPos, o.pos);
    const near = d <= o.radius;
    o.el.classList.toggle("near", near);
    if (near && d < nearestDist) { nearest = o; nearestDist = d; }
  });
  activeInteract = nearest;
  const btn = $("#btn-interact");
  if (btn) {
    btn.disabled = !nearest;
    btn.innerHTML = `<span class="quick-key-dot">space</span><span>${nearest ? nearest.label : "가까이 가기"}</span>`;
  }
}

function tryInteract(obj) {
  if (!obj || !gameState || dist(gameState.playerPos, obj.pos) > obj.radius) {
    showMessage("조금 더 가까이 가야 합니다.");
    return;
  }
  obj.action();
}

function areaPointFromEvent(ev) {
  const area = $("#game-area");
  const rect = area.getBoundingClientRect();
  const point = ev.touches ? ev.touches[0] : ev;
  const z = currentZoom || 1;
  const worldW = WORLD.w, worldH = WORLD.h;
  const wx = (point.clientX - rect.left) / z + cameraPx.x;
  const wy = (point.clientY - rect.top) / z + cameraPx.y;
  return {
    x: (wx / worldW) * 100,
    y: (wy / worldH) * 100
  };
}

  ret.addEventListener("pointerdown", (ev) => { ev.preventDefault(); ev.stopPropagation(); });

  area.appendChild(ret);

  const map = document.createElement("div");
  map.id = "map-panel";
  map.className = "map-panel" + (isMapOpen ? " open" : "");
  map.innerHTML = `<div class="map-title">현재 맵</div><div id="map-canvas" class="map-canvas"></div>`;
  area.appendChild(map);
  document.querySelectorAll('.nav-btn[data-act="map"]').forEach(b => b.classList.toggle("active-toggle", isMapOpen));

  const stick = pad.querySelector(".joystick-stick");
  const resetJoystick = () => {
    joystickVector.x = 0;
    joystickVector.y = 0;
    joystickVector.active = false;
    pad.classList.remove("dragging");
    stick.style.transform = "translate(-50%,-50%)";
  };
  const updateJoystick = (ev) => {
    const rect = pad.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const max = rect.width * .34;
    let dx = ev.clientX - cx;
    let dy = ev.clientY - cy;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const clamped = Math.min(max, len);
    dx = (dx / len) * clamped;
    dy = (dy / len) * clamped;
    const power = clamped / max;
    joystickVector.x = power < .12 ? 0 : (dx / max);
    joystickVector.y = power < .12 ? 0 : (dy / max);
    joystickVector.active = power >= .12;
    stick.style.transform = `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  };
  pad.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    targetMove = null;
    pad.classList.add("dragging");
    if (pad.setPointerCapture) pad.setPointerCapture(ev.pointerId);
    updateJoystick(ev);
  });
  pad.addEventListener("pointermove", (ev) => {
    if (!pad.classList.contains("dragging")) return;
    ev.preventDefault();
    ev.stopPropagation();
    updateJoystick(ev);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(type => {
    pad.addEventListener(type, (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      resetJoystick();
    });
  });
  area.onclick = (ev) => {
    if (ev.target.closest(".obj,.touch-controls,.interact-btn,.potion-quick,.return-quick")) return;
    const p = areaPointFromEvent(ev);
    walkTo(p.x, p.y);
  };
  updatePotionQuickSlot();
  updateReturnQuickSlot();
}

function initMovementControls() {
  if (controlsReady) return;
  controlsReady = true;
  document.addEventListener("keydown", (ev) => {
    if (ev.target && /input|textarea|select/i.test(ev.target.tagName || "")) return;
    const k = ev.key.toLowerCase();
    if (k === "1") { ev.preventDefault(); useQuickPotion(); return; }
    if (k === "control" && !ev.repeat) { ev.preventDefault(); useQuickReturnScroll(); return; }
    if (["arrowup", "w"].includes(k)) moveKeys.up = true;
    if (["arrowdown", "s"].includes(k)) moveKeys.down = true;
    if (["arrowleft", "a"].includes(k)) moveKeys.left = true;
    if (["arrowright", "d"].includes(k)) moveKeys.right = true;
    if (k === " " || k === "enter") tryInteract(activeInteract);
  });
  document.addEventListener("keyup", (ev) => {
    const k = ev.key.toLowerCase();
    if (["arrowup", "w"].includes(k)) moveKeys.up = false;
    if (["arrowdown", "s"].includes(k)) moveKeys.down = false;
    if (["arrowleft", "a"].includes(k)) moveKeys.left = false;
    if (["arrowright", "d"].includes(k)) moveKeys.right = false;
  });
  window.addEventListener("resize", updateCamera);
  gameState.lastVitalityTick = Date.now();
  gameState.lastStarveTick = Date.now();
  gameState.lastHealTick = Date.now();
  movementTimer = setInterval(updateMovement, 40);
  survivalTimer = setInterval(updateSurvival, 1000);
}

function updateSurvival() {
  if (!gameState || !$("#screen-game").classList.contains("active")) return;
  normalizeGameState();
  const now = Date.now();
  let changed = false;
  const vitalityDecayMs = VITALITY_DECAY_MS * (getPetLevel() >= 1 ? 2 : 1);
  const vitalitySteps = Math.floor((now - gameState.lastVitalityTick) / vitalityDecayMs);
  if (vitalitySteps > 0) {
    gameState.lastVitalityTick += vitalitySteps * vitalityDecayMs;
    if (gameState.vitality > 0) {
      gameState.vitality = Math.max(0, gameState.vitality - vitalitySteps);
      changed = true;
      if (gameState.vitality === 0) {
        gameState.lastStarveTick = now;
        showMessage("활력이 0이 되었습니다.\n음식을 먹지 않으면 체력이 감소합니다.");
      }
    }
  }
  if (gameState.vitality <= 0) {
    const starveSteps = Math.floor((now - gameState.lastStarveTick) / STARVE_DAMAGE_MS);
    if (starveSteps > 0) {
      gameState.lastStarveTick += starveSteps * STARVE_DAMAGE_MS;
      const damage = Math.max(1, Math.ceil(gameState.maxHp * 0.01)) * starveSteps;
      const escaped = takeDamage(damage, "굶주림");
      if (!escaped) showMessage(`활력이 바닥났습니다.\n굶주림으로 HP ${damage} 감소`);
      changed = true;
    }
  } else {
    gameState.lastStarveTick = now;
  }
  // 체력 자연회복: 활력이 남아있을 때 5초당 1 (굶주릴 땐 회복 정지)
  if (gameState.vitality > 0 && gameState.hp < gameState.maxHp) {
    const healSteps = Math.floor((now - gameState.lastHealTick) / HP_REGEN_MS);
    if (healSteps > 0) {
      gameState.lastHealTick += healSteps * HP_REGEN_MS;
      gameState.hp = Math.min(gameState.maxHp, gameState.hp + healSteps);
      changed = true;
    }
  } else {
    gameState.lastHealTick = now;
  }
  if (changed) {
    render();
    saveGame();
  }
  updateBlessingBadge();
  updatePetAutoPotion(now);
}

function updateBlessingBadge() {
  const el = $("#t-blessing");
  if (!el) return;
  if (isDemonBlessingActive()) {
    const ms = demonBlessingRemainMs();
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    el.style.display = "";
    const t = $("#t-blessing-time");
    if (t) t.textContent = `${m}:${String(s).padStart(2, "0")}`;
  } else {
    el.style.display = "none";
  }
}

function updateMovement() {
  if (!gameState || !$("#screen-game").classList.contains("active")) return;
  if ($("#modal").classList.contains("open")) return;
  ensurePlayerPos();
  updateAggroAttacks();
  updatePetAutoGather();
  let dx = (moveKeys.right ? 1 : 0) - (moveKeys.left ? 1 : 0);
  let dy = (moveKeys.down ? 1 : 0) - (moveKeys.up ? 1 : 0);
  let speedScale = 1;
  if (joystickVector.active) {
    dx = joystickVector.x;
    dy = joystickVector.y;
    speedScale = Math.min(1, Math.sqrt(dx * dx + dy * dy));
  }
  if (targetMove) {
    dx = targetMove.pos.x - gameState.playerPos.x;
    dy = targetMove.pos.y - gameState.playerPos.y;
    speedScale = 1;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1.2) {
      const arrive = targetMove.onArrive;
      targetMove = null;
      setPlayerWalking(false);
      if (arrive) arrive();
      return;
    }
    dx /= d; dy /= d;
  }
  if (!dx && !dy) { setPlayerWalking(false); return; }
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const speed = 1.15;
  setPlayerWalking(true);
  setPlayerPos({ x: gameState.playerPos.x + (dx / len) * speed * speedScale, y: gameState.playerPos.y + (dy / len) * speed * speedScale });
}

function updateAggroAttacks() {
  const loc = locations[gameState.currentLocation];
  if (!loc || !gameState.playerPos) return;
  let monsters = [];
  let difficultyFor = null;
  let extraDamage = 0;
  if (loc.type === "forest" && gameState.currentForestLevel >= 5) {
    monsters = forestObjects.monsters || [];
    difficultyFor = (m) => getForestMonsterDifficulty(m.name, gameState.currentForestLevel);
  } else if (isDemonZone(loc)) {
    monsters = demonObjects.monsters || [];
    difficultyFor = (m) => getDemonDifficulty(m.name);
    extraDamage = 6;
  } else if (isSanctumZone(loc)) {
    monsters = sanctumObjects.monsters || [];
    difficultyFor = (m) => getSanctumDifficulty(m.name);
    extraDamage = 4;
  } else {
    return;
  }
  const now = Date.now();
  let nearest = null;
  let nearestDist = Infinity;
  monsters.forEach(m => {
    const d = dist(gameState.playerPos, posFromPercent(m.top, m.left));
    const range = (m.name === "대악마") ? AGGRO_RANGE : COLLISION_RANGE;
    if (d <= range && d < nearestDist) {
      nearest = m;
      nearestDist = d;
    }
  });
  const cooldown = (nearest && nearest.name === "대악마") ? AGGRO_COOLDOWN_MS / 2 : AGGRO_COOLDOWN_MS; // 대악마 공격속도 2배
  if (!nearest || now - (nearest.lastAggroAt || 0) < cooldown) return;
  nearest.lastAggroAt = now;
  const el = document.querySelector(`[data-obj-id="${nearest.id}"]`);
  if (el) {
    el.classList.add("action-attack");
    setTimeout(() => el.classList.remove("action-attack"), 320);
  }
  if (tryEvadeAttack(nearest.name, isDemonZone(loc))) { render(); saveGame(); return; }
  const mod = combatTierMod(loc);
  ensureMonsterCombatState(nearest, isDemonZone(loc) ? "demon" : isSanctumZone(loc) ? "sanctum" : "forest", gameState.currentForestLevel);
    const damage = rollMonsterDamage(nearest, mod, nearest.name === "대악마" ? 0 : extraDamage);
  const escaped = takeDamage(damage, nearest.name);
  if (!escaped) showMessage(`${nearest.name}의 ${nearest.name === "대악마" ? "원거리 공격" : "공격"}!\n${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
  render();
  saveGame();
}

function startWanderLoop() {
  if (wanderTimer) clearInterval(wanderTimer);
  wanderTimer = setInterval(() => {
    if (!gameState || $("#modal").classList.contains("open")) return;
    const loc = locations[gameState.currentLocation];
    if (!loc) return;
    if (loc.type === "village") {
      wanderObjects(villageNpcState, 2, 2);
      wanderObjects(villageResidentsState, 3, 2);
      if (villageDogState) wanderObjects([villageDogState], 3, 2);
    }
    else if (loc.type === "heaven") wanderObjects(heavenNpcState, 2, 2);
    else if (loc.type === "sanctum") chaseAggroObjects(sanctumObjects.monsters, 4, 3);
    else if (loc.type === "forest" && gameState.currentForestLevel >= 5) chaseAggroObjects(forestObjects.monsters);
    else if (loc.type === "forest") wanderObjects(forestObjects.monsters);
    else if (loc.type === "demonWorld") chaseAggroObjects(demonObjects.monsters, 5, 4);
    else if (loc.type === "demonRoom") chaseAggroObjects(demonObjects.monsters, 5, 4);
  }, 1400);
}

function syncMovingObject(o) {
  const el = document.querySelector(`[data-obj-id="${o.id}"]`);
  if (el) { el.style.left = o.left; el.style.top = o.top; }
  const wo = worldObjects.find(w => w.el.dataset.objId === o.id);
  if (wo) wo.pos = posFromPercent(o.top, o.left);
}

function wanderObjects(list, stepX = 4, stepY = 3) {
  if (!list || list.length === 0) return;
  list.forEach(o => {
    if (Math.random() > .65) return;
    const next = clampPos({
      x: parseFloat(o.left) + rand(-stepX, stepX),
      y: parseFloat(o.top) + rand(-stepY, stepY)
    });
    o.left = next.x + "%";
    o.top = next.y + "%";
    syncMovingObject(o);
  });
  updateNearbyInteraction();
  renderMiniMap();
}

function chaseAggroObjects(list, stepX = 4, stepY = 3) {
  if (!list || list.length === 0 || !gameState.playerPos) return;
  list.forEach(o => {
    const pos = posFromPercent(o.top, o.left);
    const d = dist(pos, gameState.playerPos);
    if (d <= 28) {
      const len = d || 1;
      const next = clampPos({
        x: pos.x + ((gameState.playerPos.x - pos.x) / len) * stepX,
        y: pos.y + ((gameState.playerPos.y - pos.y) / len) * stepY
      });
      o.left = next.x + "%";
      o.top = next.y + "%";
      syncMovingObject(o);
    } else if (Math.random() < .35) {
      const next = clampPos({ x: pos.x + rand(-stepX, stepX), y: pos.y + rand(-stepY, stepY) });
      o.left = next.x + "%";
      o.top = next.y + "%";
      syncMovingObject(o);
    }
  });
  updateNearbyInteraction();
  renderMiniMap();
}

function makePortal(area, target, label, cls, top, left) {

/* 현재 지역의 포털 일괄 배치 (스펙 함수명) */
function portalLayout(locKey) {
  const loc = locations[locKey];
  if (!loc) return [];
  if (loc.type === "village") return [
    { target: "forest1", label: "위!아주숲", cls: "", top: "50%", left: "0%" },
    { target: "forest6", label: "깊은숲", cls: "", top: "50%", left: "100%" },
    { target: "heaven", label: "천계", cls: "p-heaven", top: "0%", left: "50%" },
    { target: "demonWorld", label: "마계", cls: "p-demon", top: "100%", left: "50%" }
  ];
  if (loc.type === "heaven") return [
    { target: "village", label: "위!아주마을", cls: "p-heaven", top: "82%", left: "8%" }
  ];
  if (loc.type === "sanctum") return [{ target: "heaven", label: "천계", cls: "p-heaven", top: "84%", left: "8%" }];
  if (loc.type === "demonWorld") return [{ target: "village", label: "위!아주마을", cls: "p-demon", top: "82%", left: "8%" }];
  if (loc.type === "demonRoom") return [{ target: "demonWorld", label: "마계", cls: "p-demon", top: "84%", left: "8%" }];
  const out = [];
  const isChainStart = (loc.level === 1 || loc.level === 6);
  if (loc.type === "forest" && !isChainStart) out.push({ target: "forest" + (loc.level - 1), label: "이전 숲", cls: "", top: "84%", left: "12%" });
  if (loc.type === "forest" && isChainStart) out.push({ target: "village", label: "위!아주마을", cls: "", top: "84%", left: "6%" });
  if (loc.type === "forest" && loc.level !== 5 && loc.level !== 10) out.push({ target: "forest" + (loc.level + 1), label: "다음 숲", cls: "", top: "16%", left: "88%" });
  return out;
}

function frontOfPortal(pos) {
  let dx = 50 - pos.x, dy = 50 - pos.y;
  const len = Math.hypot(dx, dy) || 1;
  return clampPos({ x: pos.x + (dx / len) * 16, y: pos.y + (dy / len) * 16 });
}

/* 도착 지역에서 출발지로 되돌아가는 포털 앞 위치 */
function returnPortalPos(destKey, fromKey) {
  const layout = portalLayout(destKey);
  let p = layout.find(x => x.target === fromKey);
  if (!p && /^forest\d+$/.test(fromKey)) p = layout.find(x => x.target === "forest");
  if (!p) return null;
  return frontOfPortal(posFromPercent(p.top, p.left));
}

function renderPortals(area) {
  portalLayout(gameState.currentLocation).forEach(p => makePortal(area, p.target, p.label, p.cls, p.top, p.left));
}

function spawnForestObjects(forestLevel) {

function spawnGatherable(forestLevel) {

}
function getRandomForestItem(forestLevel) { const d = forestData[forestLevel]; return weightedPick(d.items, d.weights); }

function getGatherAmountByForestLevel(forestLevel) {
  if (forestLevel <= 3) return 1;
  if (forestLevel <= 6) return rand(1, 2);
  if (forestLevel <= 9) return rand(1, 3);
  return rand(2, 4);
}

function collectGatherable(objectId) {
  const idx = forestObjects.gatherables.findIndex(g => g.id === objectId);
  if (idx === -1) return;
  const g = forestObjects.gatherables[idx];
  const amount = getGatherAmountByForestLevel(gameState.currentForestLevel);
  addItemToInventory(g.name, amount);
  forestObjects.gatherables.splice(idx, 1);
  animatePlayerAction("pick", g);
  showMessage(`${g.name} ${amount}개 획득!`);
  renderForestObjects();
  saveGame();
  scheduleRespawn("gatherable", gameState.currentForestLevel);
}

function updatePetAutoGather() {
  if (getPetLevel() < 2) return;
  const loc = locations[gameState.currentLocation];
  if (!loc || loc.type !== "forest" || !gameState.playerPos) return;
  const now = Date.now();
  if (now - lastPetAutoGatherAt < 700) return;
  const target = (forestObjects.gatherables || []).find(g => dist(gameState.playerPos, posFromPercent(g.top, g.left)) <= 6.5);
  if (!target) return;
  lastPetAutoGatherAt = now;
  collectGatherable(target.id);
}

function updatePetAutoPotion(now = Date.now()) {
  if (getPetLevel() < 3) return;
  if (!gameState.maxHp || gameState.hp / gameState.maxHp > 0.2) return;
  if (now - lastPetAutoPotionAt < 3000) return;
  const potion = getBestPotionOwned();
  if (!potion) return;
  lastPetAutoPotionAt = now;
  useItem(potion, false);
  showWorldBanner("수호 펫", `${getPetItemName()}이 위험을 감지해 ${potion}을 자동 사용했습니다.`);
}

function getMonsterRewardByForestLevel(forestLevel) {
  // 골드 또는 해당 단계 재료 1개 (50% 확률) — 골드는 ×100 적용
  let goldRange;
  if (forestLevel <= 3) goldRange = [1000, 5000];
  else if (forestLevel <= 6) goldRange = [5000, 20000];
  else if (forestLevel <= 9) goldRange = [20000, 100000];
  else goldRange = [100000, 500000];
  if (Math.random() < 0.5) {
    let gold = rand(goldRange[0], goldRange[1]);
    if (forestLevel <= 5) gold = Math.round(gold * 0.5); // 위!아주숲(1~5)은 절반, 깊은숲(6~10)은 유지
    return { type: "gold", gold: gold };
  }
  return { type: "item", item: getRandomForestItem(forestLevel) };
}

function hasItem(name) {
  return !!(gameState.inventory && gameState.inventory[name]);
}

  "숲 정령": { hp: 165, atk: 22 },
  "고대 멧돼지": { hp: 190, atk: 25 },
  "숲의 수호자": { hp: 230, atk: 28 },
  "성역 파수꾼": { hp: 380, atk: 34 },
  "빛의 기사": { hp: 460, atk: 38 },

  "지옥의 파수견": { hp: 340, atk: 34 },
  "대악마": { hp: 1800, atk: 48 }
};

function getMonsterCombatStats(name, zone = "forest", forestLevel = 1) {
  const base = MONSTER_COMBAT[name] || { hp: zone === "demon" ? 260 : zone === "sanctum" ? 420 : 80, atk: zone === "demon" ? 28 : zone === "sanctum" ? 36 : 14 };
  let hp = base.hp, atk = base.atk;
  if (zone === "forest") {
    if (forestLevel <= 3) { hp = Math.round(hp * 0.86); atk = Math.round(atk * 0.8); }
    else if (forestLevel >= 8) { hp = Math.round(hp * 1.08); atk = Math.round(atk * 1.08); }
    else if (forestLevel >= 6) { hp = Math.round(hp * 0.72); } // L6~7: HP만 완화(타격 1회↓), 적 공격력은 유지
  }
  return { hp, atk };
}

function initMonsterCombatState(monster, zone = "forest", forestLevel = 1) {
  const stats = getMonsterCombatStats(monster.name, zone, forestLevel);
  monster.maxHp = stats.hp;
  monster.hp = typeof monster.hp === "number" && monster.hp > 0 ? Math.min(monster.hp, monster.maxHp) : monster.maxHp;
  monster.atk = stats.atk;
  return monster;
}

function ensureMonsterCombatState(monster, zone = "forest", forestLevel = 1) {
  if (!monster) return null;
  const stats = getMonsterCombatStats(monster.name, zone, forestLevel);
  if (typeof monster.maxHp !== "number" || monster.maxHp <= 0) monster.maxHp = stats.hp;
  if (typeof monster.hp !== "number" || monster.hp <= 0) monster.hp = monster.maxHp;
  if (typeof monster.atk !== "number" || monster.atk <= 0) monster.atk = stats.atk;
  return monster;
}

function monsterHpBar(monster, zone = "forest", forestLevel = 1) {
  ensureMonsterCombatState(monster, zone, forestLevel);
  const pct = Math.max(0, Math.min(100, (monster.hp / monster.maxHp) * 100));
  return `<div class="player-hpbar"><span style="width:${pct}%"></span></div>`;
}

const WEAPON_ORDER = ["나무검", "강철검", "마검", "신성검"];
const ARMOR_ORDER = ["가죽갑옷", "단단한 갑옷", "마계갑옷", "신성갑옷"];

function getBestOwnedEquipment(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    if (hasItem(list[i])) return list[i];
  }
  return "";
}

function getEquippedWeaponItem() {
  if (gameState.equippedWeapon === "") return "";
  if (gameState.equippedWeapon && hasItem(gameState.equippedWeapon)) return gameState.equippedWeapon;
  return getBestOwnedEquipment(WEAPON_ORDER);
}

function getEquippedArmorItem() {
  if (gameState.equippedArmor === "") return "";
  if (gameState.equippedArmor && hasItem(gameState.equippedArmor)) return gameState.equippedArmor;
  return getBestOwnedEquipment(ARMOR_ORDER);
}

function getWeaponTier() {
  const name = getEquippedWeaponItem();
  if (name === "신성검") return 4;
  if (name === "마검") return 3;
  if (name === "강철검") return 2;
  if (name === "나무검") return 1;
  return 0;
}

function getArmorTier() {
  const name = getEquippedArmorItem();
  if (name === "신성갑옷") return 4;
  if (name === "마계갑옷") return 3;
  if (name === "단단한 갑옷") return 2;
  if (name === "가죽갑옷") return 1;
  return 0;
}

function getEquippedWeaponName() {
  return ["맨손", "나무검", "강철검", "마검", "신성검"][getWeaponTier()];
}

function getEquippedArmorName() {
  return ["평상복", "가죽갑옷", "단단한 갑옷", "마계갑옷", "신성갑옷"][getArmorTier()];
}

function getWeaponAttackBonus() {
  return [0, 16, 38, 72, 128][getWeaponTier()];
}

function getArmorHpBonus() {
  return [0, 50, 130, 240, 460][getArmorTier()];
}

function getPlayerMaxHp() {
  return defaultGameState.maxHp + getArmorHpBonus();
}

function getWeaponHitBonus() {
  return [0, 0.10, 0.18, 0.30, 0.65][getWeaponTier()];
}

function getArmorEvasion() {
  return 0.03;
}

function hasDivineWeapon() { return getEquippedWeaponItem() === "신성검"; }
function hasDivineArmor() { return getEquippedArmorItem() === "신성갑옷"; }

function getPlayerPower() {
  let power = 12 + (gameState.globalShopLevel || 1) * 4;
  power += [0, 10, 28, 55, 120][getWeaponTier()];
  power += [0, 8, 22, 45, 98][getArmorTier()];
  if (hasItem("회복 시약")) power += 5;
  if (hasItem("베리 샐러드")) power += 4;
  if (hasItem("고기 스튜")) power += 12;
  if (hasItem("천상의 만찬")) power += 30;
  if (gameState.job === "무기상인") power += 6;
  if (gameState.job === "방어구상인") power += 5;
  if (gameState.job === "연금술사") power += 5;
  if (gameState.job === "요리사") power += 4;
  return power;
}

function getPlayerAttack() {
  let atk = 8 + (gameState.globalShopLevel || 1) * 3;
  atk += getWeaponAttackBonus();
  if (hasItem("천상의 만찬")) atk += 8;
  if (gameState.job === "무기상인") atk += 8;
  if (gameState.job === "연금술사") atk += 4;
  return atk;
}

function rollPlayerDamage() {
  return Math.max(1, Math.round(getPlayerAttack() * rand(85, 115) / 100));
}

function rollMonsterDamage(monster, mod = { dmgMult: 1 }, extra = 0) {
  ensureMonsterCombatState(monster, "demon");
  const raw = Math.max(1, Math.round((monster.atk + extra) * rand(88, 112) / 100));
  let dmg = Math.max(1, Math.round(raw * (mod.dmgMult || 1)));
  if (monster && monster.name === "대악마" && isDemonBlessingActive()) dmg = Math.max(1, Math.round(dmg * 0.8)); // 대천사 축복: 대악마 피해 20%↓
  return dmg;
}

  return high ? rand(8, 18) : rand(4, 12);

function getForestMonsterDifficulty(monsterName, forestLevel) {
  const monsterOrder = ["토끼", "숲쥐", "슬라임", "버섯몬", "멧돼지", "숲 늑대", "독버섯몬", "숲 정령", "고대 멧돼지", "숲의 수호자"];
  const rank = Math.max(0, monsterOrder.indexOf(monsterName));
  return 8 + forestLevel * 9 + rank * 4;
}

/* 지역별 요구 장비 단계 게이팅
   - ok=false: 사냥 불가(공격 성공률 0%)
   - atkMult: 승률 배수(한 단계 부족 시 0.5)
   - dmgMult: 피격 데미지 배수(숲10 한 단계 부족/마계 신성 미착용 시 2)
   - req: 요구 무기 단계(숲=0~3, 마계=4) */
function requiredTier(loc) {
  if (!loc) return 0;
  if (isDemonZone(loc)) return 4;
  if (loc.type === "forest") return loc.level === 1 ? 0 : loc.level <= 4 ? 1 : loc.level <= 7 ? 2 : 3;
  return 0;
}
function combatTierMod(loc) {
  const wt = getWeaponTier();
  const req = requiredTier(loc);
  if (isDemonZone(loc)) {
    if (wt >= 4) return { ok: true, atkMult: 1, dmgMult: 1, req, reqName: "신성 장비" };
    return { ok: false, atkMult: 0, dmgMult: 2, req, reqName: "신성 장비" };
  }
  if (loc && loc.type === "forest") {
    const reqName = ["맨손", "1단계 장비", "2단계 장비", "3단계 장비"][req];
    const extra2x = loc.level === 10 ? 2 : 1;
    if (wt >= req) return { ok: true, atkMult: 1, dmgMult: 1, req, reqName };
    if (wt === req - 1) return { ok: true, atkMult: 0.5, dmgMult: extra2x, req, reqName };
    return { ok: false, atkMult: 0, dmgMult: extra2x, req, reqName };
  }
  return { ok: true, atkMult: 1, dmgMult: 1, req, reqName: "" };
}
/* 요구 단계 충족=기본 85% (상위 장비 보너스, 같은 지역 강몬스터 보정, 한 단계 부족 시 절반) */
function getHuntWinChance(loc, monsterName) {
  const mod = combatTierMod(loc);
  if (!mod.ok) return 0;
  const wt = getWeaponTier();
  let base = 0.85 + Math.max(0, wt - mod.req) * 0.05;
  if (loc.type === "forest") {
    const arr = forestData[loc.level].monsters;
    base -= Math.max(0, arr.indexOf(monsterName)) * 0.06;
  } else if (isDemonZone(loc)) {
    const order = ["하급 악마", "불꽃 악령", "검은 기사", "지옥의 파수견", "대악마"];
    base -= Math.max(0, order.indexOf(monsterName)) * 0.05;
  }
  return Math.max(0, Math.min(0.96, base * mod.atkMult));
}

function tryEvadeAttack(sourceName, requiresDivineArmor = false) {
  if (requiresDivineArmor && !hasDivineArmor()) {
    showMessage(`${sourceName}의 마계 공격!\n신성갑옷이 없어 회피할 수 없습니다.`);
    return false;
  }
  const evasion = getArmorEvasion();
  if (Math.random() < evasion) {
    showMessage(`${sourceName}의 공격을 회피했습니다!\n방어구 회피율 ${Math.round(evasion * 100)}%`);
    return true;
  }
  return false;
}

function takeDamage(amount, sourceName) {
  if (remoteStorageInvincible) return true;
  gameState.hp = Math.max(0, gameState.hp - amount);
  if (gameState.hp <= 0) {
    if ((gameState.inventory["보호 주문서"] || 0) > 0) {
      removeItemFromInventory("보호 주문서", 1);
      gameState.hp = 1;
      gameState.vitality = 1;
      gameState.lastVitalityTick = Date.now();
      gameState.lastStarveTick = Date.now();
      pendingPlayerPos = homeFrontPos();
      showWorldBanner("보호 주문서 발동", `${gameState.playerName || "플레이어"}님이 보호 주문서 효과로 아이템과 골드를 잃지 않았습니다.`);
      showMessage(`${sourceName} 때문에 쓰러질 뻔했습니다.\n보호 주문서가 빛나며 골드와 아이템 손실을 막았습니다.\n보호 주문서 1개 소모`);
      changeLocation("village");
      saveGame();
      return true;
    }
    const lostGold = gameState.gold;
    gameState.gold = 0;
    gameState.hp = 1;
    gameState.vitality = 1;
    gameState.lastVitalityTick = Date.now();
    gameState.lastStarveTick = Date.now();
    const lossCount = rand(0, 2);
    const lostItems = [];
    for (let i = 0; i < lossCount; i++) {
      const keys = Object.keys(gameState.inventory).filter(k => gameState.inventory[k] > 0);
      if (!keys.length) break;
      const k = keys[Math.floor(Math.random() * keys.length)];
      gameState.inventory[k] -= 1;
      if (gameState.inventory[k] <= 0) delete gameState.inventory[k];
      lostItems.push(k);
    }
    const lostMsg = lostItems.length ? `\n분실한 아이템: ${lostItems.join(", ")}` : "";
    pendingPlayerPos = homeFrontPos();
    showMessage(`${sourceName} 때문에 쓰러질 뻔했습니다.\n나의 집 앞에서 겨우 깨어났지만 ${fmt(lostGold)}골드를 모두 잃었습니다.${lostMsg}\n빨리 음식이나 회복약을 먹어야 합니다!`);
    changeLocation("village");
    saveGame();
    return true;
  }
  return false;
}

function defeatMonster(monsterId) {
  const idx = forestObjects.monsters.findIndex(m => m.id === monsterId);
  if (idx === -1) return;
  const m = forestObjects.monsters[idx];
  ensureMonsterCombatState(m, "forest", gameState.currentForestLevel);
  const loc = locations[gameState.currentLocation];
  const difficulty = getForestMonsterDifficulty(m.name, gameState.currentForestLevel);
  const mod = combatTierMod(loc);
  animatePlayerAction("attack", m);
  if (!mod.ok) {
    const damage = rollMonsterDamage(m, mod);
    if (tryEvadeAttack(m.name)) { render(); saveGame(); return; }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}: ${mod.reqName}가 있어야 사냥할 수 있습니다.\n반격 ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render(); saveGame();
    return;
  }
  const chance = getHuntWinChance(loc, m.name);
  if (Math.random() > chance) {
    const damage = rollMonsterDamage(m, mod);
    if (tryEvadeAttack(m.name)) { render(); saveGame(); return; }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}의 공격을 피하지 못했습니다.\n명중률 ${Math.round(chance * 100)}% · ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render(); saveGame();
    return;
  }
  const hit = rollPlayerDamage();
  m.hp = Math.max(0, m.hp - hit);
  updateMonsterHpBar(m, "forest", gameState.currentForestLevel);
  if (m.hp > 0) {
    const damage = rollMonsterDamage(m, mod);
    if (tryEvadeAttack(m.name)) {
      showMessage(`${m.name}에게 ${hit} 피해!\n몬스터 HP ${m.hp}/${m.maxHp}\n반격을 회피했습니다.`);
      render(); saveGame();
      return;
    }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}에게 ${hit} 피해!\n몬스터 HP ${m.hp}/${m.maxHp}\n반격 ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render(); saveGame();
    return;
  }
  const reward = getMonsterRewardByForestLevel(gameState.currentForestLevel);
  let rewardText;
  if (reward.type === "gold") { gameState.gold += reward.gold; rewardText = `${fmt(reward.gold)}골드 획득`; }
  else { addItemToInventory(reward.item, 1); rewardText = `${reward.item} 1개 획득`; }
  // 추가 드랍: 단계별 회복약 15% · 귀환주문서 5% · 이상한 알 5%
  const lv = gameState.currentForestLevel;
  const potion = lv <= 3 ? "회복약 소" : (lv <= 7 ? "회복약 중" : "회복약 대");
  const extras = [];
  if (Math.random() < 0.15) { addItemToInventory(potion, 1); extras.push(potion); }
  if (Math.random() < 0.05) { addItemToInventory("귀환주문서", 1); extras.push("귀환주문서"); }
  if (Math.random() < 0.05) { addItemToInventory("이상한 알", 1); extras.push("이상한 알"); }
  let msg = `${m.name} 처치!\n마지막 피해 ${hit} · ${rewardText}`;
  if (extras.length) msg += `\n추가 획득: ${extras.join(", ")}`;
  showMessage(msg);
  forestObjects.monsters.splice(idx, 1);
  renderForestObjects();
  render(); saveGame();
  scheduleRespawn("monster", gameState.currentForestLevel);
}

function scheduleRespawn(type, forestLevel) {
  setTimeout(() => {
    // 숲을 떠났거나 단계가 바뀌면 리스폰 취소
    if (locations[gameState.currentLocation].type !== "forest" || gameState.currentForestLevel !== forestLevel) return;
    if (type === "gatherable" && forestObjects.gatherables.length < MAX_GATHER) {
      forestObjects.gatherables.push(spawnGatherable(forestLevel));
    } else if (type === "monster" && forestObjects.monsters.length < MAX_MONSTER) {
      forestObjects.monsters.push(spawnMonster(forestLevel));
    }
    renderForestObjects();
  }, RESPAWN_MS);
}

function showHolyCraftDialog() {
  const body = holyRecipeList().map(r => {

function holyCraft(name) {
  const r = holyRecipeList().find(x => x.name === name);
  if (!r) return;
  if (hasItem(name)) { showMessage("이미 보유한 신성 장비입니다."); return; }

  addItemToInventory(name, 1);
  showMessage(`${name} 제작에 성공했습니다.`);
  render(); saveGame();
  showHolyCraftDialog();
}

function archangelBlessingRow() {
  const costStr = Object.keys(DEMON_BLESSING_COST)
    .map(m => `${m} ${DEMON_BLESSING_COST[m]}개(보유 ${gameState.inventory[m] || 0})`).join(", ");
  const active = isDemonBlessingActive();
  const enough = Object.keys(DEMON_BLESSING_COST).every(m => (gameState.inventory[m] || 0) >= DEMON_BLESSING_COST[m]);
  const can = !active && enough;
  let label = active ? `유지 중 (${Math.ceil(demonBlessingRemainMs() / 60000)}분)` : "축복 받기";

function grantDemonBlessing() {
  if (isDemonBlessingActive()) { showMessage("이미 대천사의 축복이 깃들어 있습니다."); return; }
  const lack = Object.keys(DEMON_BLESSING_COST).some(m => (gameState.inventory[m] || 0) < DEMON_BLESSING_COST[m]);
  if (lack) { showMessage("축복에 바칠 마계 재료가 부족합니다."); return; }
  for (const m in DEMON_BLESSING_COST) removeItemFromInventory(m, DEMON_BLESSING_COST[m]);
  demonBlessingUntil = Date.now() + DEMON_BLESSING_MS;
  showWorldBanner("대천사의 축복", "10분간 대악마에게 받는 피해가 20% 감소합니다.");
  showMessage("대천사: 이 빛이 그대를 어둠으로부터 지켜주리라.\n10분간 대악마 피해 20% 감소");
  render(); saveGame();
  showArchangelDialog();
}

function craftDemonKey() {
  if (hasItem("대악마의방 열쇠") || gameState.demonRoomUnlocked) { showMessage("이미 대악마의 방을 열 수 있습니다."); return; }
  if (!hasDivineWeapon() || !hasDivineArmor()) {
    showMessage(pick([
      "그 정도 준비로 마계에 가면 위험할 수 있다네…",
      "아직 마계에 갈 준비가 되지 않았다…",
      "신성한 가호가 옅구나. 더 단련하고 오라.",
      "그대의 무장으로는 어둠을 견디지 못할 것이다…"
    ]));
    return;
  }
  const have = gameState.inventory["대악마의방 열쇠조각"] || 0;
  if (have < DEMON_KEY_FRAGMENTS) { showMessage("아직 모아 온 조각이 부족하구나…"); return; }
  removeItemFromInventory("대악마의방 열쇠조각", DEMON_KEY_FRAGMENTS);
  addItemToInventory("대악마의방 열쇠", 1);
  showMessage("대천사가 대악마의방 열쇠를 제작해 주었습니다!");
  render(); saveGame();
  showArchangelDialog();
}

function spawnDemonObjects() {
  demonObjects = { rewards: [], monsters: [] };
  const rewardCount = rand(1, 2);
  const monsterCount = rand(4, 7) * 4;
  for (let i = 0; i < rewardCount; i++) {
    const roll = Math.random() * 100;
    let acc = 0, got = null;
    for (const r of demonRewards) {
      acc += r.chance;
      if (roll < acc) { got = r.name; break; }
    }
    if (got) demonObjects.rewards.push({ id: "d" + (objSeq++), name: got, top: rand(18, 84) + "%", left: rand(8, 92) + "%" });
  }
  const demonMons = ["하급 악마", "불꽃 악령", "검은 기사", "지옥의 파수견"];
  for (let i = 0; i < monsterCount; i++) {
    demonObjects.monsters.push(initMonsterCombatState({ id: "dm" + (objSeq++), name: pick(demonMons), top: rand(18, 82) + "%", left: rand(8, 92) + "%" }, "demon"));
  }
}

  const idx = demonObjects.rewards.findIndex(r => r.id === rewardId);

  addItemToInventory(r.name, 1);
  demonObjects.rewards.splice(idx, 1);
  animatePlayerAction("pick", r);
  const el = document.querySelector(`[data-obj-id="${rewardId}"]`);
  if (el) el.remove();
  worldObjects = worldObjects.filter(o => o.el.dataset.objId !== rewardId);
  showMessage(`${r.name} 1개 획득!\n판매가 ${fmt(items[r.name].price)}골드`);

  render(); saveGame();
  scheduleDemonRewardRespawn();

/* 마계 보상 리스폰: 숲(3초)의 5배인 15초 주기, 최대 2개까지 */
const DEMON_REWARD_RESPAWN_MS = RESPAWN_MS * 5;
const MAX_DEMON_REWARD = 2;
function spawnOneDemonRewardEl(r) {
  const area = $("#world-layer");
  if (!area) return;
  const el = document.createElement("div");
  el.className = "obj d-obj";
  el.dataset.objId = r.id;
  el.style.top = r.top; el.style.left = r.left;
  el.innerHTML = `<div class="gather-ic">${itemIcon(r.name)}</div><div class="label">${r.name}</div>`;
  area.appendChild(el);
  registerWorldObject(el, {
    pos: posFromPercent(r.top, r.left),
    radius: 7,
    label: r.name + " 획득",
    action: () => collectDemonReward(r.id)
  });
}
function scheduleDemonRewardRespawn() {
  setTimeout(() => {
    if (!locations[gameState.currentLocation] || locations[gameState.currentLocation].type !== "demonWorld") return;
    if (demonObjects.rewards.length >= MAX_DEMON_REWARD) return;
    const roll = Math.random() * 100;
    let acc = 0, got = null;
    for (const dr of demonRewards) { acc += dr.chance; if (roll < acc) { got = dr.name; break; } }
    if (!got) return;
    const r = { id: "d" + (objSeq++), name: got, top: rand(18, 84) + "%", left: rand(8, 92) + "%" };
    demonObjects.rewards.push(r);
    spawnOneDemonRewardEl(r);
    updateNearbyInteraction();
  }, DEMON_REWARD_RESPAWN_MS);
}

function getDemonDifficulty(name) {
  const table = { "하급 악마": 70, "불꽃 악령": 88, "검은 기사": 105, "지옥의 파수견": 118, "대악마": 165 };
  return table[name] || 90;
}

function fightDemonMonster(monsterId) {
  const idx = demonObjects.monsters.findIndex(m => m.id === monsterId);
  if (idx === -1) return;
  const m = demonObjects.monsters[idx];
  ensureMonsterCombatState(m, "demon");
  const loc = locations[gameState.currentLocation];
  const difficulty = getDemonDifficulty(m.name);
  const mod = combatTierMod(loc);
  animatePlayerAction("attack", m);
  if (!hasDivineWeapon() || !hasDivineArmor()) {
    showMessage(`${m.name}: 신성검과 신성갑옷을 모두 갖춰야 마계 몬스터에게 도전할 수 있습니다.`);
    render(); saveGame();
    return;
  }
  if (!mod.ok) {
    const damage = rollMonsterDamage(m, mod, demonCounterExtra(m.name, true));
    if (tryEvadeAttack(m.name, true)) { render(); saveGame(); return; }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}: 신성 장비가 없으면 사냥할 수 없습니다.\n피격 데미지 2배 · 반격 ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render();
    saveGame();
    return;
  }
  const chance = getHuntWinChance(loc, m.name);
  if (Math.random() > chance) {
    const damage = rollMonsterDamage(m, mod, demonCounterExtra(m.name));
    if (tryEvadeAttack(m.name, true)) { render(); saveGame(); return; }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}의 마계 공격!\n명중률 ${Math.round(chance * 100)}% · ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render(); saveGame();
    return;
  }
  const hit = rollPlayerDamage();
  m.hp = Math.max(0, m.hp - hit);
  updateMonsterHpBar(m, "demon");
  if (m.hp > 0) {
    const damage = rollMonsterDamage(m, mod, demonCounterExtra(m.name));
    if (tryEvadeAttack(m.name, true)) {
      showMessage(`${m.name}에게 ${hit} 피해!\n몬스터 HP ${m.hp}/${m.maxHp}\n반격을 회피했습니다.`);
      render(); saveGame();
      return;
    }
    const escaped = takeDamage(damage, m.name);
    if (!escaped) showMessage(`${m.name}에게 ${hit} 피해!\n몬스터 HP ${m.hp}/${m.maxHp}\n반격 ${damage} 피해 · HP ${gameState.hp}/${gameState.maxHp}`);
    render(); saveGame();
    return;
  }
  let rewardName = "마계의 조각";
  if (m.name === "불꽃 악령") rewardName = Math.random() < 0.35 ? "지옥의 핵" : "악마의 뿔";
  else if (m.name === "검은 기사") rewardName = Math.random() < 0.3 ? "검은 보석" : "악마의 뿔";
  else if (m.name === "지옥의 파수견") rewardName = Math.random() < 0.25 ? "지옥의 핵" : "검은 보석";
  else if (m.name === "대악마") rewardName = Math.random() < 0.0001 ? "대악마의 심장" : "지옥의 핵";
  addItemToInventory(rewardName, 1);
  const frag = rand(1, 3);
  addItemToInventory("대악마의방 열쇠조각", frag);
  demonObjects.monsters.splice(idx, 1);
  const el = document.querySelector(`[data-obj-id="${monsterId}"]`);
  if (el) el.remove();
  worldObjects = worldObjects.filter(o => o.el.dataset.objId !== monsterId);
  showMessage(`${m.name} 처치!\n마지막 피해 ${hit} · ${rewardName} 1개 · 열쇠조각 ${frag}개`);
  updateNearbyInteraction();
  render(); saveGame();
}

function enterDemonRoom() {

/* ============================================================
   인벤토리
============================================================ */
function addItemToInventory(itemName, amount) {
  gameState.inventory[itemName] = (gameState.inventory[itemName] || 0) + amount;
}
function removeItemFromInventory(itemName, amount) {
  if (!gameState.inventory[itemName]) return false;
  gameState.inventory[itemName] -= amount;
  if (gameState.inventory[itemName] <= 0) delete gameState.inventory[itemName];
  return true;
}

function migrateItemName(oldName, newName) {
  [gameState.inventory, gameState.storage].forEach(box => {
    if (!box || !box[oldName]) return;
    box[newName] = (box[newName] || 0) + box[oldName];
    delete box[oldName];
  });
}

function openInventory() {
  const inv = gameState.inventory;
  const keys = Object.keys(inv);
  let body = "";
  if (keys.length === 0) { body = `<div class="empty-msg">보유 아이템이 없습니다.</div>`; }
  else {
    keys.forEach(name => {
      const it = items[name] || { price: 0, type: "material", color: "#888" };
      const sell = calculateSellPrice(name, null);
      const bonus = (it.type === "material" && gameState.job === "잡화상인") ? ` <small>(보너스 적용 ${fmt(sell)})</small>` : "";
      const useBtn = it.type === "consumable" ? `<button data-use="${name}">사용</button>` : "";
      const priceText = isUntradable(name) ? "판매 불가" : `기본 판매가 ${fmt(it.price)}${bonus}`;
      body += `<div class="list-row">
        ${itemIcon(name)}
        <div class="info">${name} x${inv[name]}<br><small>분류: ${it.type === "material" ? "재료" : it.type === "crafted" ? "제작" : it.type === "consumable" ? "소모품" : it.type === "pet" ? "펫" : "목표"} · ${priceText}</small></div>
        ${useBtn}
      </div>`;
    });
  }
  openModal("인벤토리", body, [{ label: "닫기", cls: "btn-sub", onClick: closeModal }]);
  $("#modal-body").querySelectorAll("[data-use]").forEach(b => b.onclick = () => useItem(b.dataset.use));
}

function useItem(itemName, reopenInventory = true) {
  const it = items[itemName];
  if (!it || it.type !== "consumable") return;
  if (!gameState.inventory[itemName]) return;
  if (it.returnHome) {
    removeItemFromInventory(itemName, 1);
    pendingPlayerPos = homeFrontPos();
    changeLocation("village");
    animatePlayerAction("pick");
    showMessage("귀환주문서를 사용했습니다.\n나의 집 앞으로 귀환했습니다.");
    render();
    saveGame();
    if (reopenInventory) openInventory();
    else updateReturnQuickSlot();
    return;
  }
  if (it.remoteStorage) {
    removeItemFromInventory(itemName, 1);
    clearTimeout(remoteStorageInvincibleTimer);
    remoteStorageInvincible = true;
    animatePlayerAction("pick");
    showMessage("원격보관 주문서를 사용했습니다.\n보관소가 열려 있는 동안 무적 상태가 됩니다.");
    render();
    saveGame();
    showHomeDialog("storage");
    return;
  }
  const isFood = FOOD_ITEMS.indexOf(itemName) !== -1;
  if (isFood && gameState.vitality >= gameState.maxVitality) {
    showMessage("이미 활력이 가득 찼습니다.");
    return;
  }
  if (!isFood && gameState.hp >= gameState.maxHp) {
    showMessage("이미 체력이 가득 찼습니다.");
    updatePotionQuickSlot();
    return;
  }
  removeItemFromInventory(itemName, 1);
  let msg = "";
  if (isFood) {
    const gain = Math.ceil(gameState.maxVitality * it.vitalityPct);
    gameState.vitality = Math.min(gameState.maxVitality, gameState.vitality + gain);
    gameState.lastVitalityTick = Date.now();
    gameState.lastStarveTick = Date.now();
    msg = `${itemName} 섭취\n활력 ${gain} 회복 (${gameState.vitality}/${gameState.maxVitality})`;
  } else {
    const heal = Math.ceil(gameState.maxHp * it.healPct);
    gameState.hp = Math.min(gameState.maxHp, gameState.hp + heal);
    msg = `${itemName} 사용\nHP ${heal} 회복 (${gameState.hp}/${gameState.maxHp})`;
  }
  animatePlayerAction("pick");
  showMessage(msg);
  render();
  saveGame();
  if (reopenInventory) openInventory();
  else { updatePotionQuickSlot(); updateReturnQuickSlot(); }
}

let currentShopKey = null;
let currentShopTab = "buy";

function getShopLevel() { return gameState.globalShopLevel; }

function isUntradable(name) { return name === "신성검" || name === "신성갑옷" || name === "대악마의방 열쇠" || name === "대악마의방 열쇠조각" || name === "이상한 알" || PET_ITEMS.indexOf(name) !== -1; }

function getAvailablePurchaseItems(shopKey) {
  if (shopKey === "general") return getGeneralShopPurchaseItems();
  const result = [];
  for (let lv = 1; lv <= getShopLevel(); lv++) {
    (purchaseItems[shopKey][lv] || []).forEach(n => { if (result.indexOf(n) === -1 && !isUntradable(n)) result.push(n); });
  }
  return result;
}

function getGeneralShopPurchaseItems() {
  const result = [];
  ["weapon", "armor", "magic", "food", "general"].forEach(shopKey => {
    for (let lv = 1; lv <= getShopLevel(); lv++) {
      (purchaseItems[shopKey][lv] || []).forEach(n => {
        if (result.indexOf(n) === -1 && !isUntradable(n)) result.push(n);
      });
    }
  });
  return result;
}
function getAvailableCraftItems(shopKey) {
  return craftingRecipes[shopKey].filter(r => r.level <= getShopLevel() && !isUntradable(r.name));
}
function canCraftInShop(shopKey) {
  return jobs[gameState.job].craft && jobs[gameState.job].shop === shopKey;
}

function openShop(shopKey) {
  currentShopKey = shopKey;
  currentShopTab = canCraftInShop(shopKey) ? "craft" : "buy";  // 고유 상점은 제작 탭 우선
  renderShop();
}

function showVaultDialog() {

}

function renderVaultContent() {
  return `
    <div style="line-height:1.9;margin-bottom:8px;">
      보유 골드: <b>${fmt(gameState.gold)}</b><br>
      금고 잔액: <b>${fmt(gameState.vaultGold || 0)}</b>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:4px;">금고의 골드는 사망 시에도 사라지지 않습니다.</div>
    </div>
    <input id="vault-amt" type="number" min="1" placeholder="금액 입력" style="width:100%;box-sizing:border-box;margin-bottom:8px;padding:9px;border:2px solid var(--frame);border-radius:10px;font-size:14px;">
    <div style="display:flex;gap:6px;">
      <button class="btn btn-main" id="vault-dep" style="flex:1;">입금</button>

    </div>`;
}

function bindVaultButtons() {
  const amt = () => Math.max(0, Math.floor(Number(($("#vault-amt") || {}).value) || 0));
  $("#vault-dep").onclick = () => vaultMove(amt(), true);
  $("#vault-wd").onclick = () => vaultMove(amt(), false);
  $("#vault-dep-all").onclick = () => vaultMove(gameState.gold, true);
  $("#vault-wd-all").onclick = () => vaultMove(gameState.vaultGold || 0, false);
}

function vaultMove(amount, deposit) {
  amount = Math.floor(amount);
  if (amount <= 0) { showMessage("금액을 올바르게 입력하세요."); return; }
  if (deposit) {
    if (amount > gameState.gold) { showMessage("보유 골드가 부족합니다."); return; }
    gameState.gold -= amount;
    gameState.vaultGold = (gameState.vaultGold || 0) + amount;
    showMessage(`${fmt(amount)}골드를 금고에 보관했습니다.`);
  } else {
    if (amount > (gameState.vaultGold || 0)) { showMessage("금고 잔액이 부족합니다."); return; }
    gameState.vaultGold -= amount;
    gameState.gold += amount;
    showMessage(`${fmt(amount)}골드를 찾았습니다.`);
  }
  render(); saveGame(); showHomeDialog("vault");
}

function getStorageKeys(source) {
  return Object.keys(source || {}).filter(name => (source[name] || 0) > 0 && items[name] && items[name].type !== "goal");
}

function renderStorageRows(source, mode) {
  const keys = getStorageKeys(source);
  if (keys.length === 0) {
    return `<div class="empty-msg">${mode === "deposit" ? "보관할 아이템이 없습니다." : "찾을 아이템이 없습니다."}</div>`;
  }
  return keys.map(name => {
    const qty = source[name] || 0;
    const actionLabel = mode === "deposit" ? "보관" : "찾기";
    return `<div class="list-row">
      ${itemIcon(name)}
      <div class="info">${name} x${qty}<br><small>${mode === "deposit" ? "가방" : "창고"} 보유 수량</small></div>
      <div class="qty-ctrl">
        <button type="button" class="qty-edge" data-storage-min="${mode}" data-item="${name}">MIN</button>
        <button type="button" data-storage-down="${mode}" data-item="${name}">−</button>
        <input data-storage-qty="${mode}" data-item="${name}" type="number" value="1" min="0" inputmode="numeric">
        <button type="button" data-storage-up="${mode}" data-item="${name}">＋</button>
        <button type="button" class="qty-edge" data-storage-max="${mode}" data-item="${name}">MAX</button>
      </div>
      <button data-storage-move="${mode}" data-item="${name}">${actionLabel}</button>
    </div>`;
  }).join("");
}

function renderStorageContent() {
  const storedCount = getStorageKeys(gameState.storage).reduce((sum, name) => sum + (gameState.storage[name] || 0), 0);
  return `<div class="shop-meta">창고 보관 수량: ${fmt(storedCount)}개 · 창고의 아이템은 사망 시에도 사라지지 않습니다.</div>
    <div class="tabs" style="margin-top:8px;">
      <button class="active" type="button">가방 → 창고</button>
    </div>
    ${renderStorageRows(gameState.inventory, "deposit")}
    <div class="tabs" style="margin-top:10px;">
      <button class="active" type="button">창고 → 가방</button>
    </div>
    ${renderStorageRows(gameState.storage, "withdraw")}`;
}

function getStorageInput(itemName, mode) {
  const body = $("#modal-body");
  if (!body) return null;
  return Array.from(body.querySelectorAll("[data-storage-qty]")).find(el => el.dataset.item === itemName && el.dataset.storageQty === mode) || null;
}

function getStorageMax(itemName, mode) {
  const source = mode === "deposit" ? gameState.inventory : gameState.storage;
  return Math.max(0, (source && source[itemName]) || 0);
}

function getStorageQty(itemName, mode) {
  const el = getStorageInput(itemName, mode);
  let qty = el ? parseInt(el.value, 10) : 0;
  if (!Number.isFinite(qty) || qty < 0) qty = 0;
  return qty;
}

function stepStorageQty(itemName, mode, delta) {
  const el = getStorageInput(itemName, mode);
  if (!el) return;
  const next = Math.max(0, getStorageQty(itemName, mode) + delta);
  el.value = next;
}

function setStorageQty(itemName, mode, qty) {
  const el = getStorageInput(itemName, mode);
  if (el) el.value = Math.max(0, qty);
}

function moveStorageItem(itemName, mode, amount) {
  amount = Math.floor(amount);
  if (amount <= 0) { showMessage("수량을 선택하세요."); return; }
  const deposit = mode === "deposit";
  const from = deposit ? gameState.inventory : gameState.storage;
  const to = deposit ? gameState.storage : gameState.inventory;
  const available = (from && from[itemName]) || 0;
  if (available <= 0) { showMessage("옮길 아이템이 없습니다."); return; }
  amount = Math.min(amount, available);
  from[itemName] -= amount;
  if (from[itemName] <= 0) delete from[itemName];
  to[itemName] = (to[itemName] || 0) + amount;
  showMessage(`${itemName} ${amount}개를 ${deposit ? "창고에 보관했습니다" : "가방으로 찾았습니다"}.`);
  render(); saveGame(); showHomeDialog("storage");
}

function bindStorageButtons() {
  const body = $("#modal-body");
  if (!body) return;
  body.querySelectorAll("[data-storage-up]").forEach(b => b.onclick = () => stepStorageQty(b.dataset.item, b.dataset.storageUp, +1));
  body.querySelectorAll("[data-storage-down]").forEach(b => b.onclick = () => stepStorageQty(b.dataset.item, b.dataset.storageDown, -1));
  body.querySelectorAll("[data-storage-min]").forEach(b => b.onclick = () => setStorageQty(b.dataset.item, b.dataset.storageMin, 0));
  body.querySelectorAll("[data-storage-max]").forEach(b => b.onclick = () => setStorageQty(b.dataset.item, b.dataset.storageMax, getStorageMax(b.dataset.item, b.dataset.storageMax)));
  body.querySelectorAll("[data-storage-move]").forEach(b => b.onclick = () => moveStorageItem(b.dataset.item, b.dataset.storageMove, getStorageQty(b.dataset.item, b.dataset.storageMove)));
}

function switchShopTab(tabName) { currentShopTab = tabName; renderShop(); }

function getShopTitle() {
  const shop = shops[currentShopKey];
  return `${shop.name} · 보유골드 ${fmt(gameState.gold || 0)}`;
}

function updateShopTitle() {
  if (!currentShopKey || !$("#modal").classList.contains("open")) return;
  const title = $("#modal-title");
  if (title) title.textContent = getShopTitle();
}

function renderShop() {
  const shop = shops[currentShopKey];
  const lv = getShopLevel();
  let html = `<div class="shop-meta">현재 상점 레벨: ${lv}단계 · 직업: ${gameState.job}</div>`;
  if (currentShopKey === "general" && gameState.job !== "잡화상인") {
    html += `<div class="shop-meta">잡화점 수수료: 구매가 20% 증가 · 판매가 20% 감소</div>`;
  } else if (currentShopKey === "general") {
    html += `<div class="shop-meta">잡화상인은 잡화점 수수료 없이 거래합니다.</div>`;
  }
  const _canCraftHere = canCraftInShop(currentShopKey);
  const _tabDefs = _canCraftHere
    ? [["craft", "제작"], ["buy", "구매"], ["sell", "판매"]]
    : [["buy", "구매"], ["sell", "판매"], ["craft", "제작"]];
  html += `<div class="tabs">` +
    _tabDefs.map(([t, l]) => `<button class="${currentShopTab === t ? "active" : ""}" data-tab="${t}">${l}</button>`).join("") +
    `</div><div id="shop-content"></div>`;

  const _myShop = jobs[gameState.job].shop;
  const _lv = getShopLevel();
  const upLabel = currentShopKey !== _myShop ? "상점 레벨업"
    : _lv >= 3 ? "상점 레벨업 (최고 단계)"
    : `상점 레벨업 (${fmt(UPGRADE_COST[_lv])}골드)`;
  openModal(getShopTitle(), html, [
    { label: upLabel, cls: "btn-main", onClick: upgradeShopLevel },

  $("#modal-body").querySelectorAll(".tabs button").forEach(b => {
    b.onclick = () => switchShopTab(b.dataset.tab);
  });
  renderShopContent();
}

function qtyStepper(key) {
  return `<div class="qty-ctrl">
    <button type="button" class="qty-edge" data-qmin="${key}">MIN</button>
    <button type="button" data-qd="${key}">−</button>
    <input data-qi="${key}" type="number" value="1" min="0" inputmode="numeric">
    <button type="button" data-qu="${key}">＋</button>
    <button type="button" class="qty-edge" data-qmax="${key}">MAX</button>
  </div>`;
}

function getMaxQtyForCurrentTab(key) {
  if (currentShopTab === "buy") {
    const buyPrice = calculateBuyPrice(key);
    return buyPrice > 0 ? Math.floor(gameState.gold / buyPrice) : 0;
  }
  if (currentShopTab === "sell") {
    return Math.max(0, gameState.inventory[key] || 0);
  }
  const recipes = craftingRecipes[currentShopKey] || [];
  const recipe = recipes.find(r => r.name === key);
  if (!recipe) return 0;
  let maxQ = Number.POSITIVE_INFINITY;
  if (recipe.gold > 0) maxQ = Math.floor(gameState.gold / recipe.gold);
  for (const m in recipe.mats) maxQ = Math.min(maxQ, Math.floor((gameState.inventory[m] || 0) / recipe.mats[m]));
  return Number.isFinite(maxQ) ? Math.max(0, maxQ) : 0;
}

function getRowQty(key) {
  const box = $("#shop-content");
  if (!box) return 0;
  const el = box.querySelector('[data-qi="' + key + '"]');
  let v = el ? parseInt(el.value, 10) : 0;
  if (!Number.isFinite(v) || v < 0) v = 0;
  if (el) el.value = v;
  return v;
}

function getRowUnitPrice(key) {
  if (currentShopTab === "buy") return calculateBuyPrice(key);
  if (currentShopTab === "sell") return calculateSellPrice(key);
  const recipes = craftingRecipes[currentShopKey] || [];
  const recipe = recipes.find(r => r.name === key);
  return recipe ? (recipe.gold || 0) : 0;
}

function getRowTotalLabel(key) {
  const qty = getRowQty(key);
  const total = getRowUnitPrice(key) * qty;
  if (currentShopTab === "buy") return `필요골드 ${fmt(total)}`;
  if (currentShopTab === "sell") return `예상수익 ${fmt(total)}`;
  return total > 0 ? `필요골드 ${fmt(total)}` : "필요골드 0";
}

function updateRowTotal(key) {
  const box = $("#shop-content");
  if (!box) return;
  const el = box.querySelector('[data-row-total="' + key + '"]');
  if (el) el.textContent = getRowTotalLabel(key);
}

function stepQty(key, delta) {
  const box = $("#shop-content");
  if (!box) return;
  const el = box.querySelector('[data-qi="' + key + '"]');
  if (!el) return;
  let v = parseInt(el.value, 10);
  if (!Number.isFinite(v)) v = 0;
  v = Math.max(0, v + delta);
  el.value = v;
  updateRowTotal(key);
}

function setQtyMin(key) {
  const box = $("#shop-content");
  if (!box) return;
  const el = box.querySelector('[data-qi="' + key + '"]');
  if (el) el.value = 0;
  updateRowTotal(key);
}

function setQtyMax(key) {
  const box = $("#shop-content");
  if (!box) return;
  const el = box.querySelector('[data-qi="' + key + '"]');
  if (el) el.value = getMaxQtyForCurrentTab(key);
  updateRowTotal(key);
}

function renderShopContent() {
  const box = $("#shop-content");
  if (!box) return;
  updateShopTitle();
  if (currentShopTab === "buy") box.innerHTML = renderBuyTab();
  else if (currentShopTab === "sell") box.innerHTML = renderSellTab();
  else box.innerHTML = renderCraftTab();
  bindShopButtons();
}

function renderBuyTab() {
  const list = getAvailablePurchaseItems(currentShopKey);
  if (list.length === 0) return `<div class="empty-msg">구매 가능한 아이템이 없습니다.</div>`;
  return list.map(name => {
    const it = items[name];
    const buyPrice = calculateBuyPrice(name);
    return `<div class="list-row">
      ${itemIcon(name)}
      <div class="info">${name}<br><small>구매가 ${fmt(buyPrice)}골드/개 · <b data-row-total="${name}">필요골드 ${fmt(buyPrice)}</b></small></div>
      ${qtyStepper(name)}
      <button data-buy="${name}">구매</button></div>`;
  }).join("");
}

function renderSellTab() {
  const inv = gameState.inventory;
  const keys = Object.keys(inv).filter(k => items[k] && items[k].type !== "goal" && !isUntradable(k));
  if (keys.length === 0) return `<div class="empty-msg">판매할 아이템이 없습니다.</div>`;
  let html = keys.map(name => {
    const sell = calculateSellPrice(name);
    const it = items[name];
    return `<div class="list-row">
      ${itemIcon(name)}
      <div class="info">${name} x${inv[name]}<br><small>판매가 ${fmt(sell)}골드/개 · <b data-row-total="${name}">예상수익 ${fmt(sell)}</b></small></div>
      ${qtyStepper(name)}
      <button data-sell="${name}">판매</button></div>`;
  }).join("");
  html += `<button class="btn btn-main" data-sellall="1" style="width:100%;margin-top:6px;">전체 판매</button>`;
  return html;
}

function renderCraftTab() {
  // 잡화점
  if (currentShopKey === "general") return `<div class="empty-msg">잡화점에는 제작 기능이 없습니다.</div>`;
  // 잡화상인이 다른 상점 제작탭
  if (gameState.job === "잡화상인") return `<div class="empty-msg">잡화상인은 제작을 할 수 없지만, 모든 재료를 더 비싸게 판매할 수 있습니다.</div>`;
  // 직업-상점 불일치
  if (!canCraftInShop(currentShopKey)) return `<div class="empty-msg">현재 직업으로는 이 상점의 제작 기능을 사용할 수 없습니다.</div>`;

  const list = getAvailableCraftItems(currentShopKey);
  if (list.length === 0) return `<div class="empty-msg">현재 레벨에서 제작 가능한 아이템이 없습니다.</div>`;
  return list.map(r => {
    const matStr = Object.keys(r.mats).map(m => `${m} ${r.mats[m]}개`).join(", ");
    const can = canMakeRecipe(r);
    return `<div class="list-row">
      ${itemIcon(r.name)}
      <div class="info">${r.name} <small>(Lv.${r.level})</small><br><small>재료: ${matStr}${r.gold > 0 ? ` · ${fmt(r.gold)}골드` : ""}</small></div>
      ${qtyStepper(r.name)}
      <button data-craft="${r.name}" ${can ? "" : "disabled"}>제작</button></div>`;
  }).join("");
}

function canMakeRecipe(r) {
  if (gameState.gold < r.gold) return false;
  for (const m in r.mats) { if ((gameState.inventory[m] || 0) < r.mats[m]) return false; }
  return true;
}

function bindShopButtons() {
  const box = $("#shop-content");
  if (!box) return;
  box.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => buyItem(b.dataset.buy));
  box.querySelectorAll("[data-sell]").forEach(b => b.onclick = () => sellItem(b.dataset.sell));
  box.querySelectorAll("[data-sellall]").forEach(b => b.onclick = () => sellAllItems());
  box.querySelectorAll("[data-craft]").forEach(b => b.onclick = () => craftItem(b.dataset.craft));
  box.querySelectorAll("[data-qu]").forEach(b => b.onclick = () => stepQty(b.dataset.qu, +1));
  box.querySelectorAll("[data-qd]").forEach(b => b.onclick = () => stepQty(b.dataset.qd, -1));
  box.querySelectorAll("[data-qmin]").forEach(b => b.onclick = () => setQtyMin(b.dataset.qmin));
  box.querySelectorAll("[data-qmax]").forEach(b => b.onclick = () => setQtyMax(b.dataset.qmax));
  box.querySelectorAll("[data-qi]").forEach(input => {
    input.oninput = () => updateRowTotal(input.dataset.qi);
    updateRowTotal(input.dataset.qi);
  });
}

/* 잡화상인 재료 판매 보너스 */
function getGeneralMerchantSellBonus() {
  if (gameState.job !== "잡화상인") return 0;
  const lv = getShopLevel();
  return lv === 1 ? 0.10 : lv === 2 ? 0.15 : 0.20;
}

function calculateSellPrice(itemName, shopKey = currentShopKey) {
  const it = items[itemName];
  if (!it) return 0;
  let price = it.price;
  if (shopKey === "general" && gameState.job !== "잡화상인") price *= 0.8;
  // 잡화상인 보너스는 재료에만 적용
  if (it.type === "material" && gameState.job === "잡화상인") {
    price = price * (1 + getGeneralMerchantSellBonus());
  }
  return Math.floor(price);
}

function calculateBuyPrice(itemName) {
  const it = items[itemName];
  if (!it) return 0;
  let price = it.price * 2;
  if (currentShopKey === "general" && gameState.job !== "잡화상인") price *= 1.2;
  return Math.floor(price);
}

function buyItem(itemName) {
  if (isUntradable(itemName)) { showMessage("이 아이템은 구매할 수 없습니다."); return; }
  const qty = getRowQty(itemName);
  if (qty <= 0) { showMessage("구매 수량을 선택하세요."); return; }
  const buyPrice = calculateBuyPrice(itemName);
  const total = buyPrice * qty;
  if (gameState.gold < total) { showMessage("골드가 부족합니다."); return; }
  gameState.gold -= total;
  addItemToInventory(itemName, qty);
  showMessage(`${itemName} ${qty}개 구매 (-${fmt(total)}골드)`);
  render(); saveGame(); renderShopContent();
}

function sellItem(itemName) {
  if (isUntradable(itemName)) { showMessage("이 아이템은 판매할 수 없습니다."); return; }
  const owned = gameState.inventory[itemName] || 0;
  if (owned <= 0) return;
  const qty = Math.min(getRowQty(itemName), owned);
  if (qty <= 0) { showMessage("판매 수량을 선택하세요."); return; }
  const price = calculateSellPrice(itemName);
  const total = price * qty;
  removeItemFromInventory(itemName, qty);
  gameState.gold += total;
  showMessage(`${itemName} ${qty}개 판매 (+${fmt(total)}골드)`);
  render(); saveGame(); renderShopContent();
}

function sellAllItems() {
  let total = 0, sold = 0;
  Object.keys(gameState.inventory).forEach(name => {
    if (!items[name] || items[name].type === "goal" || isUntradable(name)) return;
    const qty = gameState.inventory[name];
    total += calculateSellPrice(name) * qty;
    sold += qty;
    delete gameState.inventory[name];
  });
  if (sold === 0) { showMessage("판매할 아이템이 없습니다."); return; }
  gameState.gold += total;
  showMessage(`전체 판매 완료 (+${fmt(total)}골드)`);
  render(); saveGame(); renderShopContent();
}

function craftItem(itemName) {
  if (isUntradable(itemName)) { showMessage("신성 장비는 천계의 신성 대장장이에게서만 제작할 수 있습니다."); return; }
  const recipe = craftingRecipes[currentShopKey].find(r => r.name === itemName);
  if (!recipe) return;
  if (!canCraftInShop(currentShopKey)) { showMessage("현재 직업으로는 이 상점의 제작 기능을 사용할 수 없습니다."); return; }
  let maxQ = Infinity;
  if (recipe.gold > 0) maxQ = Math.floor(gameState.gold / recipe.gold);
  for (const m in recipe.mats) maxQ = Math.min(maxQ, Math.floor((gameState.inventory[m] || 0) / recipe.mats[m]));
  if (maxQ < 1) { showMessage("재료 또는 골드가 부족합니다."); return; }
  const qty = Math.min(getRowQty(itemName), maxQ);
  if (qty <= 0) { showMessage("제작 수량을 선택하세요."); return; }
  for (const m in recipe.mats) removeItemFromInventory(m, recipe.mats[m] * qty);
  gameState.gold -= recipe.gold * qty;
  addItemToInventory(itemName, qty);
  showMessage(`${itemName} ${qty}개 제작 성공`);
  render(); saveGame(); renderShopContent();
}

/* ============================================================
   상점 레벨업
============================================================ */
const UPGRADE_COST = { 1: 1000000, 2: 10000000 };
function upgradeShopLevel() {
  // 자신의 직업 상점에서만 레벨업 가능
  const myShop = jobs[gameState.job].shop;
  if (currentShopKey !== myShop) {
    showMessage(`상점 레벨업은 본인 직업 상점(${shops[myShop].name})에서만 가능합니다.`);
    return;
  }
  const lv = getShopLevel();
  if (lv >= 3) { showMessage("이미 최고 단계의 상점입니다."); return; }
  const cost = UPGRADE_COST[lv];
  if (gameState.gold < cost) { showMessage("골드가 부족합니다."); return; }
  gameState.gold -= cost;
  gameState.globalShopLevel = lv + 1; // 전체 상점 동시 상승
  showMessage(`상점이 ${gameState.globalShopLevel}단계로 상승했습니다!`);
  render(); saveGame(); renderShop();
}

function hatchPet() {
  if ((gameState.inventory["이상한 알"] || 0) < 1) { showMessage("이상한 알이 필요합니다."); return; }
  if (gameState.gold < 10000) { showMessage("부화 비용 10,000골드가 부족합니다."); return; }
  removeItemFromInventory("이상한 알", 1);
  gameState.gold -= 10000;
  if (Math.random() < 0.10) {
    addItemToInventory("1단계 펫", 1);
    showWorldBanner("펫 부화 성공", `${gameState.playerName || "플레이어"}님이 1단계 펫을 부화시켰습니다!`);
    showMessage("이상한 알이 부화했습니다!\n1단계 펫 1마리 획득");
  } else {
    showMessage("부화에 실패했습니다.\n이상한 알과 10,000골드가 소모되었습니다.");
  }
  render(); saveGame(); showPetBreederDialog();
}

function synthesizePet(level) {
  const source = getPetItemName(level);
  const result = getPetItemName(level + 1);
  const chance = 0.10;
  if (!source || !result) return;
  if ((gameState.inventory[source] || 0) < 2) { showMessage(`${source} 2마리가 필요합니다.`); return; }
  if (Math.random() < chance) {
    removeItemFromInventory(source, 2);
    addItemToInventory(result, 1);
    showWorldBanner("펫 합성 성공", `${gameState.playerName || "플레이어"}님이 ${result}을 획득했습니다!`);
    showMessage(`합성 성공!\n${source} 2마리 → ${result} 1마리`);
  } else {
    removeItemFromInventory(source, 1);
    showMessage(`합성 실패...\n${source} 1마리는 사라지고 1마리는 돌아왔습니다.`);
  }
  render(); saveGame(); showPetBreederDialog();
}

/* ============================================================
   이벤트 바인딩 / 초기화
============================================================ */
function init() {
  document.addEventListener("contextmenu", (ev) => ev.preventDefault());
  document.addEventListener("selectstart", (ev) => {
    if (ev.target && ev.target.closest && ev.target.closest("input,textarea")) return;
    ev.preventDefault();
  });
  document.addEventListener("dragstart", (ev) => ev.preventDefault());
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && $("#modal").classList.contains("open")) {
      ev.preventDefault();
      closeModal();
    }
  });

  // 현재 선택 슬롯 복원
  const saved = LS.getItem("merchantRpgCurrentSlot");
  currentSlotId = saved ? Number(saved) : 1;
  if (![1, 2, 3, 4].includes(currentSlotId)) currentSlotId = 1;

  renderSaveSlots();

  // 시작 화면 버튼
  $("#btn-new").onclick = startNewGame;
  $("#btn-continue").onclick = continueGame;
  $("#btn-delete").onclick = () => {
    if (!hasSaveData(currentSlotId) || !loadSlotData(currentSlotId).isGameCreated) {
      showMessage("삭제할 저장 데이터가 없습니다."); return;
    }
    openModal("슬롯 삭제", "선택한 캐릭터 슬롯의 저장 데이터를 삭제하시겠습니까?", [
      { label: "취소", cls: "btn-sub", onClick: closeModal },
      { label: "삭제", cls: "btn-danger", onClick: () => { deleteSlotData(currentSlotId); closeModal(); renderSaveSlots(); showMessage("삭제되었습니다."); } }
    ]);
  };

  // 캐릭터 생성
  $("#input-name").oninput = (e) => { creationBuffer.name = e.target.value; checkCreateReady(); };
  $("#gender-row").querySelectorAll(".opt").forEach(o => {
    o.onclick = () => {
      $("#gender-row").querySelectorAll(".opt").forEach(x => x.classList.remove("selected"));
      o.classList.add("selected");
      creationBuffer.gender = o.dataset.gender;
      checkCreateReady();
    };
  });
  $("#job-row").querySelectorAll(".opt").forEach(o => {
    o.onclick = () => {
      $("#job-row").querySelectorAll(".opt").forEach(x => x.classList.remove("selected"));
      o.classList.add("selected");
      creationBuffer.job = o.dataset.job;
      checkCreateReady();
    };
  });
  $("#btn-create-back").onclick = goToStart;
  $("#btn-create-start").onclick = createCharacter;

  // 프롤로그
  $("#btn-prologue-next").onclick = completePrologue;
  $("#btn-prologue-skip").onclick = skipPrologue;

  // 하단 네비
  document.querySelectorAll(".nav-btn").forEach(b => {
    b.onclick = () => {
      if (b.dataset.act === "inventory") openInventory();
      else if (b.dataset.act === "status") openStatusWindow();
      else if (b.dataset.act === "map") toggleMiniMap();
      else if (b.dataset.act === "help") showControlsHelp();
      else if (b.dataset.act === "settings") openSettings();
    };
  });

  // 클리어 화면
  $("#btn-clear-continue").onclick = () => { gameState.isGameCleared = true; enterGame(); };
  $("#btn-clear-home").onclick = goToStart;

  // 모달 닫기
  $("#modal-close").onclick = closeModal;
}

function showControlsHelp() {
  openModal("조작", "원형 조이스틱을 드래그하거나 WASD/방향키로 이동합니다.<br>오브젝트 가까이 가면 오른쪽 버튼으로 상호작용할 수 있습니다.<br>지역 이동은 마을과 숲에 놓인 포털을 이용하세요.", [
    { label: "닫기", cls: "btn-sub", onClick: closeModal }
  ]);
}

function checkCreateReady() {
  $("#btn-create-start").disabled = !(creationBuffer.name.trim() && creationBuffer.gender && creationBuffer.job);
}

document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
