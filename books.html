<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>창세비록 — 뫼비우스의 서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#1b120c; --bg2:#2a1b11; --ink:#f3e6cf; --ink-dim:#b9a283; --gold:#d8b46a; --gold-dim:#8f7240;
  --wood1:#6b4226; --wood2:#4a2b17; --wood3:#2e1a0d; --paper:#f4ead6;
  --side:300px; --pw:300px; --ph:444px; --flip:720ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 60% 35%,#4a2f1b 0%,var(--bg2) 38%,var(--bg) 75%);
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ───────── 책장 사이드바 ───────── */
aside{position:fixed;left:0;top:0;bottom:0;width:var(--side);overflow-y:auto;overflow-x:hidden;padding:22px 30px 28px 18px;transform:translateX(calc(-100% + 16px));transition:transform .4s cubic-bezier(.3,.8,.3,1);
  background:linear-gradient(90deg,var(--wood3),var(--wood2) 8%,var(--wood2) 92%,#1d0f06);
  box-shadow:inset -6px 0 14px rgba(0,0,0,.55),4px 0 18px rgba(0,0,0,.5);z-index:20}
body.drawer aside{transform:none;box-shadow:inset -6px 0 14px rgba(0,0,0,.55),12px 0 40px rgba(0,0,0,.7)}
@media (hover:hover){aside:hover{transform:none;box-shadow:inset -6px 0 14px rgba(0,0,0,.55),12px 0 40px rgba(0,0,0,.7)}aside:hover .handle{opacity:0}aside:hover~.scrim{opacity:1}}
.scrim{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse at 30% 50%,rgba(12,7,3,.35),rgba(12,7,3,.6));opacity:0;pointer-events:none;transition:opacity .4s ease}
body.drawer .scrim{opacity:1;pointer-events:auto}
.cur{position:relative;display:flex;gap:12px;align-items:center;margin:26px 2px 0;padding:10px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid rgba(216,180,106,.15)}
.cur img{width:58px;height:87px;object-fit:cover;border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,.6);flex:none}
.cur small{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold-dim);margin-bottom:4px}
.cur b{font-size:13px;line-height:1.45;color:var(--ink);font-weight:700}
.handle{position:absolute;right:0;top:0;bottom:0;width:16px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;letter-spacing:.5em;color:var(--gold);background:linear-gradient(90deg,#3a2112,#24140a);border-left:1px solid rgba(216,180,106,.25);transition:opacity .3s;z-index:2}
body.drawer .handle{opacity:0}
.handle{cursor:pointer}
aside::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(92deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px,transparent 10px 23px,rgba(255,220,170,.08) 23px 24px)}
.brand{position:relative;text-align:center;margin-bottom:24px}
.brand h1{font-size:25px;font-weight:800;letter-spacing:.12em;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.8)}
.brand h1,.vol-title strong,.cur b{font-family:'Nanum Myeongjo',serif}
.brand p{font-size:13px;letter-spacing:.3em;color:var(--ink-dim);margin-top:4px}
.progress{position:relative;margin:0 4px 18px;font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px #000;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:3px;transition:width .8s}
.progress b{color:var(--gold);font-weight:700}

.cabinet{position:relative;padding:10px 10px 0;border-radius:4px;
  background:linear-gradient(180deg,#1a0e06,#24140a);
  box-shadow:inset 0 0 0 7px var(--wood1),inset 0 0 0 9px #3b2213,inset 0 10px 30px rgba(0,0,0,.8),0 8px 20px rgba(0,0,0,.6)}
.shelf{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:0 12px}
.shelf::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#8a5a34,var(--wood1) 35%,var(--wood2));box-shadow:0 5px 8px rgba(0,0,0,.7)}
.shelf+.shelf{margin-top:24px}
.shelf:last-child{margin-bottom:12px}

.spine{position:relative;flex:0 0 38px;width:38px;border-radius:3px 3px 1px 1px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s;cursor:pointer}
.spine.empty{cursor:default;border:1px dashed rgba(216,180,106,.16);background:rgba(255,255,255,.015);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.spine.empty span{font-size:10px;color:rgba(216,180,106,.25)}
.spine.book{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 22%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.35)),var(--c);
  box-shadow:2px 0 3px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.3)}
.spine.book::before,.spine.book::after{content:"";position:absolute;left:3px;right:3px;height:5px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.8}
.spine.book::before{top:9px}.spine.book::after{bottom:9px}
.spine .no{position:absolute;top:20px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--gold)}
.spine .t{position:absolute;top:36px;bottom:20px;left:0;right:0;writing-mode:vertical-rl;text-orientation:upright;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs,11px);line-height:1;color:#f2dfb4;overflow:hidden;white-space:nowrap}
.spine.book:hover{transform:translateY(-4px);filter:brightness(1.12)}
.spine.book.active{transform:translateY(-6px);filter:brightness(1.18) drop-shadow(0 0 8px rgba(216,180,106,.55))}
.spine .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;
  width:120px;transition:.25s;z-index:5}
.spine .tip img{width:100%;display:block;border-radius:2px;box-shadow:0 8px 20px rgba(0,0,0,.8)}
.spine.book:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}
.shelf:first-child .spine .tip{bottom:auto;top:calc(100% + 10px)}
.side-foot{position:relative;margin-top:22px;font-size:11px;color:var(--ink-dim);text-align:center;line-height:1.7;opacity:.75}

/* ───────── 열람대 ───────── */
main{position:relative;z-index:1;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px 14px;min-width:0}
.vol-title{text-align:center;margin-bottom:12px;min-height:44px}
.vol-title small{display:block;font-size:12px;letter-spacing:.35em;color:var(--gold-dim)}
.vol-title strong{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.stage{position:relative;flex:1;width:100%;contain:size;display:flex;align-items:center;justify-content:center;min-height:0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:4200px;transition:transform .5s ease}
.book.single{width:var(--pw)}
.book.cover-only{transform:translateX(calc(var(--pw)*-.5))}
.book.back-only{transform:translateX(calc(var(--pw)*.5))}
.book.single.cover-only,.book.single.back-only{transform:none}
.page{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden}
.page img{width:100%;height:100%;display:block;object-fit:fill}
.page.L{left:0;box-shadow:-6px 8px 22px rgba(0,0,0,.55)}
.page.R{left:var(--pw);box-shadow:6px 8px 22px rgba(0,0,0,.55)}
.book.single .page.R{left:0}
.book.single .page.L{display:none}
.page.blank{visibility:hidden}
.page.L::after,.page.R::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.page.L::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22))}
.page.R::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.22))}
.book.single .page.R::after{display:none}
.page.loading{background:var(--paper) repeating-linear-gradient(0deg,transparent 0 22px,rgba(120,90,50,.05) 22px 23px)}

.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:10;
  transition:transform var(--flip) cubic-bezier(.45,.05,.3,1)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .face img{width:100%;height:100%;display:block}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--flip)}
.leaf .front::after{background:linear-gradient(270deg,rgba(0,0,0,.35),transparent 60%)}
.leaf .back::after{background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 60%);opacity:.9}
.leaf.go .front::after{opacity:1}.leaf.go .back::after{opacity:0}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.bwd{left:0;transform-origin:right center}
.leaf.bwd.go{transform:rotateY(180deg)}
.book.single .leaf{left:0}
.book.single .leaf.fwd{transform-origin:left center}
.book.single .leaf.bwd{transform-origin:left center;transform:rotateY(-180deg)}
.book.single .leaf.bwd.go{transform:rotateY(0)}

.hot{position:absolute;top:0;bottom:0;width:50%;z-index:12;cursor:pointer}
.hot.prev{left:0}.hot.next{right:0}

.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:30;
  background:rgba(27,18,12,.82);transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
.loader img{height:min(46vh,380px);border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.8)}
.loader .lbar{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.loader .lbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.loader span{font-size:13px;color:var(--ink-dim)}

.controls{display:flex;align-items:center;gap:12px;margin-top:16px;width:min(720px,100%);
  background:rgba(0,0,0,.28);border:1px solid rgba(216,180,106,.15);border-radius:30px;padding:7px 14px}
.controls button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--gold);transition:background .2s}
.controls button:hover{background:rgba(216,180,106,.14)}
.controls button:disabled{opacity:.3;cursor:default;background:none}
.controls svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.controls input[type=range]{flex:1;accent-color:var(--gold);min-width:60px}
.controls .pg{font-size:13px;color:var(--ink-dim);min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.menu-btn{display:none}
.hint{position:absolute;bottom:8px;right:16px;font-size:11px;color:rgba(185,162,131,.5)}

/* ───────── 모바일 ───────── */
@media (max-width:860px){
  body{grid-template-columns:1fr}
  aside{width:min(300px,86vw);transform:translateX(-102%);padding-right:18px}
  aside:hover{transform:translateX(-102%)}
  .handle{display:none}
  body.drawer aside{transform:none}
  main{padding:12px 16px 10px}
  .menu-btn{display:grid}
  .hint{display:none}
  .controls{gap:6px;padding:5px 8px}
  .controls .pg{min-width:70px;font-size:12px}
  .vol-title strong{font-size:16px}
}
@media (max-width:420px){#bFirst,#bFull{display:none}}
@media (max-height:520px){.vol-title{display:none}.controls{margin-top:6px;padding:3px 10px}.controls button{width:28px;height:28px}main{padding:6px 12px}.hint{display:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="handle">책장 ▸</div>
  <div class="brand"><h1 id="sName">창세비록</h1><p id="sSub">뫼비우스의 서</p></div>
  <div class="cabinet" id="cabinet"></div>
  <div class="cur" id="cur"><img id="curCover" alt=""><div><small id="curNo"></small><b id="curTitle"></b></div></div>
  <div class="side-foot">책등을 누르면 그 권이 펼쳐집니다</div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <div class="vol-title"><small id="vNo"></small><strong id="vTitle"></strong></div>
  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="page L" id="pL"><img alt=""></div>
      <div class="page R" id="pR"><img alt=""></div>
      <div class="hot prev" id="hPrev"></div>
      <div class="hot next" id="hNext"></div>
    </div>
    <div class="loader" id="loader"><img id="lCover" alt=""><div class="lbar"><i id="lBar"></i></div><span id="lMsg">책을 펼치는 중…</span></div>
  </div>
  <div class="controls">
    <button class="menu-btn" id="bMenu" title="책장"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 5l4 15M3 20h18"/></svg></button>
    <button id="bFirst" title="처음"><svg viewBox="0 0 24 24"><path d="M18 6l-6 6 6 6M7 6v12"/></svg></button>
    <button id="bPrev" title="이전"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <input type="range" id="slider" min="0" max="1" value="0">
    <span class="pg" id="pg">– / –</span>
    <button id="bNext" title="다음"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="bMode" title="한 쪽 / 두 쪽 보기"><svg viewBox="0 0 24 24"><path d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg></button>
    <button id="bFull" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="hint">← → 키 · 페이지 클릭 · 스와이프로 넘기기</div>
</main>

<script>
/* books.json을 못 읽을 때(파일을 직접 열었을 때 등) 쓰는 기본값 */
const FALLBACK={series:"창세비록",subtitle:"뫼비우스의 서",totalVolumes:20,
  volumes:[{no:1,title:"실버 애로우와 제국의 그림자",spine:"실버 애로우",cover:"books/vol01_cover.jpg",files:["books/vol01_a.pdf","books/vol01_b.pdf"]}]};
const LEATHER=["#6e1f1c","#1f3b2c","#22304f","#5a2a48","#4d3416","#2d4648","#5e1d2a","#2f2a52","#3d4a1e","#6a3a18"];
const RATIO=430.92/637.92;

pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={cfg:null,vol:null,map:[],N:0,spread:0,single:false,busy:false,cache:new Map(),gen:0,renderW:0};

/* ── 책장 ── */
function buildShelf(){
  const c=S.cfg,cab=$('cabinet');cab.innerHTML='';
  const total=c.totalVolumes||20,perRow=5;
  $('sName').textContent=c.series;$('sSub').textContent=c.subtitle||'';
  for(let r=0;r<Math.ceil(total/perRow);r++){
    const row=document.createElement('div');row.className='shelf';
    for(let i=0;i<perRow;i++){
      const n=r*perRow+i+1;if(n>total)break;
      const v=c.volumes.find(x=>x.no===n);
      const el=document.createElement('div');
      const h=126+((n*37)%13);el.style.height=h+'px';
      if(v){
        el.className='spine book';el.dataset.no=n;
        el.style.setProperty('--c',v.color||LEATHER[(n-1)%LEATHER.length]);
        el.innerHTML=`<div class="no">${n}</div><div class="t" style="--fs:${Math.min(11,Math.max(7,(h-60)/[...(v.spine||v.title)].length)).toFixed(1)}px">${v.spine||v.title}</div>`;
        el.title=`${n}권 · ${v.title}`;
        el.onclick=()=>{openVolume(n);document.body.classList.remove('drawer')};
      }else{el.className='spine empty'}
      row.appendChild(el);
    }
    cab.appendChild(row);
  }
}

/* ── 권 열기 ── */
async function openVolume(no){
  const v=S.cfg.volumes.find(x=>x.no===no);if(!v)return;
  const gen=++S.gen;
  document.querySelectorAll('.spine.book').forEach(s=>s.classList.toggle('active',+s.dataset.no===no));
  $('curCover').src=v.cover||'';$('curCover').style.display=v.cover?'':'none';$('curNo').textContent=`읽는 중 · 제 ${no} 권`;$('curTitle').textContent=v.title;
  $('vNo').textContent=`제 ${no} 권`;$('vTitle').textContent=v.title;document.title=`${S.cfg.series} ${no}권 — ${v.title}`;
  const L=$('loader');L.classList.remove('hide');$('lCover').src=v.cover||'';$('lCover').style.display=v.cover?'':'none';
  $('lMsg').textContent='책을 펼치는 중…';$('lBar').style.width='5%';
  S.cache.forEach(u=>URL.revokeObjectURL(u));S.cache.clear();S.map=[];S.N=0;
  try{
    const prog=new Array(v.files.length).fill(0);
    const docs=await Promise.all(v.files.map((f,i)=>{
      const t=pdfjsLib.getDocument({url:f,disableAutoFetch:true,rangeChunkSize:262144});
      t.onProgress=p=>{if(p.total){prog[i]=p.loaded/p.total;$('lBar').style.width=(5+90*prog.reduce((a,b)=>a+b)/prog.length)+'%'}};
      return t.promise;
    }));
    if(gen!==S.gen)return;
    docs.forEach(d=>{for(let i=1;i<=d.numPages;i++)S.map.push({d,i})});
    S.N=S.map.length;S.vol=v;
    const saved=store.get('pos_'+no)||1;
    store.set('lastVol',no);
    layout(true);goToPage(saved,true);
    $('lBar').style.width='100%';setTimeout(()=>L.classList.add('hide'),250);
  }catch(e){console.error(e);$('lMsg').textContent='PDF를 불러오지 못했습니다. (파일 경로·업로드 확인)'}
}

/* ── 쪽 렌더링 ── */
function renderPage(n){
  if(!n||n<1||n>S.N)return Promise.resolve(null);
  const key=n+'@'+S.renderW;
  if(S.cache.has(key))return Promise.resolve(S.cache.get(key));
  const job=(async()=>{
    const {d,i}=S.map[n-1];const pg=await d.getPage(i);
    const vp1=pg.getViewport({scale:1});const W=S.renderW,vp=pg.getViewport({scale:W*2/vp1.width});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await pg.render({canvasContext:cv.getContext('2d',{alpha:false}),viewport:vp}).promise;
    /* 2배로 그린 뒤 고품질 축소 → 화면 픽셀과 1:1로 표시 */
    const out=document.createElement('canvas');out.width=W;out.height=Math.round(cv.height*W/cv.width);
    const ox=out.getContext('2d',{alpha:false});ox.imageSmoothingEnabled=true;ox.imageSmoothingQuality='high';ox.drawImage(cv,0,0,out.width,out.height);
    cv.width=cv.height=0;
    const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.92));
    const url=URL.createObjectURL(blob);S.cache.set(key,url);
    if(S.cache.size>36){const k=S.cache.keys().next().value;URL.revokeObjectURL(S.cache.get(k));S.cache.delete(k)}
    return url;
  })();
  S.cache.set(key,job);
  job.then(u=>S.cache.set(key,u)).catch(()=>S.cache.delete(key));
  return job;
}
const decode=url=>new Promise(r=>{if(!url)return r();const im=new Image();im.onload=im.onerror=()=>r();im.src=url});

/* ── 펼침면 계산 ── */
function pagesOf(s){if(S.single)return[null,s+1];if(s===0)return[null,1];return[2*s,2*s+1<=S.N?2*s+1:null]}
const maxSpread=()=>S.single?S.N-1:Math.floor(S.N/2);
const spreadOf=p=>S.single?p-1:Math.floor(p/2);

async function setPage(el,n){
  el.classList.toggle('blank',!n);
  const img=el.querySelector('img');
  if(!n){img.removeAttribute('src');return}
  el.classList.add('loading');const u=await renderPage(n);await decode(u);
  img.src=u;el.classList.remove('loading');
}
function updateUI(){
  const [l,r]=pagesOf(S.spread),b=$('book');
  b.classList.toggle('cover-only',!S.single&&!l);
  b.classList.toggle('back-only',!S.single&&!r);
  $('pg').textContent=(S.single?r:[l,r].filter(Boolean).join('–'))+' / '+S.N;
  $('slider').max=maxSpread();$('slider').value=S.spread;
  $('bPrev').disabled=$('bFirst').disabled=S.spread<=0;$('bNext').disabled=S.spread>=maxSpread();
  store.set('pos_'+S.vol.no,l||r);
}
function prefetch(){[-1,1,2].forEach(k=>{const s=S.spread+k;if(s>=0&&s<=maxSpread())pagesOf(s).forEach(renderPage)})}

async function goToPage(p,instant){
  p=Math.max(1,Math.min(S.N,p));S.spread=spreadOf(p);
  const [l,r]=pagesOf(S.spread);
  await Promise.all([setPage($('pL'),l),setPage($('pR'),r)]);
  updateUI();prefetch();
}

/* ── 책장 넘기기 ── */
async function flip(dir){
  if(S.busy||!S.vol)return;
  const ns=S.spread+dir;if(ns<0||ns>maxSpread())return;
  S.busy=true;
  const [cl,cr]=pagesOf(S.spread),[nl,nr]=pagesOf(ns);
  const urls=await Promise.all([cl,cr,nl,nr].map(renderPage));await Promise.all(urls.map(decode));
  const [ucl,ucr,unl,unr]=urls,book=$('book');
  const leaf=document.createElement('div');
  const face=(cls,u)=>`<div class="face ${cls}">${u?`<img src="${u}">`:''}</div>`;
  if(S.single){
    if(dir>0){leaf.className='leaf fwd';leaf.innerHTML=face('front',ucr)+face('back',null);await setPage($('pR'),nr)}
    else{leaf.className='leaf bwd';leaf.innerHTML=face('front',unr)+face('back',null)}
  }else if(dir>0){
    leaf.className='leaf fwd';leaf.innerHTML=face('front',ucr)+face('back',unl);await setPage($('pR'),nr);
  }else{
    leaf.className='leaf bwd';leaf.innerHTML=face('front',ucl)+face('back',unr);await setPage($('pL'),nl);
  }
  book.appendChild(leaf);
  S.spread=ns;
  book.classList.toggle('cover-only',!S.single&&!nl);book.classList.toggle('back-only',!S.single&&!nr);
  leaf.getBoundingClientRect();
  requestAnimationFrame(()=>leaf.classList.add('go'));
  const dur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flip'))||700;
  await new Promise(r=>setTimeout(r,dur+30));
  if(S.single||dir>0)await setPage(S.single?$('pR'):$('pL'),S.single?nr:nl);
  if(!S.single&&dir<0)await setPage($('pR'),nr);
  leaf.remove();updateUI();prefetch();S.busy=false;
}

/* ── 크기 맞춤 ── */
function layout(force){
  const st=$('stage').getBoundingClientRect();
  const autoSingle=st.width<520||st.width<st.height*1.05;
  const wantSingle=S.forceSingle!=null?S.forceSingle:autoSingle;
  const modeChanged=wantSingle!==S.single;
  const firstPage=S.vol?(pagesOf(S.spread).filter(Boolean)[0]||1):1;
  S.single=wantSingle;$('book').classList.toggle('single',S.single);
  const cols=S.single?1:2;
  let ph=st.height-8,pw=ph*RATIO;
  if(pw*cols>st.width-8){pw=(st.width-8)/cols;ph=pw/RATIO}
  pw=Math.floor(pw/2)*2;ph=Math.round(pw/RATIO);
  document.documentElement.style.setProperty('--pw',pw+'px');
  document.documentElement.style.setProperty('--ph',ph+'px');
  const rw=Math.max(300,Math.min(2400,Math.ceil(pw*Math.min(window.devicePixelRatio||1,3)/50)*50));
  /* 해상도는 올려야 할 때만 다시 그림(줄어들 때는 기존 고해상도 그림을 그대로 축소) */
  const resUp=force||rw>S.renderW;if(resUp)S.renderW=rw;
  if(S.vol&&!force){
    if(modeChanged)goToPage(firstPage);
    else if(resUp){clearTimeout(S.rrT);S.rrT=setTimeout(()=>goToPage(pagesOf(S.spread).filter(Boolean)[0]||1),450)}
  }
}

/* ── 입력 ── */
$('hNext').onclick=()=>flip(1);$('hPrev').onclick=()=>flip(-1);
$('bNext').onclick=()=>flip(1);$('bPrev').onclick=()=>flip(-1);
$('bFirst').onclick=()=>goToPage(1);
$('slider').oninput=e=>{const s=+e.target.value;$('pg').textContent=(pagesOf(s).filter(Boolean).join('–'))+' / '+S.N};
$('slider').onchange=e=>{const s=+e.target.value;goToPage(pagesOf(s).filter(Boolean)[0])};
$('bMode').onclick=()=>{S.forceSingle=!S.single;layout()};
$('bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
$('bMenu').onclick=()=>document.body.classList.toggle('drawer');
document.querySelector('.handle').onclick=()=>document.body.classList.toggle('drawer');
$('scrim').onclick=()=>document.body.classList.remove('drawer');
document.body.addEventListener('click',e=>{if(document.body.classList.contains('drawer')&&!e.target.closest('aside')&&!e.target.closest('#bMenu'))document.body.classList.remove('drawer')});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();flip(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();flip(-1)}
  else if(e.key==='Home')goToPage(1);else if(e.key==='End')goToPage(S.N);
});
let tx=null;
$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>45)flip(dx<0?1:-1);tx=null},{passive:true});
let rt=0;const relayout=()=>{if(rt)return;rt=requestAnimationFrame(()=>{rt=0;layout()})};
addEventListener('resize',relayout);addEventListener('orientationchange',relayout);
document.addEventListener('fullscreenchange',relayout);
if(window.ResizeObserver)new ResizeObserver(relayout).observe($('stage'));

/* ── 시작 ── */
(async()=>{
  try{const r=await fetch('books.json',{cache:'no-cache'});if(!r.ok)throw 0;S.cfg=await r.json()}catch(e){S.cfg=FALLBACK}
  S.cfg.volumes.sort((a,b)=>a.no-b.no);
  buildShelf();layout(true);
  const last=store.get('lastVol');
  openVolume(S.cfg.volumes.some(v=>v.no===last)?last:S.cfg.volumes[0].no);
})();
</script>
