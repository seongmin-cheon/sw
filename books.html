<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1028">
<title>비밀의 서고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#1b120c; --bg2:#2a1b11; --ink:#f3e6cf; --ink-dim:#b9a283; --gold:#d8b46a; --gold-dim:#8f7240;
  --wood1:#6b4226; --wood2:#4a2b17; --wood3:#2e1a0d; --paper:#f4ead6;
  --side:300px; --pw:300px; --ph:444px; --flip:850ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 60% 35%,#4a2f1b 0%,var(--bg2) 38%,var(--bg) 75%);
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ───────── 책장 사이드바 ───────── */
aside{position:fixed;left:0;top:0;bottom:0;width:var(--side);overflow-y:auto;overflow-x:hidden;padding:22px 30px 28px 18px;transform:translateX(calc(-100% + 16px));transition:transform .4s cubic-bezier(.3,.8,.3,1);
  background:linear-gradient(90deg,var(--wood3),var(--wood2) 8%,var(--wood2) 92%,#1d0f06);
  box-shadow:inset -6px 0 14px rgba(0,0,0,.55),4px 0 18px rgba(0,0,0,.5);z-index:20}
body.drawer aside{transform:none;box-shadow:inset -6px 0 14px rgba(0,0,0,.55),12px 0 40px rgba(0,0,0,.7)}
@media (hover:hover){aside:hover{transform:none;box-shadow:inset -6px 0 14px rgba(0,0,0,.55),12px 0 40px rgba(0,0,0,.7)}aside:hover .handle{opacity:0}aside:hover~.scrim{opacity:1}}
.scrim{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse at 30% 50%,rgba(12,7,3,.35),rgba(12,7,3,.6));opacity:0;pointer-events:none;transition:opacity .4s ease}
body.drawer .scrim{opacity:1;pointer-events:auto}
.cur{position:relative;display:flex;gap:10px;align-items:center;margin:26px 2px 0;padding:10px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid rgba(216,180,106,.15)}
.cur img{width:46px;height:69px;object-fit:cover;border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,.6);flex:none}
.cur small{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold-dim);margin-bottom:4px}
.cur>div{min-width:0;flex:1}
.cur b{display:block;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13.5px;line-height:1.3;color:#fff4dc;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.handle{position:absolute;right:0;top:0;bottom:0;width:16px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;letter-spacing:.5em;color:var(--gold);background:linear-gradient(90deg,#3a2112,#24140a);border-left:1px solid rgba(216,180,106,.25);transition:opacity .3s;z-index:2}
body.drawer .handle{opacity:0}
.handle{cursor:pointer}
aside::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(92deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px,transparent 10px 23px,rgba(255,220,170,.08) 23px 24px)}
.brand{position:relative;text-align:center;margin-bottom:24px}
.brand h1{font-size:23px;font-weight:800;letter-spacing:.12em;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.8)}
.brand h1,.vol-title strong{font-family:'Nanum Myeongjo',serif}
.brand p{font-size:11px;letter-spacing:.25em;font-family:Georgia,serif;color:var(--ink-dim);margin-top:4px}
.progress{position:relative;margin:0 4px 18px;font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px #000;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:3px;transition:width .8s}
.progress b{color:var(--gold);font-weight:700}

.cabinet{position:relative;padding:10px 10px 0;border-radius:4px;
  background:linear-gradient(180deg,#1a0e06,#24140a);
  box-shadow:inset 0 0 0 7px var(--wood1),inset 0 0 0 9px #3b2213,inset 0 10px 30px rgba(0,0,0,.8),0 8px 20px rgba(0,0,0,.6)}
.shelf{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:flex-start;gap:5px;padding:0 12px}
.shelf::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#8a5a34,var(--wood1) 35%,var(--wood2));box-shadow:0 5px 8px rgba(0,0,0,.7)}
.shelf+.shelf{margin-top:24px}
.shelf:last-child{margin-bottom:12px}

.spine{position:relative;flex:0 0 38px;width:38px;border-radius:3px 3px 1px 1px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s;cursor:pointer}
.spine.empty{cursor:default;border:1px dashed rgba(216,180,106,.16);background:rgba(255,255,255,.015);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.spine.empty span{font-size:10px;color:rgba(216,180,106,.25)}
.spine.book{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 22%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.35)),var(--c);
  box-shadow:2px 0 3px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.3)}
.spine.book::before,.spine.book::after{content:"";position:absolute;left:3px;right:3px;height:5px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.8}
.spine.book::before{top:9px}.spine.book::after{bottom:9px}
.spine .no{position:absolute;top:19px;left:0;right:0;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--gold)}
.spine .t{position:absolute;top:36px;bottom:20px;left:0;right:0;writing-mode:vertical-rl;text-orientation:upright;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs,11px);line-height:1;color:#f2dfb4;overflow:hidden;white-space:nowrap}
.spine.book:hover{transform:translateY(-4px);filter:brightness(1.12)}
.spine.book.active{transform:translateY(-6px);filter:brightness(1.18) drop-shadow(0 0 8px rgba(216,180,106,.55))}
.spine .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;
  width:120px;transition:.25s;z-index:5}
.spine .tip img{width:100%;display:block;border-radius:2px;box-shadow:0 8px 20px rgba(0,0,0,.8)}
.spine.book:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}
.shelf:first-child .spine .tip{bottom:auto;top:calc(100% + 10px)}
.side-foot{position:relative;margin-top:22px;font-size:11px;color:var(--ink-dim);text-align:center;line-height:1.7;opacity:.75}

/* ───────── 열람대 ───────── */
main{position:relative;z-index:1;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 24px 14px;min-width:0}
.vol-title{position:absolute;top:0;left:0;right:0;z-index:25;text-align:left;padding:16px 30px 40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,12,6,.9),rgba(20,12,6,.55) 60%,transparent);opacity:0;transform:translateY(-14px);transition:opacity .45s ease,transform .45s ease}
main.show-title .vol-title{opacity:1;transform:none}
/* 전체화면: 하단 막대를 겹쳐 띄우고 필요할 때만 표시 */
body.ovl main{padding:calc(34px + env(safe-area-inset-top)) 6px 6px}
body.ovl .controls{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));bottom:auto;z-index:27;margin:0;transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  background:rgba(20,12,6,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .35s ease,transform .35s ease}
body.ovl main.show-ui .controls{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.touch .controls{width:calc(100% - 20px)}
body.ovl .hint{display:none}
/* 하단 손잡이(쪽 번호) — 좌측 책장 손잡이와 같은 방식 */
.nav-handle{position:absolute;left:50%;top:env(safe-area-inset-top);z-index:26;transform:translateX(-50%);display:flex;white-space:nowrap;align-items:center;gap:8px;
  padding:6px 16px 5px;border-radius:0 0 10px 10px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--gold);cursor:pointer;
  background:linear-gradient(180deg,#3a2112,#24140a);border:1px solid rgba(216,180,106,.3);border-top:0;box-shadow:0 3px 10px rgba(0,0,0,.4);
  transition:opacity .3s,transform .3s;font-variant-numeric:tabular-nums}
.nav-handle b{font-weight:500;color:#e8d6ad}
.nav-handle .hg{position:relative;width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:visible;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.nav-handle .hg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b7a43,#f1d58f);border-radius:2px;transition:width .4s ease}
.nav-handle em{font-style:normal;color:var(--gold);min-width:34px;text-align:right}
@media (max-width:420px){.nav-handle .hg{width:70px}}
.nav-handle .hbtns{display:flex;gap:2px;margin-left:2px;padding-left:6px;border-left:1px solid rgba(216,180,106,.2)}
.nav-handle .hbtns button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--gold);transition:background .2s}
.nav-handle .hbtns button:hover{background:rgba(216,180,106,.18)}
.nav-handle .hbtns svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main.show-ui .nav-handle,main.show-title .nav-handle{opacity:0;transform:translate(-50%,-100%);pointer-events:none}


/* 터치 기기: 좌 ⅓ 이전 · 가운데 ⅓ 메뉴 · 우 ⅓ 다음 */
.hot.mid{display:none}

.tapguide{position:absolute;inset:0;z-index:30;display:flex;pointer-events:none;opacity:0;transition:opacity .4s}
.tapguide.on{opacity:1}
.tapguide div{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:#fff6e3;text-shadow:0 1px 4px #000;border-right:1px dashed rgba(255,246,227,.35);background:rgba(10,6,3,.35)}
.tapguide div:last-child{border:0}

body.fs.idle{cursor:none}
.vol-title small{display:inline;font-size:21px;font-weight:700;letter-spacing:.06em;color:#fff6e3;font-family:'Nanum Myeongjo',serif}
.vol-title small em{font-style:normal;font-weight:500;font-size:17px;color:#d6c3a0;margin:0 10px 0 8px;font-family:'Noto Sans KR',sans-serif}
.vol-title strong{font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.02em}
.vol-title small,.vol-title strong{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6)}
.stage{position:relative;flex:1;width:100%;contain:size;display:flex;align-items:center;justify-content:center;min-height:0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:3500px;transition:transform .5s ease}
.book.single{width:var(--pw)}
.book.cover-only{transform:translateX(calc(var(--pw)*-.5))}
.book.back-only{transform:translateX(calc(var(--pw)*.5))}
.book.single.cover-only,.book.single.back-only{transform:none}
.page{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden}
.page img{width:100%;height:100%;display:block;object-fit:fill}
.page.L{left:0;box-shadow:-6px 8px 22px rgba(0,0,0,.55)}
.page.R{left:var(--pw);box-shadow:6px 8px 22px rgba(0,0,0,.55)}
.book.single .page.R{left:0}
.book.single .page.L{display:none}
.page.blank{visibility:hidden}
.page.L::after,.page.R::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.page.L::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22))}
/* 원고 PDF의 왼쪽 쪽에는 제본선 음영이 이미 그려져 있어, 오른쪽 쪽 음영을 같은 모양으로 맞춤 */
.page.R::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.40) 0%,rgba(0,0,0,.32) 8%,rgba(0,0,0,.25) 15%,rgba(0,0,0,.17) 30%,rgba(0,0,0,.09) 58%,transparent 100%)}
.book.single .page.R::after{display:none}
.page.loading{background:var(--paper) repeating-linear-gradient(0deg,transparent 0 22px,rgba(120,90,50,.05) 22px 23px)}

.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:10;
  transition:transform var(--flip) cubic-bezier(.45,.05,.3,1)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .face img{width:100%;height:100%;display:block}
.leaf .back{transform:rotateY(180deg)}
.cleaf{position:absolute;top:0;z-index:10;transform-style:preserve-3d;pointer-events:none}
.cseg{position:absolute;top:0;transform-origin:left center;transform-style:preserve-3d}
.cface{position:absolute;top:0;bottom:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--paper);background-repeat:no-repeat}
.cface i,.cface b{position:absolute;inset:0;pointer-events:none}
.cface b{background-color:var(--paper);background-repeat:no-repeat}
.cseg,.cface{will-change:transform}
.cface.gutF::after,.cface.gutB::after{content:"";position:absolute;inset:0;pointer-events:none}
.cface.gutF::after{background:linear-gradient(270deg,transparent,rgba(0,0,0,.2))}
.cface.gutB::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.2))}
/* 넘어가는 장: 제본선 음영은 고정 페이지와 똑같이, 넘기는 동안만 은은한 그늘 */
.leaf .face::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.leaf .face.asL::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22))}
.leaf .face.asR::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.22))}
.leaf .face::before{content:"";position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;z-index:1}
.leaf.go .front::before{animation:shadeF var(--flip) ease-in forwards}
.leaf.go .back::before{animation:shadeB var(--flip) ease-out forwards}
@keyframes shadeF{0%{opacity:0}50%{opacity:.16}100%{opacity:.16}}
@keyframes shadeB{0%{opacity:.16}50%{opacity:.16}100%{opacity:0}}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.bwd{left:0;transform-origin:right center}
.leaf.bwd.go{transform:rotateY(180deg)}
.book.single .leaf{left:0}
.book.single .leaf.fwd{transform-origin:left center}
.book.single .leaf.bwd{transform-origin:left center;transform:rotateY(-180deg)}
.book.single .leaf.bwd.go{transform:rotateY(0)}

.hot{position:absolute;top:0;bottom:0;width:50%;z-index:12;cursor:pointer}
.hot.prev{left:0}.hot.next{right:0}

.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:30;
  background:rgba(27,18,12,.82);transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
.loader img{height:min(46vh,380px);border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.8)}
.loader .lbar{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.loader .lbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.loader span{font-size:13px;color:var(--ink-dim)}

.controls{display:flex;align-items:center;gap:12px;margin-top:16px;width:min(720px,100%);
  background:rgba(0,0,0,.28);border:1px solid rgba(216,180,106,.15);border-radius:30px;padding:7px 14px}
.controls button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--gold);transition:background .2s}
.controls button:hover{background:rgba(216,180,106,.14)}
.controls button:disabled{opacity:.3;cursor:default;background:none}
.controls svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.controls input[type=range]{flex:1;accent-color:var(--gold);min-width:60px}
.controls .pg{font-size:13px;color:var(--ink-dim);min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.menu-btn{display:none}
.hint{position:absolute;bottom:8px;right:16px;font-size:11px;color:rgba(185,162,131,.5)}

/* ───────── 모바일 ───────── */
@media (max-width:860px){
  body{grid-template-columns:1fr}
  aside{width:min(300px,86vw);transform:translateX(-102%);padding-right:18px}
  aside:hover{transform:translateX(-102%)}
  .handle{display:none}
  body.drawer aside{transform:none}
  main{padding:12px 16px 10px}
  .menu-btn{display:grid}
  .hint{display:none}
  .controls{gap:6px;padding:5px 8px}
  .controls .pg{min-width:70px;font-size:12px}
  .vol-title strong{font-size:16px}
}
@media (max-width:420px){#bFirst,#bFull{display:none}}
@media (max-width:860px){.vol-title{padding:12px 16px 30px}.vol-title small{font-size:17px}.vol-title small em{font-size:14px;margin:0 6px 0 5px}.vol-title strong{font-size:15px}}
@media (max-height:520px){.controls{margin-top:6px;padding:3px 10px}.controls button{width:28px;height:28px}main{padding:6px 12px}.hint{display:none}}

/* ═════════ 상아탑 서고 (첫 화면) ═════════ */
#hall{position:fixed;inset:0;z-index:60;overflow:hidden auto;color:#f3e8d2;background:#0b1028;
  transition:opacity .4s ease,filter .4s ease;font-family:'Nanum Myeongjo',serif}
#hall.out{opacity:0;filter:blur(6px) brightness(1.3);pointer-events:none}
#hall.gone{display:none}
.h-bg{position:fixed;inset:-3%;background:url(books/hall_bg.jpg) 58% center/cover no-repeat;animation:kb 40s ease-in-out infinite alternate;pointer-events:none}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
.h-shade{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(8,12,34,.62),rgba(8,12,34,.25) 70%),linear-gradient(180deg,rgba(6,9,26,.55),rgba(6,9,26,.1) 35%,rgba(6,9,26,.65))}
#motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.h-inner{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 16px 3vh;gap:2.2vh}
#hall.again .h-inner *{animation-delay:0s!important;animation-duration:.35s!important}
.h-eyebrow{font-family:Georgia,serif;font-size:12px;letter-spacing:.45em;color:#d9bd7f;text-shadow:0 1px 6px rgba(0,0,0,.8);text-transform:uppercase;opacity:0;animation:rise .7s 0s forwards}
.h-title{font-size:clamp(46px,8vw,92px);font-weight:800;letter-spacing:.12em;line-height:1;margin-top:-1vh;
  background:linear-gradient(180deg,#fff3cf 0%,#e9c77a 50%,#b88a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(255,214,140,.35));opacity:0;animation:rise .8s .05s forwards}
.h-sub{font-size:clamp(14px,1.6vw,18px);letter-spacing:.6em;color:#e8d6ad;text-shadow:0 1px 8px rgba(0,0,0,.9);margin-top:-1.4vh;opacity:0;animation:rise 1.6s .7s forwards}
.h-orn{width:min(320px,70vw);height:14px;opacity:0;animation:rise .6s .2s forwards;
  background:linear-gradient(90deg,transparent,#d9bd7f 30%,transparent 50%,#d9bd7f 70%,transparent) center/100% 1px no-repeat}
.h-orn::after{content:"✦";display:block;text-align:center;color:#f1d58f;font-size:12px;line-height:14px}
.h-epi{text-align:center;font-size:clamp(14px,1.5vw,16px);line-height:1.8;color:#f3e8d2;text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8)}
.h-epi span{display:block;opacity:0;animation:rise .7s forwards}
.h-epi small{display:block;margin-top:6px;font-size:12px;letter-spacing:.3em;color:#d9bd7f;opacity:0;animation:rise .6s .6s forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}

.h-niche{position:relative;padding:76px 26px 16px;border-radius:50% 50% 6px 6px/72px 72px 6px 6px;opacity:0;animation:rise .7s .35s forwards;
  background:linear-gradient(180deg,rgba(14,20,52,.55),rgba(8,12,34,.78));
  box-shadow:inset 0 0 0 1px rgba(217,189,127,.55),inset 0 0 0 7px rgba(255,255,255,.03),inset 0 0 0 8px rgba(217,189,127,.25),inset 0 18px 40px rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.h-shelf{--bw:30px;--gap:6px;--per:10;display:flex;flex-wrap:wrap;gap:0 var(--gap);width:calc(var(--per)*(var(--bw) + var(--gap)) - var(--gap));
  background:repeating-linear-gradient(180deg,transparent 0 102px,#6b4a26 102px 105px,#b08953 105px 107px,rgba(0,0,0,.4) 107px 113px,transparent 113px 118px)}
.h-book{position:relative;width:var(--bw);height:90px;margin:12px 0 16px;align-self:flex-end;border-radius:2px 2px 1px 1px}
.h-book.empty{border:1px dashed rgba(217,189,127,.22);background:rgba(255,255,255,.02)}
.h-book.has{cursor:pointer;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.14) 25%,rgba(255,255,255,.04) 50%,rgba(0,0,0,.35)),var(--c);
  box-shadow:0 0 0 1px rgba(60,30,10,.3),0 0 18px rgba(255,214,140,.55);transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s;
  animation:glow 3.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 1px rgba(60,30,10,.3),0 0 10px rgba(255,214,140,.35)}to{box-shadow:0 0 0 1px rgba(60,30,10,.3),0 0 26px rgba(255,214,140,.8)}}
.h-book.has::before,.h-book.has::after{content:"";position:absolute;left:3px;right:3px;height:4px;border-top:1px solid #e3c47d;border-bottom:1px solid #e3c47d;opacity:.85}
.h-book.has::before{top:8px}.h-book.has::after{bottom:8px}
.h-book .n{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:10.5px;letter-spacing:0;font-weight:800;color:#e9cf8f}
.h-book .t{position:absolute;top:29px;bottom:13px;left:0;right:0;writing-mode:vertical-rl;text-orientation:upright;display:flex;align-items:center;justify-content:center;font-size:8.5px;color:#f5e6c2;white-space:nowrap;overflow:hidden;line-height:1}
.h-book.has:hover,.h-book.has.sel{transform:translateY(-10px)}
.h-label{font-size:12px;letter-spacing:.18em;color:#d9bd7f;margin:0 2px 2px;text-align:left}
.h-label b{color:#f1d58f;font-weight:700;letter-spacing:.1em}
.h-label:not(:first-child){margin-top:10px}
.s-label{position:relative;font-size:11px;letter-spacing:.12em;color:var(--gold);margin:4px 4px 8px;opacity:.9}
.s-label:not(:first-child){margin-top:30px}
.h-pick{position:relative;display:flex;align-items:center;gap:16px;min-height:96px;padding:12px 18px;border-radius:6px;opacity:0;animation:rise .6s .5s forwards;
  background:rgba(8,12,34,.62);box-shadow:inset 0 0 0 1px rgba(217,189,127,.35),0 10px 30px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.h-pick img{width:56px;height:84px;object-fit:cover;border-radius:2px;box-shadow:0 6px 16px rgba(60,40,15,.35)}
.h-pick small{display:block;font-size:11px;letter-spacing:.25em;color:#d9bd7f}
.h-pick b{display:block;font-size:17px;margin:4px 0 10px;color:#f7ecd4;white-space:nowrap}
.h-pick .btns{display:flex;gap:8px;flex-wrap:wrap}
.h-pick button{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:7px 14px;border-radius:20px;color:#fffaf0;background:linear-gradient(180deg,#a7803d,#7a5a24);box-shadow:0 2px 6px rgba(90,60,20,.3)}
.h-pick button.ghost{background:none;color:#e8d6ad;box-shadow:inset 0 0 0 1px rgba(217,189,127,.5)}
.h-pick button:hover{filter:brightness(1.08)}
.h-hint{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#d9bd7f;text-shadow:0 1px 6px #000;letter-spacing:.1em;opacity:0;animation:rise .6s .6s forwards}
.flyer{position:fixed;z-index:70;border-radius:3px;box-shadow:0 30px 80px rgba(60,40,15,.5);transition:all .5s cubic-bezier(.4,0,.2,1);pointer-events:none;object-fit:cover}
@media (max-width:640px){.h-shelf{--per:5;--bw:34px;--gap:8px}.h-niche{padding:70px 16px 12px}.h-epi{line-height:1.9}}
@media (max-height:700px) and (min-width:641px){.h-epi{display:none}}
@media (prefers-reduced-motion:reduce){.h-bg,.h-book.has{animation:none!important}#hall .h-inner *:not(.h-all):not(.ha-glow){animation:none!important;opacity:1!important;transform:none!important;filter:none!important}.h-title{filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))!important}}

/* ═════ PC(마우스): 손잡이·메뉴를 오른쪽 세로로 ═════ */
@media (min-width:861px){
  body.ovl:not(.touch) main{padding:6px 34px 6px 6px}
  body:not(.touch) .nav-handle{top:50%;left:auto;right:0;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:10px;
    padding:14px 6px;border-radius:10px 0 0 10px;border:1px solid rgba(216,180,106,.3);border-right:0;box-shadow:-3px 0 10px rgba(0,0,0,.4)}
  body:not(.touch) .nav-handle b{display:none}
  body:not(.touch) .nav-handle .hbtns{display:flex;flex-direction:column;gap:4px;margin:2px 0 0;padding:8px 0 0;border-left:0;border-top:1px solid rgba(216,180,106,.2)}
  body:not(.touch) .nav-handle em{min-width:0;text-align:center;font-size:12px;font-weight:600}
  body:not(.touch) .nav-handle .hg{width:4px;height:110px}
  body:not(.touch) .nav-handle .hg i{width:100%!important;height:var(--pc,0%);transition:height .4s ease;background:linear-gradient(180deg,#9b7a43,#f1d58f)}
  body:not(.touch) main.show-ui .nav-handle,body:not(.touch) main.show-title .nav-handle{transform:translate(100%,-50%)}
  body:not(.touch) main.show-title:not(.show-ui) .nav-handle{opacity:1;transform:translateY(-50%);pointer-events:auto}
  body.ovl:not(.touch) .controls{left:auto;right:14px;top:50%;bottom:auto;width:auto;height:min(560px,82%);flex-direction:column;
    border-radius:30px;padding:14px 7px;transform:translate(12px,-50%)}
  body.ovl:not(.touch) main.show-ui .controls{transform:translate(0,-50%)}
  body:not(.touch) .controls input[type=range]{writing-mode:vertical-lr;direction:ltr;width:auto;min-width:0;flex:1;min-height:80px}
  body:not(.touch) .controls .pg{min-width:0;font-size:12px;font-weight:600;color:var(--gold);text-align:center}
  body:not(.touch) .nav-handle{padding:14px 5px}
}

/* ── 책갈피 ── */
.bm.on svg{fill:currentColor}
.controls .bm.on,.nav-handle .bm.on{color:#f1d58f}
.ribbon{position:absolute;top:-6px;width:30px;height:74px;--rc:#c0392b;z-index:11;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.18) 45%,rgba(0,0,0,.22)),var(--rc);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.ribbon.on{opacity:1;transform:none}
#hDots i{position:absolute;top:50%;left:var(--p);width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--rc);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.toast{position:absolute;left:50%;top:40%;z-index:40;transform:translate(-50%,-50%) scale(.96);padding:10px 18px;border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-size:13px;
  color:#fff6e3;background:rgba(20,12,6,.88);box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:normal;text-align:center;line-height:1.5;width:max-content;max-width:min(360px,calc(100vw - 40px));word-break:keep-all}
.toast.on{opacity:1;transform:translate(-50%,-50%)}
.bmbox{position:relative;margin:12px 2px 0;padding:10px 12px;border-radius:4px;background:rgba(0,0,0,.2);border:1px solid rgba(216,180,106,.12)}
.bmhead{font-size:12px;color:var(--gold);letter-spacing:.08em;display:flex;justify-content:space-between}
.bmhead span{color:var(--ink-dim);letter-spacing:0}
#bmList{list-style:none;margin-top:6px}
#bmList li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid rgba(216,180,106,.08);font-size:13px;color:var(--ink);cursor:pointer;border-radius:3px}
#bmList li:hover{background:rgba(216,180,106,.08)}
#bmList li::before{content:"";width:11px;height:18px;flex:none;background:var(--rc);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
#bmList li small{margin-left:auto;font-size:11px;color:var(--ink-dim)}
#bmList li button{color:var(--ink-dim);font-size:14px;line-height:1;padding:0 2px}
#bmList li button:hover{color:#f1d58f}
#bmList .empty{cursor:default;color:var(--ink-dim);font-size:12px}
#bmList .empty::before{display:none}
@media (min-width:861px){body:not(.touch) #hDots i{left:50%;top:var(--p)}}

/* 손잡이 책갈피 바로가기(누르면 그 쪽으로 이동) */
.hbmk{display:flex;gap:3px;align-items:flex-start}
.hbmk:empty{display:none}
.hbmk button{width:12px;height:20px;padding:0;border:0;cursor:pointer;background:var(--rc);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);transition:transform .15s;opacity:.9}
.hbmk button:hover,.hbmk button.here{transform:translateY(3px);opacity:1}
.hbmk button.here{filter:brightness(1.25)}
@media (min-width:861px){body:not(.touch) .hbmk{flex-direction:column;gap:4px;align-items:center}
  body:not(.touch) .hbmk button{width:20px;height:12px;clip-path:polygon(0 0,100% 0,80% 50%,100% 100%,0 100%)}
  body:not(.touch) .hbmk button:hover,body:not(.touch) .hbmk button.here{transform:translateX(-3px)}}

/* 휴대폰: 위쪽 손잡이는 쪽 번호 대신 %만, 책장 아이콘은 왼쪽 손잡이가 없는 화면에서만 */
#hShelf{display:none;width:26px;height:26px;border-radius:50%;place-items:center;color:var(--gold);background:none;border:0;cursor:pointer;margin-left:-4px}
#hShelf:hover{background:rgba(216,180,106,.18)}
#hShelf svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:860px){.nav-handle b#hPg{display:none}#hShelf{display:grid}}
@media (max-width:480px){
  .nav-handle{gap:6px;padding:6px 10px 5px;max-width:calc(100vw - 12px)}
  .nav-handle .hg{width:46px!important}
  .hbmk{gap:2px}.hbmk button{width:10px;height:18px}
  .nav-handle em{min-width:0}
  .nav-handle .hbtns{gap:0;padding-left:4px}
  .nav-handle .hbtns button{width:26px}
}

/* 서고 + 선택 카드 좌우 배치 (넓은 화면) */
.h-row{display:flex;align-items:center;justify-content:center;gap:28px;width:100%}
@media (min-width:900px){
  .h-shelf{--bw:38px;--gap:8px;--per:12}
  .h-book{height:168px;margin-top:18px}
  .h-book .n{top:20px;font-size:13px}
  .h-book .t{top:42px;bottom:20px;font-size:13px!important;letter-spacing:.05em}
  .h-book.has::before{top:10px}.h-book.has::after{bottom:10px}
  .h-shelf{background:repeating-linear-gradient(180deg,transparent 0 186px,#6b4a26 186px 189px,#b08953 189px 191px,rgba(0,0,0,.4) 191px 197px,transparent 197px 202px)!important}
  .h-niche{padding:84px 34px 18px}
  .h-pick{flex-direction:column;align-items:flex-start;width:230px;padding:18px;gap:12px}
  .h-pick img{width:120px;height:180px}
  .h-pick b{line-height:1.4}
}
@media (max-width:899px){.h-row{flex-direction:column;gap:2.2vh}}

/* 서고: 작품 이름표 숨김(책등에 작품명이 있음), 작품 사이는 간격만 */
.h-label{display:none}
.h-shelf+.h-shelf{margin-top:6px}
@media (max-width:899px){
  .h-book{height:118px}
  .h-book .t{top:30px;font-size:10.5px!important}
  .h-shelf{background:repeating-linear-gradient(180deg,transparent 0 130px,#6b4a26 130px 133px,#b08953 133px 135px,rgba(0,0,0,.4) 135px 141px,transparent 141px 146px)!important}
}

/* PC: 서고와 선택 카드 높이 맞춤 */
@media (min-width:900px){
  .h-row{align-items:stretch}
  .h-pick{justify-content:center}
  .h-niche{display:flex;flex-direction:column;justify-content:flex-end}
}

.h-book.has,.spine.book{background:none!important;box-shadow:none!important}
.h-book.has::before,.h-book.has::after,.spine.book::before,.spine.book::after{display:none!important}
.h-book.has{animation:none!important;filter:drop-shadow(0 0 10px rgba(255,214,140,.35))}
.h-book .n,.h-book .t,.spine .no,.spine .t{z-index:1;color:#f6dc98!important;text-shadow:0 1px 2px rgba(0,0,0,.85)}
.h-book .n{top:calc(var(--bw)*1.6 + 6px)!important;font-size:12px!important}
.h-book .t{top:calc(var(--bw)*1.6 + 24px)!important;bottom:calc(var(--bw)*1.05 + 6px)!important;font-size:12px!important;font-weight:700}
@media (min-width:900px){.h-book{height:200px!important}.h-book .t{font-size:13px!important}}
@media (max-width:899px){.h-book{height:130px!important}.h-shelf{--bw:30px}
  .h-book.has .sk{border-width:calc(var(--bw)*1.1) 0 calc(var(--bw)*.75) 0}
  .h-book .n{top:calc(var(--bw)*1.1 + 4px)!important;font-size:10px!important}.h-book .t{top:calc(var(--bw)*1.1 + 18px)!important;bottom:calc(var(--bw)*.75 + 4px)!important;font-size:10.5px!important}}
.spine.book .sk{border-width:40px 0 26px 0}
.spine .no{top:44px!important}.spine .t{top:60px!important;bottom:30px!important}
/* ═════ 선택 카드: 작품명 크게, 권 제목 한 줄 ═════ */
.h-pick small{font-size:14px!important;letter-spacing:.12em!important}
.h-pick b{white-space:nowrap!important;overflow:hidden}
@media (min-width:900px){.h-pick{width:auto!important;min-width:240px;max-width:340px}.h-pick b{font-size:18px}}

/* 왼쪽 책장: 작품 이름표 없이 책만, 키 큰 책에 맞춰 칸 높이 */
.s-label{display:none!important}
.shelf{height:178px!important}
.cabinet .shelf:first-child{margin-top:6px}

/* ═════ 신간 아우라 ═════ */
.h-book.new::before,.spine.book.new::before{content:""!important;display:block!important;position:absolute;left:-55%;right:-55%;top:-12%;bottom:-6%;z-index:-1;pointer-events:none;border:0!important;height:auto!important;
  background:radial-gradient(ellipse 50% 55% at 50% 50%,rgba(255,226,150,.85),rgba(255,200,90,.35) 45%,transparent 72%);animation:aura 2.6s ease-in-out infinite}
.h-book.new::after,.spine.book.new::after{content:""!important;display:block!important;position:absolute;left:0;right:0;top:0;bottom:0;z-index:2;pointer-events:none;border:0!important;height:auto!important;opacity:1!important;
  background:linear-gradient(115deg,transparent 35%,rgba(255,244,210,.5) 48%,transparent 60%) no-repeat;background-size:100% 250%;animation:shine 3.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes aura{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes shine{0%{background-position:0 160%}60%,100%{background-position:0 -160%}}
.h-book.new .n::before{content:"NEW";position:absolute;left:50%;top:calc(-1 * var(--bw) * 1.6 - 22px);transform:translateX(-50%);font:700 9px/1 'Noto Sans KR',sans-serif;letter-spacing:.12em;color:#2a1b11;background:linear-gradient(180deg,#fff1c2,#e3b75c);padding:3px 5px;border-radius:8px;box-shadow:0 0 10px rgba(255,214,140,.8);white-space:nowrap;text-shadow:none}
/* ═════ 최근 읽은 책: 숨 쉬듯 살짝 커졌다 작아짐 ═════ */
.h-book.recent:not(:hover):not(.sel),.spine.book.recent:not(:hover):not(.active){animation:breathe 2.8s ease-in-out infinite;transform-origin:50% 100%}
.h-book.recent.sel{animation:breatheH 2.8s ease-in-out infinite;transform-origin:50% 100%}
.spine.book.recent.active{animation:breatheS 2.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breatheH{0%,100%{transform:translateY(-10px) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
@keyframes breatheS{0%,100%{transform:translateY(-6px) scale(1)}50%{transform:translateY(-6px) scale(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.h-book.new::before,.h-book.new::after,.spine.book.new::before,.spine.book.new::after,.h-book.recent,.spine.book.recent{animation:none!important}}

/* ═════ 모든 책 보기 (옆으로 넘어가는 큰 책장) ═════ */
#hall{transition:opacity .4s ease,filter .4s ease,transform .6s cubic-bezier(.6,0,.2,1)}
body.all-on #hall{transform:translateX(-100%)}
#allShelf{position:fixed;inset:0;z-index:61;overflow:hidden auto;transform:translateX(100%);transition:transform .6s cubic-bezier(.6,0,.2,1);color:#f3e8d2;font-family:'Nanum Myeongjo',serif}
body.all-on #allShelf{transform:none}
.a-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 60% at 50% 0%,#1c2a5c,#0b1028 70%,#070a1c)}
.a-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:16px;padding:16px max(16px,4vw);background:linear-gradient(180deg,rgba(7,10,28,.95),rgba(7,10,28,.7) 70%,transparent)}
.a-back,.h-all,.s-all{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#f1d58f;background:rgba(8,12,34,.6);border:1px solid rgba(217,189,127,.45);border-radius:20px;padding:7px 14px;cursor:pointer;transition:background .2s}
.a-back:hover,.h-all:hover,.s-all:hover{background:rgba(217,189,127,.15)}
.a-title{flex:1;text-align:center}
.a-title small{display:block;font-family:Georgia,serif;font-size:11px;letter-spacing:.4em;color:#d9bd7f;text-transform:uppercase}
.a-title b{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:.12em;background:linear-gradient(180deg,#fff3cf,#e9c77a 50%,#b88a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.a-count{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#d9bd7f;min-width:90px;text-align:right}
.a-case{max-width:1180px;margin:10px auto 60px;padding:26px max(16px,3vw) 30px;border-radius:14px;
  background:linear-gradient(180deg,rgba(14,22,58,.85),rgba(8,12,34,.92));box-shadow:inset 0 0 0 2px #b8934d,inset 0 0 0 7px rgba(8,12,34,.9),inset 0 0 0 8px rgba(217,189,127,.5),0 30px 80px rgba(0,0,0,.6)}
.a-row{margin-bottom:22px}
.a-label{display:flex;align-items:baseline;gap:10px;margin:0 6px 8px;font-size:15px;color:#f1d58f}
.a-label small{font-size:12px;color:#d9bd7f;font-family:'Noto Sans KR',sans-serif}
.a-label em{margin-left:auto;font-style:normal;font-size:12px;color:#b9a283;font-family:'Noto Sans KR',sans-serif}
.a-shelf{--bw:38px;--gap:8px;display:flex;flex-wrap:wrap;gap:22px var(--gap);align-items:flex-end;padding:18px 14px 0;min-height:200px;
  background:repeating-linear-gradient(180deg,transparent 0 200px,#6b4a26 200px 203px,#e3c47d 203px 205px,#8a6526 205px 211px,rgba(0,0,0,.45) 211px 218px,transparent 218px 222px);background-position:0 18px}
.a-book{width:var(--bw);height:200px!important;flex:none}
.a-tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;font:500 12px/1.4 'Noto Sans KR',sans-serif;color:#fff6e3;background:rgba(8,12,34,.92);padding:5px 10px;border-radius:12px;border:1px solid rgba(217,189,127,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.a-book:hover .a-tip{opacity:1}
@media (max-width:640px){.a-shelf{--bw:30px;--gap:6px;background:repeating-linear-gradient(180deg,transparent 0 140px,#6b4a26 140px 143px,#e3c47d 143px 145px,#8a6526 145px 150px,rgba(0,0,0,.45) 150px 156px,transparent 156px 162px);background-position:0 18px;gap:22px var(--gap)}
  .a-book{height:140px!important}.a-book .sk{border-width:calc(var(--bw)*1.1) 0 calc(var(--bw)*.75) 0}
  .a-book .n{top:calc(var(--bw)*1.1 + 4px)!important;font-size:10px!important}.a-book .t{top:calc(var(--bw)*1.1 + 18px)!important;bottom:calc(var(--bw)*.75 + 4px)!important;font-size:10.5px!important}
  .a-count{min-width:0}.a-title small{letter-spacing:.2em}}
.h-all{margin-top:6px;opacity:0;animation:rise .6s .55s forwards}
.s-all{display:block;width:calc(100% - 4px);margin:14px 2px 0;text-align:center}
@media (prefers-reduced-motion:reduce){#hall,#allShelf{transition:none}}

/* 서고 아치를 위아래로 더 길게 → 책 위 여유 */
.h-niche{aspect-ratio:1525/960!important}
@media (min-width:900px){.h-niche{width:min(660px,60vw)!important}}
/* 선택 카드 글자 키우고 굵게 */
.h-pick small{font-size:16px!important;font-weight:700!important;letter-spacing:.08em!important}
@media (min-width:900px){.h-pick b{font-size:22px;font-weight:800!important}.h-pick{padding:22px 22px!important;gap:14px!important}.h-pick img{width:130px;height:195px}}
@media (max-width:899px){.h-pick b{font-size:17px;font-weight:800!important}}
/* 모든 책: 선반 판이 책 아래에만 */
.a-shelf{padding:0 14px 22px!important;margin-top:28px;background-position:0 0!important}

.a-shelf{background:none!important;display:block!important;padding:0!important;margin-top:0!important;min-height:0!important}
.a-line{display:flex;gap:0 var(--gap);align-items:flex-end;padding:30px 14px 0;margin-bottom:14px;position:relative;
  border-bottom:6px solid #8a6526;box-shadow:0 8px 10px -4px rgba(0,0,0,.6);
  background:linear-gradient(180deg,transparent calc(100% - 3px),#e3c47d calc(100% - 3px))}
.a-line .a-book{height:200px!important}
@media (max-width:640px){.a-line .a-book{height:140px!important}}

/* ═════ 왼쪽 책장: 메인 서고와 같은 남색·금장 톤 ═════ */
aside{background:radial-gradient(ellipse 120% 60% at 50% 0%,#1c2a5c,#0e1638 55%,#080c22)!important;box-shadow:inset -1px 0 0 rgba(217,189,127,.35),6px 0 24px rgba(0,0,0,.6)!important}
aside::before{opacity:1!important;background:radial-gradient(1px 1px at 20% 12%,rgba(255,236,180,.7),transparent 60%),radial-gradient(1px 1px at 70% 30%,rgba(255,236,180,.5),transparent 60%),radial-gradient(1.5px 1.5px at 40% 60%,rgba(255,236,180,.45),transparent 60%),radial-gradient(1px 1px at 85% 80%,rgba(255,236,180,.5),transparent 60%),radial-gradient(1px 1px at 12% 90%,rgba(255,236,180,.4),transparent 60%)!important}
.brand h1{background:linear-gradient(180deg,#fff3cf,#e9c77a 50%,#b88a3c);-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.brand p{color:#d9bd7f!important}
.brand::after{content:"✦";display:block;margin:8px auto 0;width:60%;font-size:9px;line-height:9px;color:#f1d58f;background:linear-gradient(90deg,transparent,#b8934d 30%,transparent 46%,transparent 54%,#b8934d 70%,transparent) center/100% 1px no-repeat}
.cabinet{background:linear-gradient(180deg,#0f1a45,#0a1233)!important;border-radius:60px 60px 6px 6px/26px 26px 6px 6px!important;padding:22px 12px 0!important;
  box-shadow:inset 0 0 0 2px #b8934d,inset 0 0 0 6px rgba(10,18,51,.95),inset 0 0 0 7px rgba(217,189,127,.55),inset 0 18px 30px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.55)!important}
.shelf::after{background:linear-gradient(180deg,#f1d58f,#b8934d 30%,#6b4a26 70%,#3a2814)!important;height:7px!important;bottom:-7px!important;left:6px!important;right:6px!important;border-radius:1px;box-shadow:0 4px 8px rgba(0,0,0,.6),0 0 10px rgba(255,214,140,.25)!important}
.shelf:last-child{margin-bottom:14px!important}
.cur,.bmbox{background:rgba(8,12,34,.55)!important;border:1px solid rgba(217,189,127,.32)!important;border-radius:8px!important;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.cur small,.bmhead{color:#d9bd7f!important}
.cur b{color:#f7ecd4!important}
#bmList li{border-top-color:rgba(217,189,127,.12)!important}
.s-all{background:linear-gradient(180deg,rgba(241,213,143,.12),rgba(184,147,77,.08))!important}
.side-foot{color:#9fa6c4!important}
.handle{background:linear-gradient(90deg,#16224f,#0b1233)!important;border-left:1px solid rgba(217,189,127,.45)!important;color:#f1d58f!important}

.ribbon{width:44px!important;height:134px!important;top:-8px!important;background:none!important;clip-path:none!important;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))!important}
.ribbon i{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.ribbon .rf{background:var(--rc);-webkit-mask:var(--rbT) center/100% 100% no-repeat;mask:var(--rbT) center/100% 100% no-repeat}
.ribbon .rt{background-image:var(--rbT);mix-blend-mode:overlay;opacity:.95}
.ribbon .rg{background-image:var(--rbG)}
.ribbon.on{animation:rbDrop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes rbDrop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}

/* ═════ 출간 예정 ═════ */
.h-book.soon,.spine.book.soon{filter:grayscale(.55) brightness(.75)!important}
.h-book.soon:hover,.spine.book.soon:hover{filter:grayscale(.3) brightness(.95)!important}
#soonPop{position:fixed;left:50%;top:50%;z-index:200;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;text-align:center;
  padding:22px 34px;border-radius:14px;background:rgba(8,12,34,.92);border:1px solid rgba(217,189,127,.55);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(255,214,140,.15);transition:opacity .3s,transform .3s}
#soonPop.on{opacity:1;transform:translate(-50%,-50%)}
#soonPop small{display:block;font:500 13px 'Noto Sans KR',sans-serif;color:#d9bd7f;letter-spacing:.08em}
#soonPop b{display:block;margin:6px 0 4px;font:800 30px 'Nanum Myeongjo',serif;letter-spacing:.06em;background:linear-gradient(180deg,#fff3cf,#e9c77a 50%,#b88a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
#soonPop span{font:400 13px 'Noto Sans KR',sans-serif;color:#f3e8d2}
.soonCover{width:120px;height:180px;flex:none;border-radius:3px;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#1c2a5c,#0b1028);border:1px solid rgba(217,189,127,.4);
  font:800 18px/1.3 'Nanum Myeongjo',serif;color:#e9c77a;box-shadow:0 6px 16px rgba(0,0,0,.5)}
@media (max-width:899px){.soonCover{width:56px;height:84px;font-size:10px}}

/* 선택 카드 폭 고정 → 책에 마우스를 올려도 서고가 흔들리지 않음 */
@media (min-width:900px){.h-pick{width:330px!important;min-width:330px!important;max-width:330px!important}.h-pick>div:last-child{width:100%;min-width:0}}

/* 책을 선반 위에 딱 붙임: 선택·마우스 올림은 들어 올리지 않고 빛으로 표시, 바닥 그림자 */
#hShelves .h-book.has.sel{transform:none!important}
#hShelves .h-book.has{transition:transform .3s cubic-bezier(.3,1.5,.5,1)!important}
#hShelves .h-book.has:hover{transform:translateY(-12px)!important;animation:none!important}
#hShelves .h-book.has.sel .sk{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,214,140,.7))}
#hShelves .h-book.recent.sel{animation:breathe 2.8s ease-in-out infinite!important}
#hShelves .h-book.has:hover .sk{filter:brightness(1.18)}
#hShelves .h-book>.sk{box-shadow:none!important}
#hShelves .h-book::marker{content:none}
#hShelves .h-shelf{padding-bottom:0}
#hShelves .h-book{margin-bottom:0!important}
#hShelves .h-book .sk::after{content:"";position:absolute;left:-15%;right:-15%;bottom:-5px;height:8px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),transparent 70%)}

/* ═════ 오른쪽 가장자리 '비밀의 서고 입장' 유령 문 ═════ */
.h-all{position:fixed!important;right:0;top:50%;z-index:5;margin:0!important;width:64px;height:min(300px,46vh);padding:0!important;transform:translateY(-50%);
  display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  border-radius:40px 0 0 40px!important;border:1px solid rgba(217,189,127,.4)!important;border-right:0!important;
  background:linear-gradient(270deg,rgba(28,42,92,.55),rgba(8,12,34,.15))!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  color:#f1d58f;opacity:0;animation:haIn .8s .6s forwards,haGhost 4.2s 1.4s ease-in-out infinite!important;transition:width .35s ease,background .35s ease}
.h-all:hover{width:78px;animation:haIn .1s forwards!important;opacity:1;background:linear-gradient(270deg,rgba(40,58,120,.75),rgba(8,12,34,.3))!important}
.ha-glow{position:absolute;inset:-30px -10px -30px -40px;z-index:-1;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse at 80% 50%,rgba(255,214,140,.28),transparent 65%);animation:haGlow 4.2s ease-in-out infinite}
.ha-txt{writing-mode:vertical-rl;text-orientation:upright;font:700 15px 'Nanum Myeongjo',serif;letter-spacing:.18em;text-shadow:0 0 10px rgba(255,214,140,.6),0 1px 3px #000}
.ha-txt b{display:inline-block;margin-top:10px;color:#fff3cf;font-weight:800}
.ha-arr{font:400 22px/1 Georgia,serif;animation:haArr 1.8s ease-in-out infinite}
@keyframes haIn{to{opacity:.85}}
@keyframes haGhost{0%,100%{opacity:1}40%{opacity:.12}55%{opacity:.18}}
@keyframes haGlow{0%,100%{opacity:1;transform:scale(1.15)}50%{opacity:.1;transform:scale(.85)}}
@keyframes haArr{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (max-width:640px){.h-all{width:46px;height:220px}.ha-txt{font-size:13px}.h-all:hover{width:52px}}


/* ═════ 깊은 서가: 제목·왼쪽 유령 문 ═════ */
.a-top{justify-content:center;padding-top:26px!important}
.a-title em{display:block;margin-top:4px;font:400 13px 'Noto Sans KR',sans-serif;font-style:normal;color:#d9bd7f;letter-spacing:.12em}
.a-title .a-count{display:block;min-width:0;text-align:center;margin-top:6px;font-size:12px;color:#9fa6c4}
.a-back{position:fixed!important;left:0;top:50%;z-index:6;width:64px;height:min(260px,40vh);padding:0!important;transform:translateY(-50%);
  display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  border-radius:0 40px 40px 0!important;border:1px solid rgba(217,189,127,.4)!important;border-left:0!important;
  background:linear-gradient(90deg,rgba(28,42,92,.55),rgba(8,12,34,.15))!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  color:#f1d58f;opacity:0;animation:haIn .8s .5s forwards,haGhost 4.2s 1.3s ease-in-out infinite!important;transition:width .35s ease,background .35s ease}
.a-back:hover{width:78px;animation:haIn .1s forwards!important;opacity:1;background:linear-gradient(90deg,rgba(40,58,120,.75),rgba(8,12,34,.3))!important}
.a-back .ha-glow{inset:-30px -40px -30px -10px;background:radial-gradient(ellipse at 20% 50%,rgba(255,214,140,.28),transparent 65%)}
.a-back .ha-arr{animation:haArrL 1.8s ease-in-out infinite}
@keyframes haArrL{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
.a-case{margin-left:max(80px,auto)!important}
@media (max-width:640px){.a-back{width:40px;height:180px}.a-back .ha-txt{font-size:12px}.a-case{margin-left:46px!important;margin-right:6px!important}}


/* 유령 문: 더 또렷하게 깜빡임(움직임이 아니라 밝기 변화라 '애니메이션 줄이기' 설정에서도 유지) */
.ha-glow{inset:-60px -20px -60px -80px!important;background:radial-gradient(ellipse at 80% 50%,rgba(255,214,140,.5),transparent 65%)!important}
.a-back .ha-glow{inset:-60px -80px -60px -20px!important;background:radial-gradient(ellipse at 20% 50%,rgba(255,214,140,.5),transparent 65%)!important}
.h-all,.a-back{box-shadow:0 0 24px rgba(255,214,140,.25)}
@media (prefers-reduced-motion:reduce){
  #hall .h-inner .h-all,#allShelf .a-back{animation:haGhost 4.2s ease-in-out infinite!important}
  #hall .h-inner .ha-glow,#allShelf .ha-glow{animation:haGlowR 4.2s ease-in-out infinite!important}
  .ha-arr{animation:none!important}
  @keyframes haGlowR{0%,100%{opacity:1}50%{opacity:.1}}
}
/* 휴대폰: 문을 화면 위쪽 가로 버튼으로 */
@media (max-width:640px){
  .h-all{top:max(10px,env(safe-area-inset-top))!important;right:10px!important;transform:none!important;width:auto!important;height:auto!important;
    flex-direction:row!important;gap:6px!important;padding:7px 12px 7px 14px!important;border-radius:20px!important;border:1px solid rgba(217,189,127,.5)!important}
  .h-all:hover{width:auto!important}
  .a-back{top:max(10px,env(safe-area-inset-top))!important;left:10px!important;transform:none!important;width:auto!important;height:auto!important;
    flex-direction:row!important;gap:6px!important;padding:7px 14px 7px 12px!important;border-radius:20px!important;border:1px solid rgba(217,189,127,.5)!important}
  .a-back:hover{width:auto!important}
  .ha-txt{writing-mode:horizontal-tb!important;letter-spacing:.06em!important;font-size:13px!important}
  .ha-txt b{margin:0 0 0 4px!important}
  .a-back .ha-txt b{margin:0!important}
  .ha-arr{font-size:18px!important}
  .ha-glow{inset:-20px!important}
  .a-case{margin-left:6px!important}
  .a-top{padding-top:52px!important}
}

/* ═════ 원형 떠 있는 버튼(챗봇 버튼 느낌) ═════ */
.h-niche .h-all,.a-wrap .a-back{position:absolute!important;inset:auto!important;transform:none!important;width:64px!important;height:64px!important;padding:0!important;
  border-radius:50%!important;border:1.5px solid rgba(241,213,143,.75)!important;display:grid!important;place-items:center;gap:0!important;
  background:radial-gradient(circle at 35% 30%,#2c3f86,#121c4a 65%,#0a1030)!important;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 22px rgba(255,214,140,.45),inset 0 0 0 4px rgba(10,16,48,.9),inset 0 0 0 5px rgba(217,189,127,.35)!important;
  color:#f6dc98;z-index:8;cursor:pointer;opacity:1;animation:fabGhost 2s ease-in-out infinite!important;transition:transform .25s}
@keyframes fabGhost{0%,100%{opacity:1}45%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.h-niche .h-all,.a-wrap .a-back{animation:fabGhost 2s ease-in-out infinite!important}}
.h-niche .h-all{top:-22px!important;right:-22px!important}
.a-wrap{position:relative;max-width:1180px;margin:10px auto 60px}
.a-wrap .a-case{margin:0!important;max-width:none}
.a-wrap .a-back{top:-22px!important;left:-22px!important}
.h-niche .h-all:hover,.a-wrap .a-back:hover{animation:none!important;opacity:1;transform:scale(1.08)!important}
.fab-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,214,140,.7))}
.fab-lb{position:absolute;top:50%;white-space:nowrap;font:700 13px 'Noto Sans KR',sans-serif;color:#fff3cf;padding:6px 12px;border-radius:14px;
  background:rgba(8,12,34,.9);border:1px solid rgba(217,189,127,.5);box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.h-all .fab-lb{right:calc(100% + 10px);transform:translate(6px,-50%)}
.a-back .fab-lb{left:calc(100% + 10px);transform:translate(-6px,-50%)}
.h-all:hover .fab-lb,.a-back:hover .fab-lb{opacity:1;transform:translate(0,-50%)}
.h-niche .ha-glow,.a-wrap .ha-glow{inset:-26px!important;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.45),transparent 65%)!important}
/* 휴대폰: 작게, 이름표는 늘 보이게 */
@media (max-width:640px){
  .h-niche .h-all,.a-wrap .a-back{width:50px!important;height:50px!important;top:-16px!important}
  .h-niche .h-all{right:-6px!important}.a-wrap .a-back{left:-6px!important}
  .fab-ic svg{width:22px;height:22px}
  .fab-lb{top:auto;bottom:calc(100% + 6px);font-size:11px;padding:4px 9px;opacity:1}
  .h-all .fab-lb{right:0;transform:none}.a-back .fab-lb{left:0;transform:none}
  .h-all:hover .fab-lb,.a-back:hover .fab-lb{transform:none}
  .a-wrap{margin:30px 8px 40px}
  .a-top{padding-top:22px!important}
}

/* 원형 버튼 위치 재정의: 화면 끝 고정 */
#hall>.h-all,#allShelf>.a-back{position:absolute!important;inset:auto!important;top:120px;transform:none!important}
#hall>.h-all{right:max(18px,2.5vw)!important}
#allShelf>.a-back{left:max(18px,2.5vw)!important}
#hall>.h-all,#allShelf>.a-back{width:64px!important;height:64px!important;padding:0!important;border-radius:50%!important;border:1.5px solid rgba(241,213,143,.75)!important;display:grid!important;place-items:center;
  background:radial-gradient(circle at 35% 30%,#2c3f86,#121c4a 65%,#0a1030)!important;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 22px rgba(255,214,140,.45),inset 0 0 0 4px rgba(10,16,48,.9),inset 0 0 0 5px rgba(217,189,127,.35)!important;
  color:#f6dc98;z-index:8;opacity:1;animation:fabGhost 2s ease-in-out infinite!important}
#hall>.h-all:hover,#allShelf>.a-back:hover{animation:none!important;transform:scale(1.08)!important}
#hall>.h-all .ha-glow,#allShelf>.a-back .ha-glow{inset:-26px!important;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.45),transparent 65%)!important}
#hall>.h-all .fab-lb{right:calc(100% + 10px);left:auto}
#allShelf>.a-back .fab-lb{left:calc(100% + 10px);right:auto}
@media (max-width:640px){
  #hall>.h-all,#allShelf>.a-back{width:50px!important;height:50px!important}
  #hall>.h-all{right:12px!important}#allShelf>.a-back{left:12px!important}
  #hall>.h-all .fab-lb,#allShelf>.a-back .fab-lb{top:50%;bottom:auto;opacity:1}
  #hall>.h-all .fab-lb{top:calc(100% + 4px);right:50%;transform:translateX(50%);font-size:10px;padding:2px 7px}
  #allShelf>.a-back .fab-lb{left:calc(100% + 8px);transform:translateY(-50%)}
  .a-wrap{margin-top:70px!important}
}

/* 깊은 서가: 돌아가기 버튼은 제목 줄 왼쪽에 고정(스크롤해도 따라옴, 공간 차지 없음) */
#allShelf>.a-back{position:fixed!important;top:44px!important}
.a-wrap{margin-top:10px!important}
@media (max-width:640px){#allShelf>.a-back{top:30px!important}#allShelf>.a-back .fab-lb{display:none}.a-top{padding-left:60px!important;padding-right:60px!important}.a-wrap{margin-top:6px!important}}

/* 왼쪽 책장: 제목 아래 '전체 책 보기', 최근 본 4권 한 줄 */
.s-all{margin:4px auto 16px!important;width:auto!important;display:block!important;padding:6px 16px!important}
.side-foot{margin-top:16px}
/* 스크롤바 숨김(스크롤은 그대로) */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

/* 왼쪽 책장: 메인 서고와 같은 효과(마우스 올리면 들림, 읽는 책은 금빛) */
.spine.book{transition:transform .3s cubic-bezier(.3,1.5,.5,1),filter .3s!important}
.spine.book:hover{transform:translateY(-12px)!important;animation:none!important;filter:none!important}
.spine.book:hover .sk{filter:brightness(1.18)}
.spine.book.active{transform:none!important;filter:none!important}
.spine.book.active .sk{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,214,140,.7))}
.spine.book.recent.active{animation:breathe 2.8s ease-in-out infinite!important}
.spine.book .sk::after{content:"";position:absolute;left:-15%;right:-15%;bottom:-5px;height:8px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),transparent 70%)}

/* ═════ 책 뽑기 효과(세 책장 공통): 6px 들림 + 4% 확대 + 그림자 넓어짐 ═════ */
#hShelves .h-book.has:hover,.spine.book:hover,.a-book:hover{transform:translateY(-12px)!important;transform-origin:50% 100%;z-index:3;animation:none!important}
#hShelves .h-book.has,.spine.book,.a-book{transition:transform .3s cubic-bezier(.3,1.4,.5,1)!important}
#hShelves .h-book .sk::after,.spine.book .sk::after,.a-book .sk::after{transition:transform .3s,opacity .3s}
#hShelves .h-book.has:hover .sk::after,.spine.book:hover .sk::after,.a-book:hover .sk::after{transform:translateY(6px) scaleX(1.5);opacity:.85}
.a-book .sk::after{content:"";position:absolute;left:-15%;right:-15%;bottom:-5px;height:8px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),transparent 70%)}
#hShelves .h-book.has:hover .sk,.spine.book:hover .sk,.a-book:hover .sk{filter:brightness(1.15) drop-shadow(0 6px 10px rgba(0,0,0,.55))}

.a-case{background:linear-gradient(180deg,rgba(14,22,58,.72),rgba(8,12,34,.82))!important;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.a-top{background:linear-gradient(180deg,rgba(7,10,28,.85),rgba(7,10,28,.4) 70%,transparent)!important}
.a-title small,.a-title em,.a-title .a-count{text-shadow:0 1px 6px #000}
#hall,#allShelf{-webkit-user-select:none;user-select:none}

/* 책갈피: 각 페이지 바깥쪽 위 모서리에서 페이지 폭의 일정 비율만큼 안쪽 */
.ribbon{--rw:clamp(26px,calc(var(--pw) * .085),46px);width:var(--rw)!important;height:calc(var(--rw) * 3.05)!important;top:calc(var(--rw) * -.18)!important}
.ribbon[data-slot="L"]{left:calc(var(--pw) * .06)!important}
.ribbon[data-slot="R"]{left:calc(var(--pw) * 2 - var(--pw) * .06 - var(--rw))!important}
.book.single .ribbon[data-slot="R"]{left:calc(var(--pw) * .94 - var(--rw))!important}

/* 게이지 옆 % 강조 */
.nav-handle em#hPct{font-weight:700;color:#f1d58f;min-width:30px;text-align:left}
.controls .pg{min-width:44px!important;font-weight:700;color:#f1d58f!important}

/* ═════ 밤 독서 모드: 기기가 다크모드면 자동, 메뉴의 달 버튼으로 직접 전환 ═════ */
body.night .page img,body.night .cface b,body.night .leaf .face img{filter:invert(.9) hue-rotate(180deg) sepia(.25) brightness(.92) contrast(.92)}
body.night .page,body.night .cface,body.night .cface b,body.night .leaf .face{background-color:#1d1a16}
body.night .page.L::after{background:linear-gradient(270deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.56) 8%,rgba(0,0,0,.52) 15%,rgba(0,0,0,.45) 30%,rgba(0,0,0,.26) 58%,transparent 100%)}
body.night .page.R::after{background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.36) 30%,transparent)}
#bNight.on{color:#fff3cf;background:rgba(216,180,106,.2)}
#bNight.on svg{fill:currentColor}

/* ═════ CHEONVERSE로 돌아가기(왼쪽 위, 천버스 파비콘) ═════ */
#hall>.cv-btn{position:absolute;top:max(18px,2.2vw);left:max(18px,2.5vw);z-index:8;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 85%,#2a2114,#000 75%);border:1.5px solid rgba(201,164,92,.6);
  box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 16px rgba(201,164,92,.3),inset 0 0 0 3px rgba(0,0,0,.8),inset 0 0 0 4px rgba(201,164,92,.25);
  opacity:.75;transition:opacity .3s,transform .25s,box-shadow .3s;text-decoration:none}
#hall>.cv-btn:hover{opacity:1;transform:scale(1.08);box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 24px rgba(255,214,140,.55),inset 0 0 0 3px rgba(0,0,0,.8),inset 0 0 0 4px rgba(201,164,92,.4)}
#hall>.cv-btn .cv-ic{width:40px;height:40px}
#hall>.cv-btn .fab-lb{left:calc(100% + 10px);right:auto;transform:translate(-6px,-50%)}
#hall>.cv-btn:hover .fab-lb{opacity:1;transform:translate(0,-50%)}
@media (max-width:640px){#hall>.cv-btn{width:42px;height:42px;top:12px;left:12px}#hall>.cv-btn .cv-ic{width:32px;height:32px}#hall>.cv-btn .fab-lb{display:none}}


/* 강제 다크모드(삼성 인터넷 등) 대응: 글자 그라데이션(배경 잘라 쓰기)은 어둡게 뒤집히므로 단색 금빛 글자 + 그림자로 */
.h-title,.a-title b,.brand h1,#soonPop b{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;
  color:#f3d48a!important;-webkit-text-fill-color:#f3d48a!important;text-shadow:0 1px 0 #7a5a24,0 2px 10px rgba(0,0,0,.85),0 0 24px rgba(255,214,140,.35)!important;filter:none!important}

/* 삼성 인터넷 어둡게 모드: 브라우저가 책장 그림을 먼저 뒤집으므로 밤·낮 필터를 반대로 */
body.samdark .page img,body.samdark .cface b,body.samdark .leaf .face img{filter:invert(1) hue-rotate(180deg)!important}
body.samdark.night .page img,body.samdark.night .cface b,body.samdark.night .leaf .face img{filter:none!important}
body.night .cface b.nb,body.samdark .cface b.nb{filter:none!important}
body.night .cface b.nb{background-color:#1d1a16!important}

/* 캔버스 넘김: 밤 모드 색 필터는 그림 캔버스에만 */
.cleaf canvas{pointer-events:none}
</style>
