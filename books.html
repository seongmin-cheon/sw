    <button id="bMode" title="한 쪽 / 두 쪽 보기"><svg viewBox="0 0 24 24"><path d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg></button>
    <button id="bNight" title="밤 독서 모드"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button id="bFull" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="toast" id="toast"></div>
  <div class="nav-handle" id="navHandle">▾ <button id="hShelf" title="책장"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 5l4 15M3 20h18"/></svg></button><span class="hg"><i id="hBar"></i><span id="hDots"></span></span><em id="hPct">0%</em><span class="hbmk" id="hBmk"></span><b id="hPg">– / –</b><span class="hbtns"><button id="hBm" class="bm" title="책갈피 (B)"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button><button id="hMode" title="한 쪽 / 두 쪽 보기"><svg viewBox="0 0 24 24"><path d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg></button><button id="hFull" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></span></div>
  <div class="hint">← → 키 · 페이지 클릭 · 스와이프로 넘기기</div>
</main>

<script>
/* books.json을 못 읽을 때(파일을 직접 열었을 때 등) 쓰는 기본값 */
const FALLBACK={library:{name:"비밀의 서고",en:"The Secret Archive",quote:["세상의 모든 이야기가 잠든 곳,","책을 펼치는 자에게만","문이 열린다."]},
  series:[{id:"genesis",title:"창세비록",subtitle:"뫼비우스의 서",volumes:[{no:1,title:"실버 애로우와 제국의 그림자",spine:"실버 애로우",cover:"books/vol01_cover.jpg",files:["books/vol01_a.pdf","books/vol01_b.pdf"]}]}]};
/* books.json → 서고(S.lib)·작품(S.series)·책 목록(S.books) */
function normalize(c){
  if(c.volumes&&!c.series)c={library:FALLBACK.library,series:[{id:"genesis",title:c.series||"창세비록",subtitle:c.subtitle,volumes:c.volumes}]};
  S.lib=Object.assign({},FALLBACK.library,c.library||{});S.series=c.series||[];S.books=[];
  S.series.forEach((sr,si)=>{(sr.volumes||[]).sort((a,b)=>a.no-b.no).forEach(v=>{
    S.books.push(Object.assign({},v,{id:sr.id+'-'+v.no,sr,color:v.color||sr.color||LEATHER[si%LEATHER.length]}))})});
  /* 예전 저장 위치(pos_1) 이어받기 */
  if(store.get('pos_genesis-1')==null&&store.get('pos_1')!=null)store.set('pos_genesis-1',store.get('pos_1'));
}
const bookById=id=>S.books.find(b=>b.id===id);
/* 출간 예정(soon) 책: 누르면 Coming Soon 안내 */
function soonMsg(v){let e=document.getElementById('soonPop');if(!e){e=document.createElement('div');e.id='soonPop';document.body.appendChild(e)}
  e.innerHTML=`<small>${esc(v.sr.title)} · 제 ${v.no} 권${v.title?' · '+esc(v.title):''}</small><b>Coming Soon</b><span>아직 서고에 도착하지 않은 이야기예요</span>`;
  e.classList.remove('on');void e.offsetWidth;e.classList.add('on');clearTimeout(soonMsg.t);soonMsg.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* 책이 ALL_MIN권 이상이면: 메인 서고는 최근 읽은 책+신간, 왼쪽 책장은 최근 읽은 책, '모든 책 보기' 사용 */
const ALL_MIN=6;
const manyBooks=()=>S.books.filter(b=>!b.soon).length>=(S.lib.allShelfMin||ALL_MIN);
function recentBooks(){let r=store.get('recent');if(!r){const l=store.get('lastBook');r=l?[l]:[]}return r.map(bookById).filter(Boolean)}
function newestBooks(){return S.books.filter(b=>b.added&&!b.soon).sort((a,b)=>Date.parse(b.added)-Date.parse(a.added))}
function hallList(){if(!manyBooks())return S.books;
  const out=[];recentBooks().slice(0,3).forEach(b=>out.push(b));
  let k=0;newestBooks().forEach(b=>{if(k<2&&!out.includes(b)){out.push(b);k++}});
  for(const b of S.books){if(out.length>=5)break;if(!out.includes(b))out.push(b)}return out}
function sideList(){const r=recentBooks().filter(b=>!b.soon);return (r.length?r:(newestBooks().length?newestBooks():S.books.filter(b=>!b.soon))).slice(0,4)}
/* 신간: 올린 날짜(added)로부터 30일 이내 */
const NEW_DAYS=30,isNew=b=>!!b.added&&(Date.now()-Date.parse(b.added))<NEW_DAYS*864e5;
/* 책등 색: 기본 그림(적갈색)을 작품 색의 색상으로 돌림 */
function skHue(c){const m=/^#?([0-9a-f]{6})$/i.exec(c||'');if(!m)return'';const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(d<.05)return'filter:saturate(.15)';let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=h*60;if(h<0)h+=360;const rot=Math.round((h-2+360)%360);return rot<8||rot>352?'':`filter:hue-rotate(${rot}deg)`}
const roman=n=>{let r='';[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,c])=>{while(n>=v){r+=c;n-=v}});return r};
/* 한 줄에 들어가도록 글자 크기 자동 축소 */
function fitLine(el,max,min){if(document.fonts&&!fitLine.w){fitLine.w=1;document.fonts.ready.then(()=>{const b=document.querySelector('#hPick b');if(b)fitLine(b,innerWidth>=900?22:17,12)})}el.style.fontSize=max+'px';requestAnimationFrame(()=>{let f=max;while(el.scrollWidth>el.clientWidth+1&&f>min){f-=.5;el.style.fontSize=f+'px'}})}
const esc=t=>String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const LEATHER=["#6e1f1c","#1f3b2c","#22304f","#5a2a48","#4d3416","#2d4648","#5e1d2a","#2f2a52","#3d4a1e","#6a3a18"];
let RATIO=430.92/637.92;

pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={cfg:null,vol:null,map:[],N:0,spread:0,single:false,busy:false,cache:new Map(),gen:0,renderW:0};

/* ── 책장(뷰어 옆) : 작품별 칸 ── */
function buildShelf(){
  /* 작품 구분 없이 모든 책을 차례로 꽂음(작품 순 → 권 순), 한 칸에 5권 */
  const cab=$('cabinet');cab.innerHTML='';
  $('sName').textContent=S.lib.name;$('sSub').textContent=S.lib.en||'';
  const list=sideList();
  for(let r=0;r<Math.max(1,Math.ceil(list.length/5));r++){
    const row=document.createElement('div');row.className='shelf';
    list.slice(r*5,r*5+5).forEach(b=>{
      const sr=b.sr,el=document.createElement('div'),h=126+((b.no*37)%13),t=sr.title;
      el.style.height=(h+20)+'px';el.className='spine book'+(b.soon?' soon':'')+(S.vol&&S.vol.id===b.id?' active':'')+(isNew(b)?' new':'')+(b.id===store.get('lastBook')?' recent':'');el.dataset.id=b.id;el.style.setProperty('--c',b.color);
      el.innerHTML=`<i class="sk" style="${skHue(b.color)}"></i><div class="no">${roman(b.no)}</div><div class="t" style="--fs:${Math.min(11,Math.max(7,(h-60)/[...t].length)).toFixed(1)}px">${esc(t)}</div>`;
      el.title=`${sr.title} ${b.no}권 · ${b.title}`;
      el.onclick=()=>{openVolume(b.id);document.body.classList.remove('drawer')};
      row.appendChild(el);
    });
    cab.appendChild(row);
  }
}

/* ── 권 열기 ── */
async function openVolume(id){
  const v=bookById(id);if(!v)return;if(v.soon){soonMsg(v);return}const no=v.no,sr=v.sr;
  const gen=++S.gen;
  document.querySelectorAll('.spine.book').forEach(s=>s.classList.toggle('active',s.dataset.id===id));
  $('curCover').src=v.cover||'';$('curCover').style.display=v.cover?'':'none';$('curNo').textContent=`${sr.title} · 제 ${no} 권`;$('curTitle').textContent=v.title;fitLine($('curTitle'),13.5,10);
  $('vNo').innerHTML=`${esc(sr.title)}<em>(${no}권)</em>`;$('vTitle').textContent=v.title;peek('show-title',2000);MAIN.classList.remove('show-ui');document.title=`${sr.title} ${no}권 — ${v.title} | ${S.lib.name}`;
  const L=$('loader');L.classList.remove('hide');$('lCover').src=v.cover||'';$('lCover').style.display=v.cover?'':'none';
  $('lMsg').textContent='책을 펼치는 중…';$('lBar').style.width='5%';
  S.cache.forEach(u=>URL.revokeObjectURL(u));S.cache.clear();S.map=[];S.N=0;
  try{
    const prog=new Array(v.files.length).fill(0);
    const docs=await Promise.all(v.files.map((f,i)=>{
      const t=pdfjsLib.getDocument({url:f,disableAutoFetch:true,rangeChunkSize:262144});
      t.onProgress=p=>{if(p.total){prog[i]=p.loaded/p.total;$('lBar').style.width=(5+90*prog.reduce((a,b)=>a+b)/prog.length)+'%'}};
      return t.promise;
    }));
    if(gen!==S.gen)return;
    docs.forEach(d=>{for(let i=1;i<=d.numPages;i++)S.map.push({d,i})});
    S.N=S.map.length;S.vol=v;
    try{const vp=(await docs[0].getPage(1)).getViewport({scale:1});RATIO=vp.width/vp.height}catch(e){}
    const saved=store.get('pos_'+id)||1;
    store.set('lastBook',id);{const r=(store.get('recent')||[]).filter(x=>x!==id);r.unshift(id);store.set('recent',r.slice(0,10))}buildShelf();
    layout(true);goToPage(saved,true);
    $('lBar').style.width='100%';setTimeout(()=>{L.classList.add('hide');tapGuideOnce()},250);
  }catch(e){console.error(e);$('lMsg').textContent='PDF를 불러오지 못했습니다. (파일 경로·업로드 확인)'}
}

/* ── 쪽 렌더링 ── */
function renderPage(n){
  if(!n||n<1||n>S.N)return Promise.resolve(null);
  const key=n+'@'+S.renderW;
  if(S.cache.has(key))return Promise.resolve(S.cache.get(key));
  const job=(async()=>{
    const {d,i}=S.map[n-1];const pg=await d.getPage(i);
    const vp1=pg.getViewport({scale:1});const W=S.renderW,vp=pg.getViewport({scale:W*2/vp1.width});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await pg.render({canvasContext:cv.getContext('2d',{alpha:false}),viewport:vp}).promise;
    /* 2배로 그린 뒤 고품질 축소 → 화면 픽셀과 1:1로 표시 */
    const out=document.createElement('canvas');out.width=W;out.height=Math.round(cv.height*W/cv.width);
    const ox=out.getContext('2d',{alpha:false});ox.imageSmoothingEnabled=true;ox.imageSmoothingQuality='high';ox.drawImage(cv,0,0,out.width,out.height);
    cv.width=cv.height=0;
    const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.92));
    const url=URL.createObjectURL(blob);S.cache.set(key,url);
    if(S.cache.size>36){const k=S.cache.keys().next().value;URL.revokeObjectURL(S.cache.get(k));S.cache.delete(k)}
    return url;
  })();
  S.cache.set(key,job);
  job.then(u=>S.cache.set(key,u)).catch(()=>S.cache.delete(key));
  return job;
}
const decode=url=>new Promise(r=>{if(!url)return r();const im=new Image();im.onload=im.onerror=()=>r();im.src=url});

/* ── 펼침면 계산 ── */
function pagesOf(s){if(S.single)return[null,s+1];if(s===0)return[null,1];return[2*s,2*s+1<=S.N?2*s+1:null]}
const maxSpread=()=>S.single?S.N-1:Math.floor(S.N/2);
const spreadOf=p=>S.single?p-1:Math.floor(p/2);

async function setPage(el,n){
  el.classList.toggle('blank',!n);
  const img=el.querySelector('img');
  if(!n){img.removeAttribute('src');return}
  el.classList.add('loading');const u=await renderPage(n);await decode(u);
  img.src=u;el.classList.remove('loading');
}
function updateUI(){
  const [l,r]=pagesOf(S.spread),b=$('book');
  b.classList.toggle('cover-only',!S.single&&!l);
  b.classList.toggle('back-only',!S.single&&!r);
  $('pg').textContent=(S.single?r:[l,r].filter(Boolean).join('–'))+' / '+S.N;$('hPg').textContent=$('pg').textContent;{const cur=Math.max(l||0,r||0)||1,pc=Math.round(cur/S.N*100);$('hBar').style.width=pc+'%';$('navHandle').style.setProperty('--pc',pc+'%');$('hPct').textContent=pc+'%';$('pg').textContent=pc+'%'}
  $('slider').max=maxSpread();$('slider').value=S.spread;
  $('bPrev').disabled=$('bFirst').disabled=S.spread<=0;$('bNext').disabled=S.spread>=maxSpread();
  store.set('pos_'+S.vol.id,l||r);store.set('n_'+S.vol.id,S.N);
  if(typeof bmRender==='function')bmRender();
}
function prefetch(){[-1,1,2].forEach(k=>{const s=S.spread+k;if(s>=0&&s<=maxSpread())pagesOf(s).forEach(renderPage)})}

async function goToPage(p,instant){
  p=Math.max(1,Math.min(S.N,p));S.spread=spreadOf(p);
  const [l,r]=pagesOf(S.spread);
  await Promise.all([setPage($('pL'),l),setPage($('pR'),r)]);
  updateUI();prefetch();
}

/* ── 책장 넘기기 ── */
async function flip(dir){
  if(S.busy||!S.vol||S.inHall)return;
  const ns=S.spread+dir;if(ns<0||ns>maxSpread())return;
  S.busy=true;$('ribbon').classList.remove('on');$('ribbon2').classList.remove('on');
  const [cl,cr]=pagesOf(S.spread),[nl,nr]=pagesOf(ns);
  const urls=await Promise.all([cl,cr,nl,nr].map(renderPage));await Promise.all(urls.map(decode));
  const [ucl,ucr,unl,unr]=urls,book=$('book');
  /* 휘어지며 넘어가는 장 */
  let opt;
  if(S.single){
    if(dir>0){opt={x:0,front:ucr,back:null,mirror:false,reverse:false};await setPage($('pR'),nr)}
    else opt={x:0,front:unr,back:null,mirror:false,reverse:true};
  }else if(dir>0){opt={x:1,front:ucr,back:unl,mirror:false,reverse:false,gut:true};await setPage($('pR'),nr)}
  else{opt={x:0,front:ucl,back:unr,mirror:true,reverse:false,gut:true};await setPage($('pL'),nl)}
  S.spread=ns;
  book.classList.toggle('cover-only',!S.single&&!nl);book.classList.toggle('back-only',!S.single&&!nr);
  await curlFlip(book,opt);
  if(S.single||dir>0)await setPage(S.single?$('pR'):$('pL'),S.single?nr:nl);
  if(!S.single&&dir<0)await setPage($('pR'),nr);
  document.querySelectorAll('.cleaf').forEach(e=>e.remove());
  updateUI();prefetch();S.busy=false;
}


/* ── 종이가 휘었다 펴지는 넘김: 캔버스에 직접 그림(3D 레이어를 쓰지 않아 기기·브라우저마다 깨지지 않음) ──
   장을 가는 세로 띠로 나눠 띠마다 각도를 다르게 주고, 원근(가까울수록 크게)을 계산해 그림 조각과 음영을 그린다.
   그림은 아래 캔버스(밤 모드 색 필터 적용), 음영은 위 캔버스(필터 없음)에 그려 밤에도 음영이 어둡게 유지된다. */
const SEG=30,CSTRIP=120,PERSP=2000;
const loadImg=u=>new Promise(r=>{if(!u)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u});
async function curlFlip(book,o){
  const pR=book.querySelector('.page.R'),W=pR.offsetWidth,H=pR.offsetHeight,BW=book.offsetWidth;
  const [fi,bi]=await Promise.all([loadImg(o.front),loadImg(o.back)]);
  const hx=o.x*W;                                    /* 제본선(경첩) 위치(책 기준) */
  const CW=Math.ceil(W*2.3),CH=Math.ceil(H*1.5),cx=CW/2,cy=(CH-H)/2; /* 캔버스 안에서 경첩의 위치 */
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const root=document.createElement('div');root.className='cleaf';
  root.style.cssText=`left:${hx-cx}px;top:${-cy}px;width:${CW}px;height:${CH}px;transform-style:flat;`+(o.mirror?'transform:scaleX(-1);':'');
  const mkC=cls=>{const c=document.createElement('canvas');c.className=cls;c.width=Math.round(CW*dpr);c.height=Math.round(CH*dpr);c.style.cssText=`position:absolute;inset:0;width:${CW}px;height:${CH}px`;root.appendChild(c);const x=c.getContext('2d');return x};
  const ci=mkC('ccurl');
  /* 밤 모드 색 바꿈은 그림에만 직접 적용(음영은 그대로 어둡게) */
  const bc=document.body.classList,night=bc.contains('night'),sam=bc.contains('samdark');
  const FIL=sam?(night?'none':'invert(1) hue-rotate(180deg)'):(night?'invert(.9) hue-rotate(180deg) sepia(.25) brightness(.92) contrast(.92)':'none');
  const canFil=FIL!=='none'&&('filter' in ci);
  if(FIL!=='none'&&!canFil)ci.canvas.style.filter=FIL;
  book.appendChild(root);
  /* 원근 기준점(책 가운데)을 경첩 기준 좌표로. 거울 모드면 좌우 반전 */
  let ox=BW/2-hx;if(o.mirror)ox=-ox;const oy=H/2;
  const proj=(x,y,z)=>{const k=PERSP/(PERSP-z);return [cx+ox+(x-ox)*k,cy+oy+(y-oy)*k]};
  /* 거울 모드에서는 그림이 다시 뒤집혀 보이지 않도록 미리 좌우 반전한 그림을 씀 */
  const flipImg=im=>{if(!im||!o.mirror)return im;const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(im,0,0);return c};
  const filt=im=>{if(!im||!canFil)return im;const c=document.createElement('canvas');c.width=iw(im);c.height=ih(im);const x=c.getContext('2d');x.filter=FIL;x.drawImage(im,0,0);return c};
  const iw=im=>im?(im.naturalWidth||im.width):0,ih=im=>im?(im.naturalHeight||im.height):0;
  const F=filt(flipImg(fi)),Bk=filt(flipImg(bi));
  const PAPER=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#f4ead6';
  let PAPER_F=PAPER;if(canFil){const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d');x.filter=FIL;x.fillStyle=PAPER;x.fillRect(0,0,2,2);const d=x.getImageData(0,0,1,1).data;PAPER_F=`rgb(${d[0]},${d[1]},${d[2]})`}
  const xs=[];for(let i=0;i<=CSTRIP;i++)xs.push(i*W/CSTRIP);
  /* 제본선 음영: 고정 페이지(.page::after)와 똑같은 모양·진하기 */
  const prof=P=>x=>{const f=x/(.09*W);if(f>=1)return 0;for(let k=1;k<P.length;k++)if(f<=P[k][0]){const [a,va]=P[k-1],[b,vb]=P[k];return va+(vb-va)*(f-a)/(b-a)}return 0};
  const gutR=prof(night?[[0,.58],[.3,.36],[1,0]]:[[0,.40],[.08,.32],[.15,.25],[.3,.17],[.58,.09],[1,0]]);
  const gutL=prof(night?[[0,.62],[.08,.56],[.15,.52],[.3,.45],[.58,.26],[1,0]]:[[0,.22],[1,0]]);
  const gutF=x=>o.gut?(o.mirror?gutL(x):gutR(x)):0,gutB=x=>o.gut?(o.mirror?gutR(x):gutL(x)):0;
  const D=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flip'))||720;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  /* 띠 조각 하나를 사변형(위·아래 네 꼭짓점)에 맞춰 그림: 가는 띠라 평행사변형 근사로 충분 */
  const quad=(ctx,P0,P1,Q0)=>{ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.lineTo(P1[0],P1[1]);ctx.lineTo(P1[0]+Q0[0]-P0[0],P1[1]+Q0[1]-P0[1]);ctx.lineTo(Q0[0],Q0[1]);ctx.closePath()};
  return new Promise(res=>{
    let t0=0;
    function frame(now){
      if(!t0)t0=now;const t=Math.min(1,(now-t0)/D),tt=o.reverse?1-t:t;
      const base=180*ease(tt),bend=140*Math.sin(Math.PI*tt);
      /* 띠마다 각도(제본선 쪽은 덜, 바깥쪽은 더 휘게) */
      const ph=[];let prev=0;
      for(let i=0;i<CSTRIP;i++){let p=base+bend*(Math.pow(i/(CSTRIP-1),1.6)-.35);p=Math.max(prev,Math.min(180,Math.max(0,p)));ph.push(p);prev=p}
      const lift=1-Math.sin(ph[0]*Math.PI/180)*.6;
      /* 3D 위치 누적 */
      const P=[[0,0]];for(let i=0;i<CSTRIP;i++){const r=ph[i]*Math.PI/180,w=xs[i+1]-xs[i];P.push([P[i][0]+w*Math.cos(r),P[i][1]+w*Math.sin(r)])}
      const segs=[];
      for(let i=0;i<CSTRIP;i++){
        const [x0,z0]=P[i],[x1,z1]=P[i+1];
        const a0=proj(x0,0,z0),a1=proj(x1,0,z1),b0=proj(x0,H,z0),b1=proj(x1,H,z1);
        const front=a1[0]>=a0[0];
        /* 띠 양 끝의 음영을 따로 계산해 띠 안에서 부드럽게 이어지게(세로줄 방지). 내려앉는 뒷면의 제본선 음영은 줄이지 않음 */
        const shAt=k=>{const s=Math.sin(ph[Math.min(k,CSTRIP-1)]*Math.PI/180)*Math.min(1,.35+k/CSTRIP);
          return front?Math.min(.75,.28*s+gutF(xs[k])*lift):Math.min(.75,.22*s+gutB(xs[k]))};
        segs.push({i,z:(z0+z1)/2,a0,a1,b0,b1,front,s0:shAt(i),s1:shAt(i+1)});
      }
      segs.sort((p,q)=>p.z-q.z);
      ci.setTransform(1,0,0,1,0,0);ci.clearRect(0,0,ci.canvas.width,ci.canvas.height);
      ci.setTransform(dpr,0,0,dpr,0,0);
      for(const g of segs){
        const im=g.front?F:Bk;
        /* 뒷면에 그릴 쪽이 없으면(한 쪽 보기·표지 끝) 빈 종이를 그리지 않고 비워 둠 → 장이 넘어가며 사라짐 */
        if(!im)continue;
        /* 띠 경계 틈을 막으려고 0.6px 넓혀 그림 */
        const ex=g.a1[0]>=g.a0[0]?.6:-.6;
        const A0=[g.a0[0]-ex,g.a0[1]],A1=[g.a1[0]+ex,g.a1[1]],B0=[g.b0[0]-ex,g.b0[1]];
        ci.save();quad(ci,A0,A1,B0);ci.clip();
        if(im){
          const sw=iw(im)/W,shh=ih(im)/H;
          /* 앞면은 왼→오른쪽, 뒷면은 오른→왼쪽으로 그림 조각을 가져옴 */
          const u0=g.front?xs[g.i]:W-xs[g.i+1],u1=g.front?xs[g.i+1]:W-xs[g.i];
          const O=g.front?g.a0:g.a1,X=g.front?g.a1:g.a0,Y=g.front?g.b0:g.b1;
          const du=u1-u0;
          ci.transform((X[0]-O[0])/du,(X[1]-O[1])/du,(Y[0]-O[0])/H,(Y[1]-O[1])/H,O[0],O[1]);
          const e0=Math.min(1,u0),e1=Math.min(1,W-u1);ci.drawImage(im,(u0-e0)*sw,0,(du+e0+e1)*sw,ih(im),-e0,0,du+e0+e1,H);
        }else{ci.fillStyle=PAPER_F;ci.fill()}
        ci.restore();
        /* 음영: 그림과 똑같이 0.6px 넓힌 영역에 칠함 → 다음 띠의 불투명한 그림이 겹친 부분을 덮어 이중 음영·틈(세로줄)이 생기지 않음 */
        if(g.s0>.002||g.s1>.002){
          const gr=ci.createLinearGradient(g.a0[0],g.a0[1],g.a1[0],g.a1[1]);
          gr.addColorStop(0,`rgba(0,0,0,${g.s0.toFixed(3)})`);gr.addColorStop(1,`rgba(0,0,0,${g.s1.toFixed(3)})`);
          quad(ci,A0,A1,B0);ci.fillStyle=gr;ci.fill();
        }
      }
      if(t<1)requestAnimationFrame(frame);else res();
    }
    requestAnimationFrame(frame);
  });
}

      cx.clearRect(0,0,W,H);
      for(const p of P){
        if(!reduce){p.y-=p.s;p.x+=Math.sin(t*p.w+p.ph)*.0004;if(p.y<-.02){p.y=1.02;p.x=Math.random()}}
        const a=.35+.45*Math.sin(t*.0015+p.ph*3),R=p.r*(devicePixelRatio>1?2:1.2);
        const g=cx.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,R*4);
        g.addColorStop(0,`rgba(255,236,180,${a})`);g.addColorStop(1,'rgba(255,236,180,0)');
        cx.fillStyle=g;cx.beginPath();cx.arc(p.x*W,p.y*H,R*4,0,6.283);cx.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();


/* ═════ 책갈피 (권당 7개, 이 기기·브라우저에 저장) ═════ */
const BM_MAX=7,BM_COL=['#d63a2f','#e8812a','#e8c22e','#3fa34d','#2f7fd6','#2d3f9a','#8a44b8'],BM_NAME=['빨간','주황','노란','초록','파란','남색','보라'];
/* 책갈피는 '펼침면(두 쪽)' 단위로 하나: 같은 펼침면에 두 개가 있으면 하나만 남김 */
const bmPair=p=>p<=1?[1]:(p%2===0?[p,p+1]:[p-1,p]);
const bmKey=p=>bmPair(p)[0];
const bmGet=()=>{if(!S.vol)return[];const a=store.get('bm_'+S.vol.id)||[],seen=new Set(),out=[];
  a.forEach(b=>{const k=bmKey(b.p);if(!seen.has(k)){seen.add(k);out.push(b)}});if(out.length!==a.length)store.set('bm_'+S.vol.id,out);return out};
const bmSet=a=>{store.set('bm_'+S.vol.id,a.sort((x,y)=>x.p-y.p))};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(PT.toast);PT.toast=setTimeout(()=>e.classList.remove('on'),1800)}
function bmVisible(){const [l,r]=pagesOf(S.spread),v=new Set();[l,r].filter(Boolean).forEach(p=>bmPair(p).forEach(q=>v.add(q)));return [...v]}
function bmToggle(){
  /* 가름끈 방식: 지금 보는 쪽에 꽂음. 같은 펼침면에 이미 있으면 → 같은 쪽이면 거두고, 다른 쪽이면 지금 쪽으로 옮김 */
  if(!S.vol)return;const vis=bmVisible(),a=bmGet(),hits=a.filter(b=>vis.includes(b.p)),cur=pagesOf(S.spread).filter(Boolean)[0];
  if(hits.length){const h=hits[0];
    if(h.p===cur){bmSet(a.filter(b=>b!==h));toast(`${BM_NAME[(h.c||0)%7]} 책갈피를 조용히 거두었어요`)}
    else{h.p=cur;const d=new Date();h.d=`${d.getMonth()+1}.${d.getDate()}`;bmSet(a);toast(`${BM_NAME[(h.c||0)%7]} 책갈피를 지금 쪽으로 옮겨 두었어요`)}}
  else{if(a.length>=BM_MAX)return toast('일곱 빛깔 책갈피가 모두 제자리를 찾았어요. 하나를 거두면 다시 꽂을 수 있어요');
    const p=pagesOf(S.spread).filter(Boolean)[0],d=new Date(),used=a.map(b=>b.c),c=[0,1,2,3,4,5,6].find(i=>!used.includes(i));a.push({p,c,d:`${d.getMonth()+1}.${d.getDate()}`});bmSet(a);toast(`${BM_NAME[c]} 책갈피를 살며시 끼워 두었어요`)}
  bmRender();armAutoHide&&armAutoHide();
}
function bmRender(){
  const a=bmGet();a.forEach((b,i)=>{if(b.c==null)b.c=i%7});const vis=S.vol?bmVisible():[],col=b=>BM_COL[b.c%7],hit=a.find(b=>vis.includes(b.p));
  document.querySelectorAll('.bm').forEach(b=>b.classList.toggle('on',!!hit));
  /* 펼친 두 쪽 각각에 리본 표시 */
  const [pl,pr]=S.vol?pagesOf(S.spread):[null,null],pw=$('pR').offsetWidth;
  /* 위치는 CSS가 페이지 폭(--pw) 기준으로 계산 → 화면 크기가 바뀌어도 늘 같은 자리 */
  const slots=S.single?[[pr,'R']]:[[pl,'L'],[pr,'R']];
  ['ribbon','ribbon2'].forEach((id,k)=>{const rb=$(id),sl=slots[k],h=sl&&sl[0]&&a.find(b=>S.single?bmPair(sl[0]).includes(b.p):b.p===sl[0]);
    if(h){rb.style.left='';rb.dataset.slot=sl[1];rb.style.setProperty('--rc',col(h));rb.classList.add('on')}else rb.classList.remove('on')});
  $('hDots').innerHTML=S.N?a.map(b=>`<i style="--p:${(b.p/S.N*100).toFixed(1)}%;--rc:${col(b)}"></i>`).join(''):'';
  $('hBmk').innerHTML=a.map(b=>`<button data-go="${b.p}" class="${vis.includes(b.p)?'here':''}" style="--rc:${col(b)}" title="${BM_NAME[b.c%7]} 책갈피로 이동" data-n="${BM_NAME[b.c%7]}"></button>`).join('');
  $('bmCount').textContent=`${a.length}/${BM_MAX}`;
  $('bmList').innerHTML=a.length?a.map(b=>`<li data-p="${b.p}" style="--rc:${col(b)}">${S.N?Math.round(b.p/S.N*100):0}%<small>${b.d}</small><button data-del="${b.p}" title="빼기">×</button></li>`).join(''):'<li class="empty">꽂은 책갈피가 없습니다</li>';
}
$('bmList').addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');if(del){e.stopPropagation();bmSet(bmGet().filter(b=>b.p!==+del.dataset.del));bmRender();return}
  const li=e.target.closest('li[data-p]');if(li){goToPage(+li.dataset.p);document.body.classList.remove('drawer')}
});
$('bBm').addEventListener('click',bmToggle);
$('hBmk').addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(!t)return;e.stopPropagation();goToPage(+t.dataset.go);toast(`${t.dataset.n} 책갈피가 머문 곳으로 돌아왔어요`)});
$('hBm').addEventListener('click',e=>{e.stopPropagation();bmToggle()});

/* 숨은 입구: 책장 상단 '비밀의 서고'를 1.5초 안에 5번 누르면 책 추가 도우미를 새 창으로 */
{let n=0,t=0;const br=document.querySelector('aside .brand');br.style.cursor='default';
  br.addEventListener('click',e=>{e.stopPropagation();const now=Date.now();n=(now-t<1500)?n+1:1;t=now;
    if(n>=5){n=0;window.open('admin.html','_blank','noopener')}})}
/* 숨은 입구 2: 깊은 서가 제목을 1.5초 안에 5번 누르면 책 추가 도우미 */
{let n=0,t=0;const tt=document.querySelector('.a-title b');tt.style.cursor='default';tt.style.userSelect='none';
  tt.addEventListener('click',e=>{const now=Date.now();n=(now-t<1500)?n+1:1;t=now;if(n>=5){n=0;window.open('admin.html','_blank','noopener')}})}
/* 서고 ↔ 깊은 서가: 좌우로 밀어서 이동(터치), 트랙패드 가로 스크롤도 */
{const sw=(el,dirFn)=>{let x0=null,y0=0,t0=0;
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<800)dirFn(dx<0?'left':'right')},{passive:true});
  let acc=0,lock=0;el.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||lock)return;acc+=e.deltaX;
    if(Math.abs(acc)>120){dirFn(acc>0?'left':'right');acc=0;lock=1;setTimeout(()=>lock=0,900)}},{passive:true})};
  /* 마우스 드래그: 빈 곳을 잡고 옆으로 끌기(책·버튼 위에서 시작하면 무시) */
  const md=(el,dirFn)=>{let x0=null,y0=0,t0=0,moved=false;
    el.addEventListener('mousedown',e=>{if(e.button!==0||e.target.closest('button,a,input,.h-book,.h-pick,.a-book,.spine'))return;x0=e.clientX;y0=e.clientY;t0=Date.now();moved=false});
    addEventListener('mousemove',e=>{if(x0!=null&&Math.abs(e.clientX-x0)>8){moved=true;el.style.cursor='grabbing'}});
    addEventListener('mouseup',e=>{if(x0==null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;el.style.cursor='';
      if(moved&&Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<1200)dirFn(dx<0?'left':'right')})};
  md($('hall'),d=>{if(d==='left'&&S.inHall&&!document.body.classList.contains('all-on'))showAll()});
  md($('allShelf'),d=>{if(d==='right')hideAll()});
  sw($('hall'),d=>{if(d==='left'&&S.inHall&&!document.body.classList.contains('all-on'))showAll()});
  sw($('allShelf'),d=>{if(d==='right')hideAll()});
}
/* 화면 크기가 PC↔휴대폰 기준을 넘나들면 쪽 표시(% / 쪽번호)를 다시 맞춤 */
{let wasPC=innerWidth>860;addEventListener('resize',()=>{const pc=innerWidth>860;if(pc!==wasPC){wasPC=pc;if(S.vol)updateUI();if(typeof fixArrow==='function')fixArrow()}})}
/* 밤 독서 모드: 저장된 선택 > 기기 다크모드 */
{const mq=matchMedia('(prefers-color-scheme: dark)');
  const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
        SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  const sam=/SamsungBrowser/i.test(navigator.userAgent);
  const apply=()=>{document.body.classList.toggle('samdark',sam&&mq.matches);const pick=store.get('night');const on=pick==null?mq.matches:pick;document.body.classList.toggle('night',on);
    const b=$('bNight');b.innerHTML=on?SUN:MOON;b.title=on?'낮 독서 모드로':'밤 독서 모드로';b.classList.remove('on')};
  apply();mq.addEventListener?.('change',()=>{if(store.get('night')==null)apply()});
  $('bNight').onclick=()=>{const on=!document.body.classList.contains('night');store.set('night',on===mq.matches?null:on);apply();
    toast(on?'밤 독서 모드로 바꿨어요':'낮 독서 모드로 바꿨어요');if(typeof armAutoHide==='function')armAutoHide()}}
/* ── 시작 ── */
(async()=>{
  let c;try{const r=await fetch('books.json',{cache:'no-cache'});if(!r.ok)throw 0;c=await r.json()}catch(e){c=FALLBACK}
  normalize(c);document.title=S.lib.name;if(S.lib.home)$('cvBtn').href=S.lib.home;
  buildShelf();layout(true);hallBuild();refreshAllBtns();
  $('bHall').onclick=backToHall;
})();
